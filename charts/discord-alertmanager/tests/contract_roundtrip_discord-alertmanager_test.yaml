# Generated by `just contract-tests`. Do not edit by hand.
#
# Every case below writes one setting into the chart's own value for it — or into `config` where
# no value is bound to that key — and asserts that it arrives in `config.toml`, under the table
# its contract path names. That is the round trip no other gate can see: `just check-config`
# proves the rendered document satisfies the contract, and a document missing a setting entirely
# satisfies it perfectly.
#
# Chart:       discord-alertmanager
# Declaration: charts/discord-alertmanager/config-contract.yaml (document `discord-alertmanager`)
# Contract:    charts/discord-alertmanager/contracts/discord-alertmanager.json
# Coverage:    59 of 79 contract keys carry a probe, 58 through the chart's own value
#
# Regenerate with `just contract-tests`. `just check-contract-tests` fails a pull request whose
# committed copy has drifted from the contract it was generated against.

suite: 'contract round trip (discord-alertmanager)'

# `just render` installs every chart under a release named after it, and the declaration's
# selector is written against that render. Naming the release the same way here is what makes
# `app.kubernetes.io/instance` carry the value the declaration selects on.
release:
  name: discord-alertmanager

# Every case below carries this chart's render prerequisites, the identity case included: chart
# values its own `validateValues` insists on before it will render anything at all. They are
# first-class chart values rather than configuration, and none of them may be written under
# `config` — a prerequisite there would sit in the tree every case probes, free to supply the
# value the case exists to prove the chart delivered. Unlike a baseline, a prerequisite is never
# dropped for the case it would collide with, because a case without it does not render at all;
# the refusal is what takes that dropping's place.
#
# `discord-alertmanager.validateValues` refuses a render that could only produce a
# CrashLoopBackOff, and both of these are that case. `SerenitySink::from_token` and
# `AlertmanagerClient::new` are constructed in `main` before the listener binds, and the second
# returns `Config("no Alertmanager endpoint is configured")` for an empty list — so a release
# missing either exits during startup rather than running degraded. The guard runs from
# `configmap.yaml`, so without both there is no ConfigMap for any case to assert against.
# Neither is one this suite covers in any case. `discord.token` is a credential: it travels the
# Secret under the file name `discord__token` and is never written into the configuration
# document at all, so there is no document pair for a probe to check. `alertmanager.endpoints`
# is `structured` in the contract and is refused a probe for that reason, and is named in the
# generated file's skip list. Supplied as the chart's own first-class values although the guard
# reads the effective tree and would accept the endpoint list through `config` too: `config` is
# where every probe is written, and a prerequisite there is refused. `.invalid` is reserved by
# RFC 2606 and can never resolve, which keeps a value that looks like a deployment's real
# Alertmanager from being mistaken for one. The chart merges `.Values.config` over everything it
# derives from these values, so a probe still wins wherever the two would meet. `existingSecret`
# is the third entry, and it answers a third guard. `storage.backend` is a `choice` whose other
# member is `postgres`, so the case probing it selects that backend — and the chart then refuses
# the render unless a connection URL is available, because the pool is opened during startup.
# Naming a Secret satisfies that without a credential-shaped string in a committed file, and
# changes nothing any case asserts: the URL travels as a file in the secrets directory and never
# reaches `config.toml`. The Secret does not have to exist for a template render.
tests:
  # Every case below selects its document by the key it carries, which is what `check-config.py`
  # reads it from — a label would match the Deployment and the Service too. This case is what
  # ties that selection back to the declaration: the object holding `config.toml` has to be the
  # ConfigMap the declaration names, carrying the labels the declaration selects on.
  - it: renders config.toml on the ConfigMap the declaration selects
    documentSelector:
      path: data["config.toml"]
    set:
      alertmanager.endpoints: ["http://render-prerequisite.invalid:9093"]
      discord.token: render-prerequisite-token
      existingSecret: discord-alertmanager-contract-probe
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: discord-alertmanager

  # The keys below are probed through `config` rather than through the chart's own value for
  # them, which their neighbours use. Each one is declared in the chart's `contract-tests.yaml`
  # with the reason repeated here: such a case proves the raw tree reaches the document and says
  # nothing about the chart's mapping onto the key.
  #
  # storage.sqlite.path:
  #   `discord-alertmanager.validateValues` refuses a `storage.sqlite.path` that is not a file
  #   under `persistence.data.mountPath`: the container runs with a read-only root filesystem,
  #   so the database can only be created inside the mounted volume, and anywhere else the pod
  #   starts, fails to open the file and crash-loops. The probe is a token naming the key it
  #   tests, which no rule derived from the contract could place under a mount path the chart
  #   decides — the contract types this `String` and says nothing about where the file has to
  #   live. The case therefore writes through `config`, where the guard does not read, and
  #   proves the raw tree reaches `storage.sqlite.path` in the document; that the chart's own
  #   `storage.sqlite.path` value reaches it too is covered by `configmap_test.yaml`, which can
  #   pick a path under `/data` because a person wrote it.

