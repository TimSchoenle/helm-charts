{{- /*
The cross-namespace half of the dashboard story: one `GrafanaDashboard` per dashboard file, for
clusters running grafana-operator v5.

Unlike the sidecar ConfigMap next door, whose discovery is configured on the *Grafana* release,
these carry the cross-namespace grant themselves, so a Grafana in another namespace can import
them without cluster-wide sidecar configuration. See `common.grafana.dashboard.*` for the full
reasoning; validation of this block lives in `tankovault.validateValues`.
*/ -}}
{{- if and .Values.metrics.enabled .Values.metrics.dashboard.enabled .Values.metrics.dashboard.grafanaOperator.enabled }}
{{- include "common.grafana.dashboard.customResources" (dict "ctx" . "values" .Values.metrics.dashboard) }}
{{- end }}
