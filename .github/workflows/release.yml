name: Release Charts

on:
  push:
    branches:
      - main

# Queued, never cancelled. chart-releaser packages, creates one GitHub release per chart and then
# pushes `index.yaml` to gh-pages as separate steps, so a run cancelled between them by the next
# merge leaves a release whose chart the Helm repository never lists. The next run does not repair
# it: it only looks at charts changed since the latest tag, which that orphaned release now is.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release Charts
    # The trigger is already `main` only; the guard keeps the job, and the release environment's
    # secrets, unreachable from any other ref should a trigger ever be added above.
    if: github.ref == 'refs/heads/main'
    # The release App key and the chart-signing GPG key belong in this environment rather than at
    # repository level, so no other workflow, and no job a pull request starts, can read them.
    environment:
      name: release
      deployment: false
    # Helm signs through golang.org/x/crypto/openpgp, which reads only v4 keys with the classic
    # secret-key protection, so GPG_PRIVATE_KEY must be exported in that form (gpg 2.4 does so for an
    # RSA key). The runner image's gnupg only dearmors it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # to publish chart releases
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # No token and no persisted credentials: chart-releaser does not use the checkout's. It reads
      # tags and `gh-pages` anonymously from this public repository, and its push to `gh-pages`
      # (`cr index --push`) builds its own authenticated URL from `CR_TOKEN`
      # (`x-access-token:<CR_TOKEN>@` in front of `git remote get-url --push origin`).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Before any secret is in the job: the toolchain and the library dependency build are the
      # only steps here that download and run something other than chart-releaser. The Helm
      # plugins are skipped, since packaging uses neither of them.
      - name: Setup toolchain
        uses: $/.github/actions/setup-toolchain
        with:
          plugins: 'false'

      # chart-releaser packages each chart with `helm package --dependency-update`, which copies
      # `file://../common` as it stands and never builds that library's own dependencies. Without
      # this step `charts/common/charts/` would not exist, and every chart released here would
      # bundle a `common` missing `terrace-helm`.
      - name: Build the library charts' dependencies
        run: just deps-libraries

      # Scoped to what the token does here: chart-releaser creates a release per chart, uploads the
      # packaged chart to it and pushes `index.yaml` to gh-pages. The bot identity lookup reads a
      # public user endpoint and needs no permission. Without this the token inherits every
      # permission the App's installation holds.
      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Configure Git
        uses: TimSchoenle/actions/actions/common/setup-app-git-identity@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-setup-app-git-identity-v2.0.1
        with:
          app-slug: ${{ steps.generate_token.outputs.app-slug }}
          token: ${{ steps.generate_token.outputs.token }}

      # Helm asks for the signing key's passphrase on a terminal unless it is given a file, so the
      # file is written here, readable by this user only. `CR_PASSPHRASE_FILE` is how `cr` takes its
      # `passphrase-file` option from the environment, so the passphrase never appears on a command
      # line.
      - name: Write the GPG passphrase file
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          PASSPHRASE_FILE: ${{ runner.temp }}/gpg-passphrase
        run: |
          set -euo pipefail
          if [ -z "${GPG_PASSPHRASE}" ]; then
            echo "::error::GPG_PASSPHRASE is empty; the chart-signing key is expected to be passphrase-protected."
            exit 1
          fi
          # Helm reads the passphrase file's first line only.
          if [[ "${GPG_PASSPHRASE}" == *$'\n'* ]]; then
            echo "::error::GPG_PASSPHRASE spans several lines; Helm reads only the first, so use a single-line passphrase."
            exit 1
          fi
          umask 077
          printf '%s\n' "${GPG_PASSPHRASE}" > "${PASSPHRASE_FILE}"
          echo "CR_PASSPHRASE_FILE=${PASSPHRASE_FILE}" >> "${GITHUB_ENV}"

      # chart-releaser signs through Helm's Go OpenPGP library, which reads neither gpg-agent nor the
      # keybox, only a legacy keyring file: `cr`'s default `--keyring`, `~/.gnupg/pubring.gpg`. The
      # secret holds an armored secret key export, which is that file's content once dearmored, and
      # it stays encrypted with the passphrase. It is not imported into gpg and exported again: the
      # agent refuses passphrases longer than 255 characters ("Too much data for IPC layer"), while
      # Helm has no such limit. Helm signs with the primary key, so the key must be one whose primary
      # key can sign, not an offline primary with a signing subkey.
      - name: Write the GPG keyring
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Dearmoring reads only the first armor block, so the secret has to start with the private
          # key and hold nothing else, such as the public key pasted alongside it. The check reads
          # the armor lines only, so a Comment header may say anything.
          key="${GPG_PRIVATE_KEY#"${GPG_PRIVATE_KEY%%[![:space:]]*}"}"
          key="${key%"${key##*[![:space:]]}"}"
          armor_lines="$(grep -cE '^-----(BEGIN|END) PGP ' <<< "${key}" || true)"
          if [[ "${key}" != '-----BEGIN PGP PRIVATE KEY BLOCK-----'* \
            || "${key}" != *'-----END PGP PRIVATE KEY BLOCK-----' \
            || "${armor_lines}" -ne 2 ]]; then
            echo "::error::GPG_PRIVATE_KEY must hold only an armored private key block (-----BEGIN PGP PRIVATE KEY BLOCK-----), without the public key."
            exit 1
          fi
          umask 077
          mkdir -p ~/.gnupg
          printf '%s\n' "${key}" | gpg --batch --dearmor > ~/.gnupg/pubring.gpg

      # `version` is stated rather than left to the action's default, so moving the action's pin
      # cannot move the `cr` binary with it unnoticed. The action downloads that release over HTTPS
      # without verifying a checksum; it offers no input for one.
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        with:
          version: v1.10.1
          config: ./.github/configs/cr.yaml
        env:
          CR_TOKEN: ${{ steps.generate_token.outputs.token }}

      # The path is spelled out rather than read from CR_PASSPHRASE_FILE, so the file is removed even
      # when the step that wrote it failed before exporting that variable.
      - name: Remove the keyring and passphrase
        if: always()
        env:
          PASSPHRASE_FILE: ${{ runner.temp }}/gpg-passphrase
        run: rm -f "${PASSPHRASE_FILE}" ~/.gnupg/pubring.gpg
