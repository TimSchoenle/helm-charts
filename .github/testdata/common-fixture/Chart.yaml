apiVersion: v2
name: common-fixture
description: |
  Test-only consumer of the `common` library chart.

  A library chart renders nothing on its own, so `helm unittest` cannot exercise it
  directly. This fixture instantiates every partial so the library has real regression
  coverage. It lives outside `charts/` so that neither chart-testing (`chart-dirs: charts`)
  nor chart-releaser ever sees it — it is never published.
type: application
version: 0.0.0
appVersion: "1.2.3"
dependencies:
  - name: common
    version: 1.0.2
    repository: "file://../../../charts/common"
