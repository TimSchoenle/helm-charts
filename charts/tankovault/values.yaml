  # objects without reducing any privilege.
  create: true

  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Additional annotations for the service account.
  annotations: {}

  # @schema
  # type: string
  # @schema
  # -- Custom service account name (auto-generated if empty).
  name: ""

# @schema
# type: array
# items:
#   type: string
# @schema
# -- Image pull secrets for private registries.
imagePullSecrets: []

# @schema
# type: object
# additionalProperties: true
# @schema
# -- Labels added to every object this chart creates.
commonLabels: {}

# @schema
# type: object
# additionalProperties: true
# @schema
# -- Annotations added to every object this chart creates.
commonAnnotations: {}

# @schema
# type: string
# @schema
# -- Override the detected Kubernetes version used for API version selection.
kubeVersionOverride: ""

# @schema
# type: string
# @schema
# -- Override the chart name used in resource names.
nameOverride: ""

# @schema
# type: string
# @schema
# -- Override the fully qualified release name.
fullnameOverride: ""

# @schema
