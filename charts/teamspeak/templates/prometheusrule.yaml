{{- /*
The alerting and recording rules under `rules/`.

These used to be written inline here, one `{{ if }}` block per alert with a `for` and a
`severity` value each. That shape had two costs and no benefit: rules that live in a Go template
never reach `promtool`, so neither the syntax check nor the evaluation tests in `just test-rules`
ever saw them; and every knob had to be invented and documented again per alert instead of coming
from the preset surface every other chart in this repository shares.

Which *series* the rules then match is a separate problem with a separate answer: see
`teamspeak.rules.scopePlaceholder` for why every selector in the files carries a placeholder
matcher, and `common.prometheus.rules.*` for why the files are parsed rather than templated —
briefly, Prometheus renders annotations with the same `{{ }}` delimiters Helm uses, so a
`$labels` reference has to reach it as file data rather than through the template engine.
*/ -}}
{{- if and .Values.metrics.enabled .Values.metrics.prometheusRule.enabled }}
{{- include "common.prometheus.rules.prometheusRule" (dict
      "ctx" .
      "values" .Values.metrics.prometheusRule
      "scopePlaceholder" (include "teamspeak.rules.scopePlaceholder" .)
      "scopeMatcher" (include "teamspeak.rules.scopeMatcher" .)) }}
{{- end }}
