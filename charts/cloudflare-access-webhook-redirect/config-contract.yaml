# vim: set ft=yaml:
# yaml-language-server: $schema=https://raw.githubusercontent.com/TimSchoenle/terrace-config/main/spec/helm/v1/declaration.schema.json

# What this chart's rendered configuration must satisfy, which images decide that, and the gates
# the chart is enrolled in. A key left out takes its default (spec/helm/v1/DEFAULTS.md in
# terrace-config): the ConfigMap labelled with the release, its `config.toml`, the one image at
# `image` with its contract under the document's name, and the workloads that mount it.
# This prints the file with every default written out:
#
#   terrace-contract config show --chart cloudflare-access-webhook-redirect

# Whether `just check-config-bindings` holds this chart's values against the keys below.
#
# Declared rather than inferred from the chart carrying markers: a chart that loses them — a
# botched edit, a spelling the parser does not recognise — would otherwise drop out of that
# gate's report without a word. With the switch here, markers without it and it without markers
# are both errors.
bindings: true

# Enrols this chart in the generated round-trip suites (`just contract-tests`). They prove what
# `just check-config` cannot: that a setting written into `config` arrives in the rendered document
# at the path the image reads it from. Each document's `tests` block states what every generated
# case has to carry before this chart will render.
tests: true

# Contract keys no chart value binds, each group with the reason it does not.
#
# Chart-level: a key nothing surfaces is unsurfaced in every document that declares it, and this
# chart declares one. Secret keys are not exempt by default and each one is written out — the
# blanket rule "credentials need no marker" cannot tell a key delivered as a file from a key a
# chart merely forgot, and the second is exactly the regression this gate exists to catch.
unbound:
  - keys:
      - cloudflare.client_id
      - cloudflare.client_secret
      - telemetry.sentry.dsn
    reason: >-
      Delivered as files in the secrets directory — from the Secret this chart renders, or from
      `existingSecret` under the file names `cloudflare__client_id`, `cloudflare__client_secret`
      and `telemetry__sentry__dsn` — and never written into `config.toml`, because the Access
      service-token pair authenticates this proxy to Cloudflare and the DSN embeds an ingest key,
      and a credential in a ConfigMap is readable by anything that can read the namespace.
      `cloudflare.clientId`, `cloudflare.clientSecret` and `telemetry.sentry.dsn` are the values
      that carry them, so all three bindings exist; they simply do not run through the
      configuration document the markers describe. `just check-config-secrets` is what reconciles
      that channel, and it does it from the rendered manifests rather than from a comment.

# What this chart adds to the credential reference in its README, which `just config-readme`
# generates from the contract. The rows are the contract's — every key it marks `secret: true`,
# and whether the image requires it — and these two columns are the chart's: the value an
# operator may set instead of pre-creating the Secret, and the condition under which a release
# needs the credential at all. Neither is derivable, and both are refused once they go stale: an
# entry for a key the contract stops declaring secret, or a `value` this chart's values.yaml no
# longer exposes, fails the gate.
credentials:
  - key: cloudflare.client_id
    value: cloudflare.clientId
    note: with `cloudflare.clientSecret`, to verify the Access JWT
  - key: cloudflare.client_secret
    value: cloudflare.clientSecret
    note: with `cloudflare.clientId`
  - key: telemetry.sentry.dsn
    value: telemetry.sentry.dsn
    note: "`telemetry.sentry.enabled`"

documents:
  - name: redirect
    tests:
      # The chart values every generated case carries, the identity case among them: this chart's
      # `validateValues` fails the template before a ConfigMap exists for any case to assert
      # against, so there is no case here that can do without them.
      #
      # Flat dotted paths, exactly as the helm-unittest `set` block they become spells them, and a
      # leaf is free to be a structure — `webhook.paths` is a map and splitting it into one path
      # per method list would read worse than the map it stands for. Nothing here may name a path
      # under `config`: a prerequisite is never dropped for the case it collides with, the way a
      # baseline is, so one written into the tree the cases probe could supply the very value a
      # case exists to prove the chart delivered. The generator refuses one outright.
      prerequisites:
        values:
          webhook.paths:
            "/render-prerequisite/.*": [ALL]
          webhook.targetBase: https://render-prerequisite.invalid
          existingSecret: cloudflare-access-contract-probe

        reason: >-
          `cloudflare-access-webhook-redirect.validateValues` refuses a render whose effective
          configuration carries neither `webhook.target_base` nor `webhook.paths` — a proxy with no
          target and no allowed path forwards nothing — and it runs from `configmap.yaml`, so
          without both there is no document for any case to assert against. Supplied as the chart's
          own first-class values although the guard reads the effective tree and would accept them
          through `config` too: `config` is where every probe is written, and a prerequisite there
          is refused for that reason. Neither key is one this suite covers in any case —
          `webhook.target_base` is `unknown` in the contract and `webhook.paths` is `structured`,
          so both are refused a probe and named in the generated file's skip list. `.invalid` is
          reserved by RFC 2606 and can never resolve, which keeps a value that looks like a
          deployment's real target from being mistaken for one. The chart merges `.Values.config`
          over everything it derives from these values, so a probe still wins wherever the two
          would meet.

          `existingSecret` is the third entry, and it answers a different guard. Every
          `telemetry.sentry.*` key carries a `when telemetry.sentry.enabled` clause, so a case
          probing one switches Sentry on and the chart then refuses the render unless a DSN is
          available. Naming a Secret satisfies that without a credential-shaped string in a
          committed file, and changes nothing the cases assert against: the DSN travels as a file
          in the secrets directory and never reaches `config.toml`. The Secret does not have to
          exist for a template render.
