# Generated by `just contract-tests`. Do not edit by hand.
#
# Every case below writes one setting into `config` and asserts that it arrives in
# `config.toml`, under the table its contract path names. That is the round trip no other gate
# can see: `just check-config` proves the rendered document satisfies the contract, and a
# document missing a setting entirely satisfies it perfectly.
#
# Chart:       portfolio
# Declaration: charts/portfolio/config-contract.yaml (document `server`)
# Contract:    charts/portfolio/contracts/server.json
# Coverage:    19 of 22 contract keys carry a probe
#
# Regenerate with `just contract-tests`. `just check-contract-tests` fails a pull request whose
# committed copy has drifted from the contract it was generated against.

suite: 'contract round trip (server)'

# `just render` installs every chart under a release named after it, and the declaration's
# selector is written against that render. Naming the release the same way here is what makes
# `app.kubernetes.io/instance` carry the value the declaration selects on.
release:
  name: portfolio

tests:
  # Every case below selects its document by the key it carries, which is what `check-config.py`
  # reads it from — a label would match the Deployment and the Service too. This case is what
  # ties that selection back to the declaration: the object holding `config.toml` has to be the
  # ConfigMap the declaration names, carrying the labels the declaration selects on.
  - it: renders config.toml on the ConfigMap the declaration selects
    documentSelector:
      path: data["config.toml"]
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: portfolio

  # Every case below also carries the chart's baseline values, minus whichever of them the case
  # is itself probing — a baseline that supplied the probed value would make the assertion pass
  # whether or not the chart delivered anything. The baseline exists because a chart may refuse
  # to render a combination the contract considers legal, and a probe that walked into one would
  # fail for a reason that has nothing to do with the round trip.
  #
  # `portfolio.validateValues` fails the render when `csp.hash_inline_scripts` is false while
  # `csp.cloudflare.script_nonce` is true — dropping the hashes restores `'unsafe-inline'`,
  # which a browser ignores as soon as the policy carries a nonce, so every document would
  # render blank. Both keys are optional booleans defaulting to true, so the probe for the first
  # is `false` and would walk straight into the pair. Turning the nonce off across the suite is
  # the combination the chart's own tests already call legitimate: a deployment with no
  # Cloudflare bot product in front of it. The entry is dropped from the case probing
  # `csp.cloudflare.script_nonce` itself, which is what keeps that case proving the chart
  # delivered the value rather than the baseline having supplied it.

  - it: delivers assets.dist_dir into config.toml
    documentSelector:
      path: data["config.toml"]
    set:
      config.csp.cloudflare.script_nonce: false
      config.assets.dist_dir: contract-probe-assets-dist-dir
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '(?m)^\[assets\]$\n(?:[^\[\n][^\n]*\n|\n)*^dist_dir = "contract-probe-assets-dist-dir"$'

  - it: delivers csp.cloudflare.script_nonce into config.toml
    documentSelector:
      path: data["config.toml"]
    set:
      config.csp.cloudflare.script_nonce: false
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '(?m)^\[csp\.cloudflare\]$\n(?:[^\[\n][^\n]*\n|\n)*^script_nonce = false$'

  - it: delivers csp.cloudflare.turnstile into config.toml
    documentSelector:
      path: data["config.toml"]
    set:
      config.csp.cloudflare.script_nonce: false
      config.csp.cloudflare.turnstile: true
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '(?m)^\[csp\.cloudflare\]$\n(?:[^\[\n][^\n]*\n|\n)*^turnstile = true$'

  - it: delivers csp.cloudflare.web_analytics into config.toml
