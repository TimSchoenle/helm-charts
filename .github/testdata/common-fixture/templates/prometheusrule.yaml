as Go templates is caught here.
*/ -}}
{{- include "common.prometheus.rules.validate" (dict "ctx" . "values" .Values.prometheusRule) }}
{{- if .Values.prometheusRule.enabled }}
{{- include "common.prometheus.rules.prometheusRule" (dict "ctx" . "values" .Values.prometheusRule) }}
{{- end }}
