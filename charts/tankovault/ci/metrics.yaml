# Autoscaling, disruption budgets and the full Prometheus Operator surface.
#
# A render fixture, not an install fixture — it runs on external datastores whose endpoints do
# not resolve. Hence the name: `ct install` takes every `ci/*-values.yaml`, while the render and
# policy jobs glob `ci/*.yaml`.
auth:
  jwtSecret: ci-jwt-secret-0123456789abcdef0123
internal:
  # The `token` path. The chart defaults to `mtls`, which needs cert-manager and a CA;
  # `ci/internal-mtls.yaml` is the fixture that renders that one. Both tokens are set explicitly
  # for the same reason `auth.jwtSecret` is — `helm template` has no cluster to read a generated
  # value back out of, so an empty one would render differently on every invocation.
  identity: token
  tokens:
    api: ci-internal-token-api-0123456789abcdef
    worker: ci-internal-token-worker-0123456789ab
anilist:
  clientId: "12345"
  clientSecret: ci-anilist-client-secret
  tokenEncryptionKey: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  redirectUri: https://tankovault.example.com/account/anilist-callback
externalDatabase:
  url: postgres://tankovault:ci@postgresql.example.com:5432/tankovault
externalNats:
  url: nats://nats.example.com:4222
externalTrawl:
  url: http://trawl.example.com:8191
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  prometheusRule:
    enabled: true
    labels:
      release: kube-prometheus-stack
  natsExporter:
    enabled: true
    # This fixture runs on external datastores, and the exporter reads NATS' monitoring listener
    # rather than its client port — so unlike every other dependency here it cannot be derived
    # from `externalNats.url` and has to be named outright.
    url: http://nats.example.com:8222
  dashboard:
    enabled: true
    # Both delivery mechanisms at once, which is the supported combination: the sidecar ConfigMap
    # holds the JSON and the GrafanaDashboard resources reference it. Rendering this fixture
    # requires `--api-versions grafana.integreatly.org/v1beta1`, which both CI scripts pass.
    grafanaOperator:
      enabled: true
      folder: TankoVault
services:
  api:
    autoscaling:
      enabled: true
    podDisruptionBudget:
      enabled: true
  worker:
    autoscaling:
      enabled: true
    podDisruptionBudget:
      enabled: true
  frontend:
    autoscaling:
      enabled: true
    podDisruptionBudget:
      enabled: true
