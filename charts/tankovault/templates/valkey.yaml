{{- if .Values.valkey.enabled }}
{{- $valkey := .Values.valkey }}
{{- /*
  A Deployment, not a StatefulSet, and no PVC: everything TankoVault keeps here is derived
  state — rate-limit counters, SSE tickets and the scheduler's leader lock. Losing it costs one
  leader re-election and a rate-limit window, which is why persistence would be a liability
  (stale locks surviving a restart) rather than a feature. Persistence is turned off in the
  server too, so the container never needs a writable path.
*/ -}}
{{- $probe := dict "enabled" true "exec" (dict "command" (list "valkey-cli" "ping")) }}
{{- $values := include "tankovault.datastore.values" (dict
      "ctx" .
      "image" $valkey.image
      "resourcesPreset" $valkey.resourcesPreset
      "runAsUser" 1000 "runAsGroup" 1000 "fsGroup" 1000
      "livenessProbe" (merge (dict "periodSeconds" 30 "timeoutSeconds" 5 "failureThreshold" 5) (deepCopy $probe))
      "readinessProbe" (merge (dict "periodSeconds" 10 "timeoutSeconds" 3 "failureThreshold" 3) (deepCopy $probe))
    ) | fromYaml }}
{{- $ctx := dict "Values" $values "Chart" $.Chart "Release" $.Release "Capabilities" $.Capabilities "Template" $.Template "Files" $.Files }}
apiVersion: v1
kind: Service
metadata:
  {{- include "tankovault.datastore.metadata" (dict "ctx" . "component" "valkey") | nindent 2 }}
spec:
  type: ClusterIP
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
      protocol: TCP
  selector:
    {{- include "tankovault.datastore.selectorLabels" (dict "ctx" . "component" "valkey") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  {{- include "tankovault.datastore.metadata" (dict "ctx" . "component" "valkey") | nindent 2 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "tankovault.datastore.selectorLabels" (dict "ctx" . "component" "valkey") | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "common.podLabels" $ctx | nindent 8 }}
        app.kubernetes.io/component: valkey
    spec:
      {{- include "common.podSpec.common" $ctx | nindent 6 }}
      containers:
        {{- include "common.container" (dict
              "ctx" $ctx
              "name" "valkey"
              "command" (list "valkey-server")
              "args" (list "--save" "" "--appendonly" "no" "--protected-mode" "no")
              "ports" (list (dict "name" "valkey" "containerPort" 6379 "protocol" "TCP"))
            ) | nindent 8 }}
      {{- with (include "common.volumes" (dict "ctx" $ctx)) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
{{- end }}
