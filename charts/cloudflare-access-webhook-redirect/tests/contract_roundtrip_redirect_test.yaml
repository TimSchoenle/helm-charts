# Generated by `just contract-tests`. Do not edit by hand.
#
# Every case below writes one setting into `config` and asserts that it arrives in
# `config.toml`, under the table its contract path names. That is the round trip no other gate
# can see: `just check-config` proves the rendered document satisfies the contract, and a
# document missing a setting entirely satisfies it perfectly.
#
# Chart:       cloudflare-access-webhook-redirect
# Declaration: charts/cloudflare-access-webhook-redirect/config-contract.yaml (document `redirect`)
# Contract:    charts/cloudflare-access-webhook-redirect/contracts/redirect.json
# Coverage:    13 of 23 contract keys carry a probe
#
# Regenerate with `just contract-tests`. `just check-contract-tests` fails a pull request whose
# committed copy has drifted from the contract it was generated against.

suite: 'contract round trip (redirect)'

# `just render` installs every chart under a release named after it, and the declaration's
# selector is written against that render. Naming the release the same way here is what makes
# `app.kubernetes.io/instance` carry the value the declaration selects on.
release:
  name: cloudflare-access-webhook-redirect

# Every case below carries this chart's render prerequisites, the identity case included: chart
# values its own `validateValues` insists on before it will render anything at all. They are
# first-class chart values rather than configuration, and none of them may be written under
# `config` — a prerequisite there would sit in the tree every case probes, free to supply the
# value the case exists to prove the chart delivered. Unlike a baseline, a prerequisite is never
# dropped for the case it would collide with, because a case without it does not render at all;
# the refusal is what takes that dropping's place.
#
# `cloudflare-access-webhook-redirect.validateValues` refuses a render whose effective
# configuration carries neither `webhook.target_base` nor `webhook.paths` — a proxy with no
# target and no allowed path forwards nothing — and it runs from `configmap.yaml`, so without
# both there is no document for any case to assert against. Supplied as the chart's own
# first-class values although the guard reads the effective tree and would accept them through
# `config` too: `config` is where every probe is written, and a prerequisite there is refused
# for that reason. Neither key is one this suite covers in any case — `webhook.target_base` is
# `unknown` in the contract and `webhook.paths` is `structured`, so both are refused a probe and
# named in the generated file's skip list. `.invalid` is reserved by RFC 2606 and can never
# resolve, which keeps a value that looks like a deployment's real target from being mistaken
# for one. The chart merges `.Values.config` over everything it derives from these values, so a
# probe still wins wherever the two would meet.
tests:
  # Every case below selects its document by the key it carries, which is what `check-config.py`
  # reads it from — a label would match the Deployment and the Service too. This case is what
  # ties that selection back to the declaration: the object holding `config.toml` has to be the
  # ConfigMap the declaration names, carrying the labels the declaration selects on.
  - it: renders config.toml on the ConfigMap the declaration selects
    documentSelector:
      path: data["config.toml"]
    set:
      webhook.paths: {"/render-prerequisite/.*": ["ALL"]}
      webhook.targetBase: 'https://render-prerequisite.invalid'
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: cloudflare-access-webhook-redirect

  - it: delivers server.host into config.toml
    documentSelector:
      path: data["config.toml"]
    set:
      webhook.paths: {"/render-prerequisite/.*": ["ALL"]}
      webhook.targetBase: 'https://render-prerequisite.invalid'
      config.server.host: contract-probe-server-host
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '(?m)^\[server\]$\n(?:[^\[\n][^\n]*\n|\n)*^host = "contract-probe-server-host"$'

  - it: delivers server.port into config.toml
    documentSelector:
      path: data["config.toml"]
    set:
      webhook.paths: {"/render-prerequisite/.*": ["ALL"]}
      webhook.targetBase: 'https://render-prerequisite.invalid'
