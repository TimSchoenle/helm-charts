{{- /*
The Service the Ingress, the HTTPRoute and anything else in the cluster reaches the web UI and
the REST API on. One port, because the pod serves exactly one listener — the task workers, the
scheduler and the directory watcher beside it speak to the broker and to nothing inbound.
*/ -}}
{{- $nodePortsHonoured := has .Values.service.type (list "NodePort" "LoadBalancer") -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.fullname" . }}
  namespace: {{ include "common.namespace" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  {{- with (include "common.tplvalues.merge" (dict "values" (list .Values.service.annotations .Values.commonAnnotations) "context" $)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with .Values.service.sessionAffinity }}
  sessionAffinity: {{ . }}
  {{- end }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  ports:
    - name: http
      port: {{ int .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and .Values.service.nodePort $nodePortsHonoured }}
      nodePort: {{ int .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "paperless-ngx.selectorLabels" . | nindent 4 }}
