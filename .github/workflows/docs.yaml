name: Docs

# The drift gate for the root README, and only for it.
#
# Rendering happens in the Documentation job of `ci.yaml`, and its Commit Documentation job commits
# the result back to the pull request branch. Neither can gate anything: they repair the file rather
# than failing on it, and the commit needs the App token, which a fork does not get, so a fork's
# render is never committed. This workflow is the other half —
# it renders with `check: true`, writes nothing, and fails when the committed README.md does not
# match its template.
#
# Kept out of `ci.yaml` because that workflow is pull-request-only by design and its other jobs
# build kind clusters. Adding a `push: main` trigger there to reach this one check would run all
# of them on every merge.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    name: readme
    # Same-repo pull requests are covered by the Documentation and Commit Documentation jobs, which
    # fix the file instead of reporting it. Running here as well would fail every pull request that
    # legitimately edits the template, in the window before that commit lands.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to checkout code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: $/.github/actions/setup-toolchain

      # The same two steps `ci.yaml` renders from, in the same order and with the same inputs. A
      # difference between them would make this gate fail on a README the render job just wrote.
      - name: Collect chart metadata
        id: chart-index
        run: |
          set -euo pipefail
          index="$(just chart-index)"
          echo "json=${index}" >> "$GITHUB_OUTPUT"

      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-readme-variables-v1.2.9
        with:
          manifest: charts/common/Chart.yaml
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.chart-index.outputs.json }}

      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}
          check: 'true'
