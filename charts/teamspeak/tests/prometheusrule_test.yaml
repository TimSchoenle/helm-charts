suite: test prometheusrule
templates:
  - prometheusrule.yaml
set:
  license.accept: true
  serverQuery.adminPassword: hunter2
tests:
  - it: renders nothing while the exporter is not running
    set:
      metrics.prometheusRule.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: is opt-in even with the exporter running
    set:
      metrics.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: ships the five built-in alerts
    set:
      metrics.enabled: true
      metrics.prometheusRule.enabled: true
    asserts:
      - isKind:
          of: PrometheusRule
      - lengthEqual:
          path: spec.groups
          count: 1
      - lengthEqual:
          path: spec.groups[0].rules
          count: 5
      - equal:
          path: spec.groups[0].rules[0].alert
          value: TeamSpeakExporterDown

  # The `job` label a PodMonitor produces depends on operator configuration this chart does
  # not control; namespace and pod are always there.
  - it: scopes every expression to this release
    set:
      metrics.enabled: true
      metrics.prometheusRule.enabled: true
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[0].expr
          pattern: 'namespace="NAMESPACE", pod=~"RELEASE-NAME-teamspeak-\.\*"'
      - matchRegex:
          path: spec.groups[0].rules[1].expr
          pattern: '^ts3_serverinfo_online\{namespace="NAMESPACE"'

  - it: applies the configured thresholds and severities
    set:
      metrics.enabled: true
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.rules.slotsNearlyFull.threshold: 0.75
      metrics.prometheusRule.rules.slotsNearlyFull.severity: critical
      metrics.prometheusRule.rules.serverRestarted.thresholdSeconds: 600
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[2].expr
          pattern: "< 600$"
      - matchRegex:
          path: spec.groups[0].rules[3].expr
          pattern: "> 0.75$"
      - equal:
          path: spec.groups[0].rules[3].labels.severity
          value: critical

  - it: drops the rules that were switched off
    set:
      metrics.enabled: true
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.rules.serverRestarted.enabled: false
      metrics.prometheusRule.rules.slotsNearlyFull.enabled: false
    asserts:
      - lengthEqual:
          path: spec.groups[0].rules
          count: 3

  - it: appends additional rules
    set:
      metrics.enabled: true
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.additionalRules:
        - alert: TeamSpeakCustom
          expr: vector(1)
          labels:
            severity: none
    asserts:
      - lengthEqual:
          path: spec.groups[0].rules
          count: 6
      - equal:
          path: spec.groups[0].rules[5].alert
          value: TeamSpeakCustom

  # Helm and Prometheus share the {{ }} delimiters, so the $labels references have to survive
  # rendering as literals.
  - it: leaves Prometheus' own annotation templating intact
    set:
      metrics.enabled: true
      metrics.prometheusRule.enabled: true
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[1].annotations.summary
          pattern: '\{\{ \$labels\.virtualserver \}\}'

  - it: can be placed in another namespace and labelled for a specific Prometheus
    set:
      metrics.enabled: true
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.namespace: monitoring
      metrics.prometheusRule.labels:
        release: kube-prometheus-stack
    asserts:
      - equal:
          path: metadata.namespace
          value: monitoring
      - equal:
          path: metadata.labels.release
          value: kube-prometheus-stack
