{{- if .Values.flaresolverr.enabled }}
{{- $fs := .Values.flaresolverr }}
{{- /*
  `runAsUser` is set explicitly and cannot be dropped. The upstream image's `USER` directive
  names a user rather than a UID, and the kubelet cannot verify `runAsNonRoot: true` against a
  non-numeric user — it refuses to start the pod with `container has runAsNonRoot and image has
  non-numeric user`. The value is the UID `useradd` assigns in that image.

  Chromium needs a writable HOME for its profile and crashpad database, and far more shared
  memory than the 64Mi Kubernetes gives `/dev/shm` by default; both are emptyDirs so the root
  filesystem can stay read-only.
*/ -}}
{{- $probe := dict "enabled" true "tcpSocket" (dict "port" "http") }}
{{- $values := include "tankovault.datastore.values" (dict
      "ctx" .
      "image" $fs.image
      "resourcesPreset" $fs.resourcesPreset
      "runAsUser" $fs.runAsUser "runAsGroup" $fs.runAsUser "fsGroup" $fs.runAsUser
      "startupProbe" (merge (dict "periodSeconds" 5 "timeoutSeconds" 3 "failureThreshold" 30) (deepCopy $probe))
      "livenessProbe" (merge (dict "periodSeconds" 30 "timeoutSeconds" 5 "failureThreshold" 5) (deepCopy $probe))
      "readinessProbe" (merge (dict "periodSeconds" 10 "timeoutSeconds" 3 "failureThreshold" 3) (deepCopy $probe))
    ) | fromYaml }}
{{- $ctx := dict "Values" $values "Chart" $.Chart "Release" $.Release "Capabilities" $.Capabilities "Template" $.Template "Files" $.Files }}
{{- $home := "/home/flaresolverr" }}
{{- $mounts := list
      (dict "name" "home" "mountPath" $home)
      (dict "name" "dshm" "mountPath" "/dev/shm") }}
{{- $volumes := list
      (dict "name" "home" "emptyDir" dict)
      (dict "name" "dshm" "emptyDir" (dict "medium" "Memory" "sizeLimit" $fs.shmSize)) }}
apiVersion: v1
kind: Service
metadata:
  {{- include "tankovault.datastore.metadata" (dict "ctx" . "component" "flaresolverr") | nindent 2 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8191
      targetPort: http
      protocol: TCP
  selector:
    {{- include "tankovault.datastore.selectorLabels" (dict "ctx" . "component" "flaresolverr") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  {{- include "tankovault.datastore.metadata" (dict "ctx" . "component" "flaresolverr") | nindent 2 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "tankovault.datastore.selectorLabels" (dict "ctx" . "component" "flaresolverr") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.podLabels" $ctx | nindent 8 }}
        app.kubernetes.io/component: flaresolverr
    spec:
      {{- include "common.podSpec.common" $ctx | nindent 6 }}
      containers:
        {{- include "common.container" (dict
              "ctx" $ctx
              "name" "flaresolverr"
              "ports" (list (dict "name" "http" "containerPort" 8191 "protocol" "TCP"))
              "env" (list
                (dict "name" "HOME" "value" $home)
                (dict "name" "LOG_LEVEL" "value" "info"))
              "volumeMounts" $mounts
            ) | nindent 8 }}
      volumes:
        {{- include "common.volumes" (dict "ctx" $ctx "volumes" $volumes) | nindent 8 }}
{{- end }}
