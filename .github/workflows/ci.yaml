name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # `values.schema.json` and `README.md` are generated from `values.yaml` and `README.md.gotmpl`.
  # This job regenerates them and commits the result back to the PR branch, so contributors
  # never have to run the toolchain locally. The other jobs deliberately do not gate on it:
  # the follow-up push re-runs the whole workflow against the corrected tree anyway, and
  # skipping them here would drop lint, unit tests and install on exactly the runs that
  # change a chart's values.
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit documentation changes
      pull-requests: write # to comment on PRs
      issues: write # to comment on PRs
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.generate_token.outputs.token }}
          persist-credentials: true

      - name: Setup Helm Environment
        uses: ./.github/actions/setup-helm

      - name: Build Helm dependencies
        uses: ./.github/actions/build-deps

      - name: Generate schemas
        run: helm schema --add-schema-reference --chart-search-root charts

      - name: Run helm-docs
        uses: losisin/helm-docs-github-action@3a4528e97c49a5e83de6b78c50c61c8ee5c9f944 # v2
        with:
          chart-search-root: charts
          template-files: README.md.gotmpl

      - name: Commit documentation changes
        id: auto-commit
        uses: TimSchoenle/actions/actions/common/commit-changes@5373ad973e0bf692b19771bf68f201237a7ad1f1 # tag=actions-common-commit-changes-v1.2.0
        with:
          commit_message: "docs: update Helm chart documentation and schemas"
          token: ${{ steps.generate_token.outputs.token }}

      - name: Comment on PR
        if: steps.auto-commit.outputs.changes_detected == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📚 Helm chart documentation and schema have been automatically updated.'
            })

  unit-test:
    name: Unit Tests (Helm ${{ matrix.helm }})
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout code
    strategy:
      fail-fast: false
      matrix:
        # The release pipeline runs Helm 3; 4.x is tracked here so a toolchain bump becomes a
        # deliberate, visible change rather than a surprise from `version: latest`.
        helm: ['v3.21.3', 'v4.2.3']
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Helm Environment
        uses: ./.github/actions/setup-helm
        with:
          helm-version: ${{ matrix.helm }}

      - name: Build Helm dependencies
        uses: ./.github/actions/build-deps

      - name: Run chart unit tests
        run: |
          set -euo pipefail
          for chart in charts/*/; do
            if [ -d "$chart/tests" ]; then
              echo "::group::helm unittest $chart"
              helm unittest "$chart"
              echo "::endgroup::"
            else
              echo "No tests found for $chart, skipping..."
            fi
          done

      # A library chart renders nothing on its own, so `charts/common` cannot be tested
      # directly. This fixture instantiates every partial.
      - name: Run common library tests
        run: helm unittest .github/testdata/common-fixture

  lint:
    name: Lint Charts
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Helm Environment
        uses: ./.github/actions/setup-helm

      - name: Build Helm dependencies
        uses: ./.github/actions/build-deps

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      # `ct` cannot install a library chart, so `common` stays in `excluded-charts` there and
      # is covered by `helm lint` plus the fixture's unit tests instead.
      - name: Lint the common library
        run: helm lint charts/common

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config ./.github/configs/ct-lint.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --debug --config ./.github/configs/ct-lint.yaml --lint-conf ./.github/configs/lintconf.yaml

  validate-manifests:
    name: Validate Manifests (k8s ${{ matrix.kubernetes }})
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout code
    strategy:
      fail-fast: false
      matrix:
        # Spans the `common.capabilities.*` branch points, so API-version selection is
        # exercised rather than assumed.
        kubernetes: ['1.28.0', '1.31.0', '1.34.0']
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Helm Environment
        uses: ./.github/actions/setup-helm

      - name: Build Helm dependencies
        uses: ./.github/actions/build-deps

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.7.0
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Render and validate every chart against every ci/ values file
        env:
          KUBE_VERSION: ${{ matrix.kubernetes }}
        run: bash ./.github/scripts/validate-manifests.sh

  policy-scan:
    name: Policy Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Helm Environment
        uses: ./.github/actions/setup-helm

      - name: Build Helm dependencies
        uses: ./.github/actions/build-deps

      - name: Render all charts
        run: bash ./.github/scripts/render-charts.sh rendered

      # Enforces the restricted Pod Security Standard the charts now claim, so a later change
      # cannot quietly regress the baseline.
      - name: Run kube-linter
        uses: stackrox/kube-linter-action@87802a2f4e01abebb3ee3c67a3002fea71f6eae5 # v1.0.7
        with:
          directory: rendered
          config: .github/configs/kube-linter.yaml

  install:
    name: Install & Verify (k8s ${{ matrix.kubernetes }})
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout code
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ['v1.31.0', 'v1.34.0']
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Helm Environment
        uses: ./.github/actions/setup-helm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config ./.github/configs/ct-lint.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          node_image: kindest/node:${{ matrix.kubernetes }}
          wait: '120s'

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --config ./.github/configs/ct-lint.yaml

  renovate-validate:
    name: Validate Renovate Config
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Renovate configuration
        uses: suzuki-shunsuke/github-action-renovate-config-validator@ee9f69e1f683ed0d08225086482b34fc9abe9300 # v2.1.0
