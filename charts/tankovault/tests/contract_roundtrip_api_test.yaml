  # which the chart's enrolment states because this chart merges its derived wiring *over*
  # `config` rather than under it. A probe written into `config` for a key the chart derives
  # would be overwritten before it reached the document, and the case would fail on a chart that
  # is behaving correctly. What that costs is real: `services.api.config` is the layer these
  # cases prove, and nothing here proves `config` still reaches a key the chart does not derive.
