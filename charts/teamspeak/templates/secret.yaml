{{- /*
Credentials the server and the exporter consume by reference.

Rendered only when this chart actually has secret material to hold: an operator-supplied
`existingSecret` replaces it entirely, and a SQLite server that lets the image generate its
own admin password has nothing to store.
*/ -}}
{{- if (include "teamspeak.createSecret" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.fullname" . }}
  namespace: {{ include "common.namespace" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  {{- with (include "common.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- with .Values.serverQuery.adminPassword }}
  serveradmin-password: {{ . | quote }}
  {{- end }}
  {{- if include "teamspeak.usesExternalDatabase" . }}
  {{- with .Values.database.password }}
  database-password: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
