{{- /*
The operator's own legal texts, when they are supplied inline.

Terms, a privacy policy and — in some jurisdictions, as a statutory requirement — an imprint are
per-deployment documents under per-deployment law, so upstream ships none of them and the API
publishes an empty index until an operator provides some. A document is either served, from the
text under `legal.documents.<slug>.body`, or linked through `url`; this object holds the first
kind, one `<slug>.<locale>.md` entry per text. `tankovault.secretSources` projects each entry into
the `api` pod's secrets directory under its configuration path, which is where the service reads
it from.

Not part of `checksum/config`, deliberately. The service reloads the secrets directory when the
kubelet refreshes it, so an edited policy is picked up in place; folding the texts into the pod
checksum would turn a text correction into a rolling restart of the API tier. The same rule as
for every other projected file applies: never mount it with `subPath`, which is resolved once at
container start and never updated.
*/ -}}
{{- $files := include "tankovault.legal.files" . }}
{{- if trim $files }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.fullname.suffixed" (dict "ctx" . "suffix" "legal") }}
  namespace: {{ include "common.namespace" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
    app.kubernetes.io/component: legal
  {{- with (include "common.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  {{- $files | nindent 2 }}
{{- end }}
