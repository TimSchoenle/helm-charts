suite: pod security baseline
templates:
  - deployment.yaml
  - configmap.yaml
  - secret.yaml
  - valkey.yaml
  - postgresql.yaml
  - gotenberg.yaml
  - tika.yaml
# helm-unittest only parses the templates listed above, and the Deployment annotates a checksum
# of both the ConfigMap and the Secret, so those have to be rendered alongside it. Every test
# then selects the document it is about explicitly.
set:
  paperless.secretKey: ci-secret-key
tests:
  - it: satisfies the restricted Pod Security Standard
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.securityContext.fsGroupChangePolicy
          value: OnRootMismatch
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.privileged
          value: false
      # The one field of the baseline this image cannot keep; see the dedicated case below.
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: [ALL]

  # The image creates `paperless` as 1000:1000 and its non-root start path skips the recursive
  # chown it would otherwise do, so fsGroup is what actually makes the volumes writable.
  - it: runs as the unprivileged account the image provides
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000

  - it: keeps the ServiceAccount token out of the pod
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  # OCR writes every intermediate file to PAPERLESS_SCRATCH_DIR. It is a volume rather than the
  # container's writable layer purely so that sizeLimit can bound it, because a single OCR run on
  # a large document is what fills a node's ephemeral storage.
  - it: bounds the OCR scratch directory with a sized volume
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir:
              sizeLimit: 2Gi

  # s6-overlay refuses to boot unless /run is writable and either owned by its own UID or
  # world-writable, which is how the image ships it. Mounting a volume there replaces a directory
  # it accepts with one it rejects — an emptyDir is owned by uid 0, fsGroup moves only the group,
  # and there is no defaultMode for emptyDir — so nothing may be mounted at /run, and the root
  # filesystem has to stay writable for s6-overlay to have anywhere to work.
  - it: leaves /run as the image ships it
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /run
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: run
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: S6_READ_ONLY_ROOT
          any: true

  # A crash loop whose only symptom is a message from s6-overlay's preinit about permissions on a
  # directory nobody configured is not a debuggable failure. Reject it at render time instead.
  - it: refuses to render with a read-only root filesystem
    set:
      securityContext.readOnlyRootFilesystem: true
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: securityContext\.readOnlyRootFilesystem must stay false

  # Turning the preset off entirely is an operator's decision, but it must not resurrect the /run
  # mount, which would break the container just as surely.
  - it: still leaves /run alone when the preset is off
    set:
      securityContextPreset: none
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /run
          any: true

  - it: holds the bundled datastores to the same baseline
    set:
      database.engine: postgresql
      database.password: p
      postgresql.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
        template: postgresql.yaml
        documentIndex: 1
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 999
        template: postgresql.yaml
        documentIndex: 1
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 999
        template: postgresql.yaml
        documentIndex: 1

  # Each of these UIDs is the one its image was built around. Running Gotenberg as anything else
  # leaves LibreOffice unable to write its profile; Tika's image already declares a numeric user,
  # which is what lets `runAsNonRoot` be verified at all.
  - it: runs each bundled converter as the account its image expects
    set:
      tika.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1001
        template: gotenberg.yaml
        documentIndex: 1
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 35002
        template: tika.yaml
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
        template: tika.yaml
        documentIndex: 1

  - it: runs the bundled broker as a non-root account with no writable root filesystem
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
        template: valkey.yaml
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
        template: valkey.yaml
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: [ALL]
        template: valkey.yaml
        documentIndex: 1

  # Credentials reach the process by reference. A plaintext password in the pod spec is readable
  # by anything that can `get pod`, which is a much wider set than what can `get secret`.
  - it: never puts a credential in the pod spec or the ConfigMap
    set:
      paperless.admin.user: admin
      paperless.admin.password: hunter2
      redis.password: broker-pw
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERLESS_ADMIN_PASSWORD
            value: hunter2
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERLESS_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-paperless-ngx
                key: admin-password
      # The broker password is interpolated by the kubelet from the variable above it, so the
      # URL in the pod spec carries a reference rather than the secret itself.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERLESS_REDIS
            value: redis://:$(REDIS_PASSWORD)@RELEASE-NAME-paperless-ngx-valkey:6379/0
