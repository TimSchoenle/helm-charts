suite: values validation
# Constraints that relate values to each other, which no JSON schema can express. Every one of
# these would otherwise surface as a crash-looping pod, or — worse — as an install that comes up
# and quietly does the wrong thing.
templates:
  - deployment.yaml
  - configmap.yaml
  - secret.yaml
tests:
  - it: refuses to render without a Django secret key
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: paperless.secretKey is required

  - it: accepts an operator-supplied Secret as that key
    set:
      existingSecret: paperless-credentials
    asserts:
      - template: deployment.yaml
        notFailedTemplate: {}

  - it: requires a host for an external database
    set:
      paperless.secretKey: k
      database.engine: postgresql
      database.password: p
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: database.host is required for the postgresql engine

  - it: requires a password for an external database
    set:
      paperless.secretKey: k
      database.engine: mariadb
      database.host: mariadb.data.svc
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: database.password \(or existingSecret\) is required

  # The bundled server would be created, and nothing would ever connect to it.
  - it: refuses to run a bundled PostgreSQL the application would not use
    set:
      paperless.secretKey: k
      postgresql.enabled: true
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: postgresql.enabled runs a PostgreSQL server, but database.engine is "sqlite"

  # Two sources of truth for the same address, one of which silently wins.
  - it: refuses a bundled PostgreSQL alongside an external host
    set:
      paperless.secretKey: k
      database.engine: postgresql
      database.password: p
      database.host: elsewhere.svc
      postgresql.enabled: true
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: postgresql.enabled and database.host are both set

  - it: refuses to keep a SQLite database on an emptyDir
    set:
      paperless.secretKey: k
      persistence.data.enabled: false
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: database.engine=sqlite keeps the database in the data volume

  # Without a broker the application starts, serves the UI and consumes nothing — a failure with
  # no error message anywhere.
  - it: refuses to render without a message broker
    set:
      paperless.secretKey: k
      valkey.enabled: false
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: no message broker is configured

  - it: refuses a bundled broker alongside an external one
    set:
      paperless.secretKey: k
      redis.host: valkey.data.svc
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: valkey.enabled runs a broker in this release while redis.host

  - it: requires a password for the superuser it is asked to create
    set:
      paperless.secretKey: k
      paperless.admin.user: admin
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: paperless.admin.user is set but no password is available

  - it: refuses a superuser password with no superuser
    set:
      paperless.secretKey: k
      paperless.admin.password: hunter2
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: paperless.admin.password is set but paperless.admin.user is empty

  - it: requires both converters for office document support
    set:
      paperless.secretKey: k
      tika.enabled: true
      tika.gotenberg.enabled: false
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: tika.enabled needs a Gotenberg server

  - it: accepts external converters instead of bundled ones
    set:
      paperless.secretKey: k
      tika.enabled: true
      tika.server.enabled: false
      tika.server.endpoint: http://tika.docs.svc:9998
      tika.gotenberg.enabled: false
      tika.gotenberg.endpoint: http://gotenberg.docs.svc:3000
    asserts:
      - template: deployment.yaml
        notFailedTemplate: {}

  - it: requires a hostname for an Ingress
    set:
      paperless.secretKey: k
      ingress.enabled: true
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: ingress.host is required

  # A route attached to somebody else's Gateway with no hostnames takes over their traffic.
  - it: refuses a hostname-less route on a Gateway it does not own
    set:
      paperless.secretKey: k
      gateway.enabled: true
      gateway.parentRefs:
        - name: shared
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: gateway.hostnames is empty

  - it: refuses a sub-path that is not one
    set:
      paperless.secretKey: k
      paperless.rootPath: paperless
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: paperless.rootPath must start with a slash

  - it: refuses two mutually exclusive mail encryption modes
    set:
      paperless.secretKey: k
      paperless.email.host: smtp.example.com
      paperless.email.useTls: true
      paperless.email.useSsl: true
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: mutually exclusive

  # Silently ignoring the claim would leave the operator believing their documents are persisted.
  - it: refuses to silently ignore an existing claim
    set:
      paperless.secretKey: k
      persistence.media.enabled: false
      persistence.media.existingClaim: paperless-media
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: persistence.media.existingClaim is set but

  # The rules find this release's objects by name *or* by a kube-state-metrics label, so an
  # override that drops the chart name still renders — NOTES.txt warns that the label half is
  # then the only one left, and it is opt-in on the metrics side.
  - it: renders alerting rules under a renamed release
    set:
      paperless.secretKey: k
      fullnameOverride: documents
      metrics.prometheusRule.enabled: true
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1
    asserts:
      - template: deployment.yaml
        notFailedTemplate: {}

  # `helm template` reports the built-in API surface but no CRDs, so a capability guard that
  # dropped the objects would render clean in CI and leave a real install with no alerts and no
  # dashboards at all — the failure this refuses to produce.
  - it: refuses observability objects a cluster could not accept
    set:
      paperless.secretKey: k
      metrics.prometheusRule.enabled: true
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: cluster registers no `monitoring.coreos.com/v1` API

  - it: refuses the Grafana Operator path without the ConfigMap it reads from
    set:
      paperless.secretKey: k
      metrics.dashboard.enabled: false
      metrics.dashboard.grafanaOperator.enabled: true
    capabilities:
      apiVersions:
        - grafana.integreatly.org/v1beta1
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: the Grafana Operator dashboards need the dashboard ConfigMap

  # --- database driver options ---------------------------------------------------------------

  # Pooling is a PostgreSQL driver feature. Silently dropping it would leave an operator believing
  # a pool size is in effect that nothing reads.
  - it: refuses a connection pool size on an engine that has no pool
    set:
      paperless.secretKey: k
      database.engine: mariadb
      database.host: mariadb.data.svc
      database.password: p
      database.poolSize: 10
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: database.poolSize is set but database.engine is "mariadb"

  - it: refuses a TLS mode on a database that is a local file
    set:
      paperless.secretKey: k
      database.sslMode: require
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: database.sslMode is set while database.engine is sqlite

  # --- backup ----------------------------------------------------------------------------------

  # The one failure a backup must not have: a schedule that reports success nightly and leaves
  # nothing behind, because the export volume belongs to the pod that just exited.
  - it: refuses a backup that would write to an emptyDir
    set:
      paperless.secretKey: k
      backup.enabled: true
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: backup.enabled needs a durable export directory

  # `existingClaim` on its own is not enough and is rejected elsewhere in this suite: the chart
  # only mounts a claim for a directory whose persistence is enabled.
  - it: accepts a backup writing to a claim the operator supplied
    set:
      paperless.secretKey: k
      backup.enabled: true
      persistence.export.enabled: true
      persistence.export.existingClaim: paperless-export
    asserts:
      - template: deployment.yaml
        notFailedTemplate: {}

  # In zip mode `--delete` empties the target directory rather than pruning stale documents from
  # it, so it would remove exactly the archives retention is keeping.
  - it: refuses the delete flag in zip mode
    set:
      paperless.secretKey: k
      backup.enabled: true
      persistence.export.enabled: true
      backup.mode: zip
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: backup.mode=zip with backup.options.delete is destructive

  # An explicit affinity wins over the co-scheduling rule, which silently breaks the ReadWriteOnce
  # arrangement that flag exists to make work.
  - it: refuses an explicit affinity alongside the co-scheduling flag
    set:
      paperless.secretKey: k
      backup.enabled: true
      persistence.export.enabled: true
      backup.affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: storage
                    operator: In
                    values: [fast]
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: backup.affinity and backup.coScheduleWithApp are both set

  - it: accepts an explicit affinity once the co-scheduling flag is cleared
    set:
      paperless.secretKey: k
      backup.enabled: true
      persistence.export.enabled: true
      backup.coScheduleWithApp: false
      backup.affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: storage
                    operator: In
                    values: [fast]
    asserts:
      - template: deployment.yaml
        notFailedTemplate: {}

  - it: requires a container for the upload step
    set:
      paperless.secretKey: k
      backup.enabled: true
      persistence.export.enabled: true
      backup.upload.enabled: true
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: backup.upload.container is empty

  - it: requires the fields the Kubernetes Container schema requires
    set:
      paperless.secretKey: k
      backup.enabled: true
      persistence.export.enabled: true
      backup.upload.enabled: true
      backup.upload.container:
        command: [rclone, sync]
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: '(?s)backup.upload.container needs a "name".*backup.upload.container needs an? "image"'

  # A stopped release has no application pod to co-schedule with and no media lock to take, so
  # every run would sit Pending until its deadline.
  - it: refuses to schedule backups of a stopped release
    set:
      paperless.secretKey: k
      backup.enabled: true
      persistence.export.enabled: true
      replicaCount: 0
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: backup.enabled with replicaCount=0

  # --- restore ---------------------------------------------------------------------------------

  - it: refuses an import with nothing to import from
    set:
      paperless.secretKey: k
      restore.enabled: true
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: restore.enabled needs somewhere to read the export from

  # The export volume wins and the named claim is never mounted, which presents as an import that
  # cannot find a manifest in a claim you can see holds one.
  - it: refuses two sources for the same import
    set:
      paperless.secretKey: k
      restore.enabled: true
      restore.source.existingClaim: old-export
      restore.source.useExportVolume: true
      persistence.export.enabled: true
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: restore.source.existingClaim, restore.source.useExportVolume are all set

  - it: refuses to import from an export volume that is an emptyDir
    set:
      paperless.secretKey: k
      restore.enabled: true
      restore.source.useExportVolume: true
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: restore.source.useExportVolume reads this release's export volume

  # The marker that makes the import run once lives on the data volume; on an emptyDir it vanishes
  # with the pod and every restart re-runs the import against the archive it just wrote.
  - it: refuses an import whose run-once marker would not survive a restart
    set:
      paperless.secretKey: k
      restore.enabled: true
      restore.source.existingClaim: old-export
      persistence.data.enabled: false
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: restore.enabled requires persistence.data.enabled

  - it: refuses to import a whole archive onto an emptyDir
    set:
      paperless.secretKey: k
      restore.enabled: true
      restore.source.existingClaim: old-export
      persistence.media.enabled: false
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: restore.enabled with persistence.media.enabled=false

  - it: reports every mistake in one go
    set:
      database.engine: postgresql
      valkey.enabled: false
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: "(?s)paperless.secretKey is required.*database.host is required.*no message broker is configured"

  - it: renders once the configuration is coherent
    set:
      paperless.secretKey: k
      paperless.admin.user: admin
      paperless.admin.password: hunter2
      database.engine: postgresql
      database.password: p
      postgresql.enabled: true
      tika.enabled: true
    asserts:
      - template: deployment.yaml
        notFailedTemplate: {}

  # --- a remote archive ------------------------------------------------------------------------

  - it: refuses a download URL that curl cannot fetch
    set:
      paperless.secretKey: k
      restore.enabled: true
      persistence.export.enabled: true
      restore.source.url: s3://backups/paperless.zip
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: restore.source.url must be an http:// or https:// URL

  # The download lands in the export volume. On an emptyDir a large archive either evicts the pod
  # mid-transfer or is lost and re-fetched on every retry.
  - it: refuses to download an archive into an emptyDir
    set:
      paperless.secretKey: k
      restore.enabled: true
      restore.source.url: https://backups.example.com/paperless.zip
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: restore.source.url downloads the archive into the export volume

  - it: refuses two sources when one of them is a URL
    set:
      paperless.secretKey: k
      restore.enabled: true
      persistence.export.enabled: true
      restore.source.url: https://backups.example.com/paperless.zip
      restore.source.existingClaim: old-export
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: restore.source.existingClaim, restore.source.url are all set

  - it: rejects a subPath that would silently do nothing
    set:
      paperless.secretKey: k
      restore.enabled: true
      persistence.export.enabled: true
      restore.source.url: https://backups.example.com/paperless.zip
      restore.source.subPath: dumps
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorPattern: restore.source.subPath does nothing alongside restore.source.url

  - it: accepts a coherent URL import
    set:
      paperless.secretKey: k
      restore.enabled: true
      persistence.export.enabled: true
      restore.source.url: https://backups.example.com/paperless.zip
      restore.source.checksum: 4f0e0b57b0a06a5e9f4a4fa0a24d0b0d3a2e6f2c1b8d7a9c0e1f2a3b4c5d6e7f
    asserts:
      - template: deployment.yaml
        notFailedTemplate: {}
