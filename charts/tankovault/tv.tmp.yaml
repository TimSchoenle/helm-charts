spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: tankovault-api
      app.kubernetes.io/instance: tv
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tankovault-api
        app.kubernetes.io/instance: tv
        app.kubernetes.io/version: "0.4.0"
        app.kubernetes.io/component: "api"
        app.kubernetes.io/part-of: "tankovault"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: tv-tankovault
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: tankovault-api
                    app.kubernetes.io/instance: tv
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: migrate
          image: "timschoenle/tankovault-bootstrap:v0.4.0@sha256:5c7804fdd404b2cf3cf752a8cbba1c859c8baf205e2c98c8dac0e870da9d7e97"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          args:
            - migrate
          env:
            - name: TANKOVAULT_PROFILE
              value: production
            - name: TANKOVAULT_CONFIG
              value: /etc/tankovault/config
            - name: TANKOVAULT_SECRETS_DIR
              value: /etc/tankovault/secrets
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /etc/tankovault/config
              name: config
              readOnly: true
            - mountPath: /etc/tankovault/secrets
              name: secrets
              readOnly: true
      containers:
        - name: api
          image: "timschoenle/tankovault-api:v0.4.0@sha256:05691a9184e5ee0511f13593797053cca19ed3ecc4d722e8366bb8a11ddf76de"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          env:
            - name: TANKOVAULT_PROFILE
              value: production
            - name: TANKOVAULT_CONFIG
              value: /etc/tankovault/config
            - name: TANKOVAULT_SECRETS_DIR
              value: /etc/tankovault/secrets
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /etc/tankovault/config
              name: config
              readOnly: true
            - mountPath: /etc/tankovault/secrets
              name: secrets
              readOnly: true
      volumes:
        - emptyDir: {}
          name: tmp
        - configMap:
            name: tv-tankovault-api-config
          name: config
        - name: secrets
          projected:
            defaultMode: 256
            sources:
            - secret:
                items:
                - key: auth__jwt_secret
                  path: auth__jwt_secret
                - key: auth__password_pepper
                  path: auth__password_pepper
                - key: internal__token
