suite: httproute
templates:
  - httproute.yaml
tests:
  - it: creates no HTTPRoute by default
    asserts:
      - hasDocuments:
          count: 0

  # Hostnames plus a parent is the whole configuration: the backend is this chart's Service,
  # inferred rather than restated.
  - it: routes to the Service with only a parent and a hostname configured
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
    set:
      gateway.enabled: true
      gateway.parentRefs:
        - name: shared-gateway
          namespace: gateway-system
      gateway.hostnames:
        - portfolio.example.com
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HTTPRoute
      - equal:
          path: apiVersion
          value: gateway.networking.k8s.io/v1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-portfolio
      - equal:
          path: spec.parentRefs[0]
          value:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared-gateway
            namespace: gateway-system
      - equal:
          path: spec.hostnames[0]
          value: portfolio.example.com
      - equal:
          path: spec.rules[0].backendRefs[0]
          value:
            name: RELEASE-NAME-portfolio
            port: 80

  - it: narrows the default rule to a path prefix
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
    set:
      gateway.enabled: true
      gateway.parentRefs:
        - name: shared-gateway
      gateway.hostnames:
        - portfolio.example.com
      gateway.path: /app
    asserts:
      - equal:
          path: spec.rules[0].matches[0].path
          value:
            type: PathPrefix
            value: /app

  # What used to be a controller-specific annotation is a typed field here.
  - it: carries filters and timeouts
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
    set:
      gateway.enabled: true
      gateway.parentRefs:
        - name: shared-gateway
      gateway.hostnames:
        - portfolio.example.com
      gateway.timeouts:
        request: 30s
      gateway.filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Content-Type-Options
                value: nosniff
    asserts:
      - equal:
          path: spec.rules[0].timeouts.request
          value: 30s
      - equal:
          path: spec.rules[0].filters[0].responseHeaderModifier.set[0].value
          value: nosniff

  - it: creates a Gateway and attaches to it on request
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
    set:
      gateway.enabled: true
      gateway.create: true
      gateway.gatewayClassName: cilium
      gateway.hostnames:
        - portfolio.example.com
      gateway.tls.enabled: true
      gateway.tls.certificateRefs:
        - name: portfolio-tls
      gateway.httpsRedirect.enabled: true
    asserts:
      - hasDocuments:
          count: 3
      - documentSelector:
          path: kind
          value: Gateway
        equal:
          path: spec.listeners[1].tls.certificateRefs[0].name
          value: portfolio-tls
      - documentSelector:
          path: metadata.name
          value: RELEASE-NAME-portfolio-https-redirect
        equal:
          path: spec.parentRefs[0].sectionName
          value: http

  # Ingress and Gateway are independent switches: a cluster migrating between the two runs both.
  - it: coexists with an Ingress
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
    set:
      ingress.enabled: true
      gateway.enabled: true
      gateway.parentRefs:
        - name: shared-gateway
      gateway.hostnames:
        - portfolio.example.com
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HTTPRoute

  # A capability guard that skipped the object would render clean in CI and leave a real install
  # succeeding with the application unreachable.
  - it: refuses to render when the Gateway API CRDs are absent
    set:
      gateway.enabled: true
      gateway.parentRefs:
        - name: shared-gateway
      gateway.hostnames:
        - portfolio.example.com
    asserts:
      - failedTemplate:
          errorPattern: "the cluster registers no `gateway.networking.k8s.io/v1` API"

  - it: refuses a route with no Gateway to attach to
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
    set:
      gateway.enabled: true
      gateway.hostnames:
        - portfolio.example.com
    asserts:
      - failedTemplate:
          errorPattern: "gateway.parentRefs is empty and gateway.create is false"

  - it: refuses a route that would match every hostname on a shared Gateway
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
    set:
      gateway.enabled: true
      gateway.parentRefs:
        - name: shared-gateway
    asserts:
      - failedTemplate:
          errorPattern: "gateway.hostnames is empty"
