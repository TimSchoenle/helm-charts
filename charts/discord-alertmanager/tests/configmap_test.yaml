suite: discord-alertmanager configmap
templates:
  - configmap.yaml

# The generated `contract_roundtrip_*_test.yaml` beside this file proves each contract key
# arrives at the path the image reads it from. This file is for everything the contract cannot
# say — the shape of the object, the layering between the chart's own values and `config`, and
# the two settings the chart derives differently from what the image declares.
#
# `discord.token` and `alertmanager.endpoints` are set on the suite because
# `discord-alertmanager.validateValues` refuses a render without them, and the guard runs from
# this template.
#
# No `failedTemplate` test belongs in this file, measured here rather than assumed: with the two
# snowflake refusals present in this suite, every *other* test in it saw an empty document and
# failed, and lifting just those two made all ten pass unchanged. Nothing in the assertions said
# so — they simply reported no match. The refusals live in `validation_test.yaml`, which is the
# same template scope and nothing but refusals, which is what that file is for.
set:
  discord.token: suite-token
  alertmanager.endpoints:
    - http://alertmanager.suite.invalid:9093

tests:
  - it: renders a ConfigMap carrying the configuration document
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - exists:
          path: data['config.toml']

  - it: writes the chart's own values into the document
    set:
      engine.dispatchers: 12
      render.keyLabels: [cluster, namespace]
    asserts:
      - matchRegex:
          path: data['config.toml']
          pattern: 'dispatchers = 12'
      - matchRegex:
          path: data['config.toml']
          pattern: 'key_labels = ."cluster","namespace".'

  # The escape hatch is merged *over* everything the chart derives, so it can override a
  # first-class value and not only extend the tree. A chart that merged the other way round
  # would accept the value, render the derived one, and report nothing.
  - it: lets config override a value the chart derives
    set:
      engine.dispatchers: 12
      config:
        engine:
          dispatchers: 99
    asserts:
      - matchRegex:
          path: data['config.toml']
          pattern: 'dispatchers = 99'
      - notMatchRegex:
          path: data['config.toml']
          pattern: 'dispatchers = 12'

  - it: appends configExtraToml verbatim, after the rendered configuration
    set:
      configExtraToml: |
        [scaffolded]
        marker = "verbatim"
    asserts:
      - matchRegex:
          path: data['config.toml']
          pattern: '\[scaffolded\]'

  # An optional setting left unset is omitted rather than written empty. To the loader an empty
  # value is a *supplied* value, so writing one would configure the setting blank instead of
  # leaving the binary on its compiled default.
  - it: omits an unset optional setting rather than writing it blank
    asserts:
      - notMatchRegex:
          path: data['config.toml']
          pattern: 'admin_channel_id'
      - notMatchRegex:
          path: data['config.toml']
          pattern: 'dev_guild_id'

  # Never in the document, whatever else is. A ConfigMap is readable by anything that can read
  # the namespace, and all five of these travel the Secret instead.
  - it: keeps every credential out of the ConfigMap
    set:
      discord.token: suite-token
      ingest.webhookToken: suite-webhook
      alertmanager.bearerToken: suite-bearer
      alertmanager.basicPassword: suite-password
      storage.postgres.url: postgres://suite
    asserts:
      - notMatchRegex:
          path: data['config.toml']
          pattern: 'suite-token|suite-webhook|suite-bearer|suite-password|postgres://suite'

  # Not the image's own default, which is the relative `discord-alertmanager.db` and resolves
  # inside the read-only `/app` working directory.
  - it: defaults the SQLite path into the mounted volume
    asserts:
      - matchRegex:
          path: data['config.toml']
          pattern: 'path = "/data/discord-alertmanager.db"'

  # The round trip for `storage.sqlite.path`, written by hand because the generated suite cannot
  # write it: this chart refuses any path outside `persistence.data.mountPath`, and a probe
  # synthesised from the contract has no way to know that — the contract types the key `String`
  # and says nothing about where the file has to live. The generated case for it is declared
  # `unrouted` in `contract-tests.yaml` and goes through `config` instead, which proves the raw
  # tree reaches the key and not that this value does. This is the half that does.
  - it: writes the chart's own SQLite path into the document
    set:
      storage.sqlite.path: /data/somewhere-else.db
    asserts:
      - matchRegex:
          path: data['config.toml']
          pattern: 'path = "/data/somewhere-else\.db"'

  # `routes` is TOML's array-of-tables form, which is the one shape the renderer refused until
  # `common.toml` learned `[[name]]`. Asserted as one block, because what is being checked is the
  # interleaving: `[routes.target]` after an element belongs to that element and not to the first.
  - it: renders routes as an array of tables, each with its own sub-tables
    set:
      routes:
        - name: first
          guild_id: "1"
          target:
            kind: forum
            id: "2"
        - name: second
          guild_id: "3"
    asserts:
      - matchRegex:
          path: data['config.toml']
          pattern: '\[\[routes\]\]\nguild_id = 1\nname = "first"\n\n\[routes\.target\]\nid = 2\nkind = "forum"\n\n\[\[routes\]\]\nguild_id = 3\nname = "second"'

  # The whole reason snowflakes are quoted in values.yaml. Helm parses a values file through
  # `encoding/json`, so an unquoted `123456789012345678` is a float64 and reaches the chart as
  # `...680`. The string survives, and this is where it becomes the integer the image reads —
  # exactly, digit for digit, which is the assertion that would fail on any rounding.
  - it: writes a Discord snowflake as an exact TOML integer
    set:
      routes:
        - name: platform
          guild_id: "123456789012345678"
          target:
            kind: text
            id: "234567890123456789"
          mentions:
            roles: ["345678901234567890"]
          escalation:
            users: ["456789012345678901"]
    asserts:
      - matchRegex:
          path: data['config.toml']
          pattern: 'guild_id = 123456789012345678\n'
      - matchRegex:
          path: data['config.toml']
          pattern: 'id = 234567890123456789\n'
      - matchRegex:
          path: data['config.toml']
          pattern: 'roles = \[345678901234567890\]'
      - matchRegex:
          path: data['config.toml']
          pattern: 'users = \[456789012345678901\]'
      - notMatchRegex:
          path: data['config.toml']
          pattern: 'guild_id = "'

  # `links.buttons` is the other array of tables in this chart, and the one whose elements have no
  # sub-tables at all — so it exercises the plain case.
  - it: renders link buttons as an array of tables
    set:
      links:
        allowedHosts: [grafana.example.com]
        buttons:
          - label: Dashboard
            url: https://grafana.example.com/d/abc
    asserts:
      - matchRegex:
          path: data['config.toml']
          pattern: '\[\[links\.buttons\]\]\nlabel = "Dashboard"\nurl = "https://grafana\.example\.com/d/abc"'
