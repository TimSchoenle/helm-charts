# CiliumNetworkPolicy exposure.
#
# Named without the `-values` suffix on purpose: `ct` globs `ci/*-values.yaml` for `ct install`,
# while the render and kubeconform recipes glob `ci/*.yaml`. The kind cluster CI installs into
# runs no Cilium and has no `cilium.io/v2` CRDs, so an install would fail; this keeps render,
# schema-validation and policy-scan coverage without asking chart-testing to install it.
#
# This is the shape the portable policy cannot express, and for this workload the difference is
# real rather than academic. The bot's egress is to three named hosts — Discord's API, Discord's
# gateway and an in-cluster Alertmanager — and the portable answer to that is "may reach the whole
# public internet on 443". `toFQDNs` is the rule that actually says what it means.

discord:
  token: ci-not-a-real-token

alertmanager:
  endpoints:
    - http://alertmanager-operated.monitoring.svc:9093

ingest:
  webhookToken: ci-webhook-token

networkPolicy:
  enabled: true
  engine: both
  ingress:
    enabled: true
    monitoring:
      enabled: true
      namespace: monitoring
  egress:
    enabled: true
    https:
      enabled: false
    customRules:
      - ports:
          - port: 9093
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: monitoring
            podSelector:
              matchLabels:
                app.kubernetes.io/name: alertmanager
  cilium:
    description: "discord-alertmanager: Alertmanager and Prometheus reach it; it reaches Discord and Alertmanager and nothing else"
    ingress:
      fromEntities:
        - cluster
    egress:
      toFQDNs:
        - matchName: discord.com
        - matchPattern: "*.discord.gg"
      fqdnPorts:
        - port: 443
          protocol: TCP
      dnsMatchPatterns:
        - matchPattern: "*.discord.com"
        - matchPattern: "*.discord.gg"
