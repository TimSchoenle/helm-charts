{{- /*
The Grafana dashboard, published the way the Grafana sidecar discovers them: a labelled ConfigMap
whose keys are file names.

Both this ConfigMap and the optional `GrafanaDashboard` resources beside it come from
`common.grafana.dashboard.*`, which documents why Grafana needs two delivery mechanisms and why
the JSON is loaded from a file rather than inlined — Grafana's `{{ }}` legend syntax collides
with Helm's delimiters, so a dashboard written into a template would need every legend escaped.
Nothing here is chart-specific.
*/ -}}
{{- if and .Values.metrics.enabled .Values.metrics.dashboard.enabled }}
{{- include "common.grafana.dashboard.configMap" (dict "ctx" . "values" .Values.metrics.dashboard) }}
{{- end }}
