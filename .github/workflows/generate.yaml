name: Generate

# Every file in this repository that a tool writes rather than a person: chart schemas and READMEs,
# the vendored configuration contracts and the round-trip suites generated from them, the version
# bumps and pins derived from them, and the root README's chart index. The Documentation job
# regenerates them on the pull request's head and uploads a patch; the Generated Files job is the
# required check, and fails while that patch is not committed yet or a generator failed.
# generate-commit.yaml, a workflow_run workflow the pull request cannot edit, commits the patch to
# the branch, and the run on that commit decides.
#
# The split is the security boundary. Documentation runs the pull request's own code — every
# `just` recipe, every script under `.github/scripts/`, the composite toolchain action and
# `helm dependency update` — so it holds no secret, a read-only `GITHUB_TOKEN` and no persisted
# credentials, and hands on only a patch. generate-commit.yaml holds the maintenance App's key and
# runs nothing from the checkout: common/commit-patch applies the patch and refuses any path outside
# its allowlist.
#
# No `paths` filter: the Generated Files check has to report on every pull request to be required.
# A fork's pull request is never committed to, so its check stays red until the contributor runs
# the generators locally and pushes the result.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# An unknown key in `terrace.yaml` is a warning locally and an error here, so a typo or a key a
# newer CLI introduced cannot pass review as silently ignored.
env:
  TERRACE_STRICT: "true"

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to checkout code
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
      artifact_name: ${{ steps.patch.outputs.artifact_name }}
      failed_generators: ${{ steps.failures.outputs.failed }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # The pull request's head commit, fetched from this repository, rather than its branch by
      # name: a fork's branch does not exist here, and generate-commit.yaml applies the
      # patch on top of exactly this commit (commit-patch's `expected_head_sha`), so the two cannot
      # disagree when a push lands in between. The full history is for the merge-base the two bump
      # steps below measure from.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup toolchain
        uses: $/.github/actions/setup-toolchain

      # Renovate's image updates rewrite `values.yaml` and nothing else, but `ct lint` demands a new
      # chart version for them and the release workflow publishes only a chart whose version moved.
      # This supplies it, and moves `appVersion` with the main image, before the contract refresh
      # below reads `appVersion` and before the README badges are rendered from the version. Only on
      # Renovate branches: the first-party charts get theirs from the release pipeline that opened
      # the pull request, and a contributor bumps by hand. Idempotent, and computed from the merge
      # base, so a rebase recomputes it instead of stacking a second bump.
      - name: Bump chart versions for image updates
        if: startsWith(github.head_ref, 'renovate/')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: just bump-chart-versions "${BASE_REF}"

      # Every chart types its Kubernetes values by URL, pinned to the release `kube_version` names.
      # Nothing derives those URLs from it, so this repins them before the dependencies are built —
      # `charts/common` has to carry the new version before it is packaged into its consumers, or
      # the schema generation below would put the old one back.
      - name: Repin Kubernetes schema references
        run: just sync-kube-refs

      # The same, for the values shaped by a custom resource rather than by the Kubernetes API
      # surface — the Gateway API sub-objects `gateway.*` is written into. Those definitions come
      # from the community CRD catalog `kubeconform` already reads, pinned to `crd_catalog_ref`,
      # and are repinned here for the same reason and in the same window as the ones above.
      - name: Repin CRD schema references
        run: just sync-crd-refs

      # Every chart's `kubeVersion` floor, derived from the lowest entry in the
      # `validate-manifests` matrix below so the two cannot disagree. Placed in the same window as
      # the two repins above, and before the dependency build for the same reason: `charts/common`
      # has to carry the current floor before it is packaged into its consumers.
      - name: Repin Kubernetes version floor
        run: just sync-kube-floor

      # Every chart bundles `charts/common` at an exact version, so a change to the library has to
      # move that version and every pin on it, and each repinned chart has to move its own. The
      # three repins above are the usual source of such a change on a Renovate branch (#623 was
      # one), and a hand edit to the library is the other. Placed before the dependency build so
      # the archives it packages carry the new version. Idempotent and computed from the merge base,
      # like the image bump above; Lint Charts runs the same script as the gate.
      - name: Bump the common library and its pins
        env:
          BASE_REF: ${{ github.base_ref }}
        run: just bump-common-version "${BASE_REF:-main}"

      - name: Build Helm dependencies
        run: just deps

      # The vendored configuration contracts, refreshed from the images the charts pin, and the two
      # files derived from them: every bound value's `@schema` block and the credential reference in
      # each contracted chart's README, which sits between two HTML comments in `README.md.gotmpl`.
      # Placed after the dependency build and before the schemas and helm-docs, and the order is
      # load-bearing: `just schema` packs the `@schema` blocks into `values.schema.json` and helm-docs
      # reads the template, so either running first would publish last run's contract and converge
      # only on the next push. `just schema` derives the `@schema` blocks once more on its own, which
      # finds nothing left to change. The patch below sweeps everything up together.
      #
      # This is the one networked step in the repository, and the only one depending on a service
      # outside GitHub: the refresh verifies each image's signature, which queries the Sigstore
      # transparency log, so a Sigstore outage fails it. That is a deliberate trade rather than an
      # oversight — there is no "fetch it unverified" path, because a contract that cannot be proven
      # to belong to the pinned digest is worse than none: every gate downstream would trust it. No
      # other job touches a registry, and none depends on this one.
      #
      # The action installs the release `cli` in `terrace.yaml` pins, with oras and cosign, and
      # commits nothing itself: no token is passed, so the patch below carries its result. The
      # read-only job token it lists terrace-contract releases with is all it needs.
      #
      # Narrowed to the charts the pull request touched, as Configuration Contracts in ci.yaml is.
      # Unscoped, one chart whose pinned image cannot be pulled or verified failed this step on
      # every open pull request: #845 renamed three first-party repositories without repinning
      # their digests, which exist only under the old namespace, and every pull request after it
      # went red on charts it never touched. Nothing is lost by narrowing: a vendored contract is
      # bound to the digest its chart pins, and that digest only moves in a change to the chart.
      # `--since` widens back to every chart when the change reaches outside one application
      # chart's own directory (the CLI pin, `terrace.yaml`, a workflow, a library chart) or the
      # merge base cannot be read, so the whole tree is still synced whenever it could be affected.
      - name: Sync configuration contracts
        id: sync
        continue-on-error: true
        uses: TimSchoenle/actions/actions/terrace/helm-sync@0701d3b35ad7e10e3159471c82f4743b67fdc01f # tag=actions-terrace-helm-sync-v1.1.3
        with:
          since: ${{ github.event.pull_request.base.sha }}

      # The generated round-trip suites, `charts/*/tests/contract_roundtrip_*_test.yaml`, rewritten
      # from the contracts the sync above just refreshed. `terrace-contract sync` writes the
      # contracts, the `@schema` blocks and the README reference but not the suites: those it only
      # checks, under `--check`. So without this step an image bump that moves a default lands with
      # its suites still probing the old one, and Configuration Contracts fails on the `tests`
      # gate. TankoVault 11.2.0 did exactly that: it started publishing its compiled-in defaults,
      # and 76 probes had to flip (#839).
      #
      # Placed directly after the sync because the suites are derived from the contracts and from
      # the `@config` markers it rewrote, and nothing after it reads the suites. Every chart, not
      # only the ones the change touched: the generator is offline and idempotent, so a chart
      # already in step comes out byte-for-byte the same. It uses the terrace-contract binary the
      # sync action installed on PATH, so a sync that failed before installing it fails this step
      # too, and the step is reported below.
      #
      # The suites still reach a reviewer: the regenerated cases arrive as their own commit on the
      # pull request, beside the contract diff that caused them, and Unit Tests runs them.
      - name: Regenerate contract test suites
        id: contract-tests
        continue-on-error: true
        run: just contract-tests

      # Every generator from the sync above to the patch runs even when the one before it failed,
      # and the job is failed at the end instead — see "Report generator failures".
      #
      # These steps are a chain of repairs, not gates, and a chain that aborts throws away every
      # repair already made. The sync above is the expensive one: it is the only place in this
      # repository that touches a registry, and the vendored contract it writes cannot be produced
      # by any other job or by `just check`. Losing it to a failure two steps later left the branch
      # with contracts still pinned to the pre-bump digests, and the offline staleness gate then
      # failing against them — a second red job, for the first one's reason, on a pull request
      # whose only actual problem was three hand-transcribed `@schema` blocks.
      #
      # Committing what was produced is right even when a generator failed partway: this job never
      # gates anything, the failure is still reported, and the gates in the other jobs hold the
      # result either way. The alternative is a branch that keeps none of it and a run that has to
      # be started over from the network step.
      - name: Generate schemas
        id: schemas
        continue-on-error: true
        run: just schema

      - name: Run helm-docs
        id: helm-docs
        continue-on-error: true
        uses: losisin/helm-docs-github-action@9e0787c426fdec38be6288bb5c0559dcb388412c # v2
        with:
          chart-search-root: charts
          template-files: README.md.gotmpl

      # The chart table in the root README is rendered from every chart's Chart.yaml, so a new
      # chart or a version bump cannot leave the index stale. Rendered after the chart
      # documentation, so the index reads the versions the steps above settled on.
      #
      # PyYAML ships with the runner image's system `python3`, which is what the recipe resolves
      # to. `actions/setup-python` is not used here on purpose: the interpreter it installs would
      # not have it.
      - name: Collect chart metadata
        id: chart-index
        continue-on-error: true
        run: |
          set -euo pipefail
          index="$(just chart-index)"
          echo "json=${index}" >> "$GITHUB_OUTPUT"

      # The chart index covers the table and nothing else. Repository, branch, the `common`
      # library's name and version and the docs index come from the shared action instead, so the
      # template quotes them rather than repeating them — and every repository in the estate
      # spells them the same way. `branch` is pinned to the default branch because the input
      # defaults to `github.ref_name`, which on a pull_request event is `<number>/merge`: left
      # alone it would write that into the badge URLs here and `main` into the drift gate in
      # docs.yaml, failing every merge for a reason absent from the diff.
      - name: Collect the README payload
        id: variables
        # Never from a failed index: an empty one would render a README without its chart table.
        if: steps.chart-index.outcome == 'success'
        continue-on-error: true
        uses: TimSchoenle/actions/actions/common/readme-variables@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-readme-variables-v2.1.4
        with:
          manifest: charts/common/Chart.yaml
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.chart-index.outputs.json }}

      # The same renderer, at the same pin, as the drift gate in docs.yaml, so the README this
      # writes is the one that gate accepts.
      - name: Render the root README
        id: readme
        if: steps.variables.outcome == 'success'
        continue-on-error: true
        uses: TimSchoenle/actions/actions/common/render-template@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-render-template-v3.0.4
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}

      # Everything the generators above wrote, as one patch for the verdict to merge.
      # Scoped to the chart tree, the library fixture and the root README rather than narrowed to
      # the generated files: a generator that wrote somewhere unexpected should fail that job's
      # allowlist loudly rather than be dropped here without a word. `!cancelled()` and the sync
      # check carry the `continue-on-error` chain above through to the commit: what the generators
      # produced is handed on even when one of them failed, but nothing is when the job failed
      # before them.
      - name: Create Patch
        id: patch
        if: ${{ !cancelled() && steps.sync.outcome != 'skipped' }}
        uses: TimSchoenle/actions/actions/common/create-patch@0701d3b35ad7e10e3159471c82f4743b67fdc01f # tag=actions-common-create-patch-v2.0.2
        with:
          artifact_name: chart-docs
          paths: |
            charts
            .github/testdata/common-fixture/Chart.yaml
            README.md

      # The other half of the `continue-on-error` above: everything a generator did manage to
      # produce is in the patch by now. A failed generator is reported as an output rather than by
      # failing this job, because the verdict merges only the patches of jobs that passed; the
      # Documentation Generators job below turns the output into a failure the verdict sees.
      #
      # Named steps rather than a wildcard: `steps` has no iteration in an expression, and listing
      # the generators makes one added without a line here a visible omission rather than a
      # silently ungated step.
      - name: Report generator failures
        id: failures
        if: always()
        env:
          SYNC: ${{ steps.sync.outcome }}
          CONTRACT_TESTS: ${{ steps.contract-tests.outcome }}
          SCHEMAS: ${{ steps.schemas.outcome }}
          HELM_DOCS: ${{ steps.helm-docs.outcome }}
          CHART_INDEX: ${{ steps.chart-index.outcome }}
          README_PAYLOAD: ${{ steps.variables.outcome }}
          README: ${{ steps.readme.outcome }}
        run: |
          set -euo pipefail

          failed=''
          for generator in "terrace/helm-sync:${SYNC}" \
                           "just contract-tests:${CONTRACT_TESTS}" \
                           "just schema:${SCHEMAS}" \
                           "helm-docs:${HELM_DOCS}" \
                           "just chart-index:${CHART_INDEX}" \
                           "readme-variables:${README_PAYLOAD}" \
                           "root README render:${README}"; do
            if [ "${generator##*:}" = "failure" ]; then
              echo "::error::${generator%:*} failed; see its step above"
              failed="${failed:+${failed}, }${generator%:*}"
            fi
          done

          echo "failed=${failed}" >> "$GITHUB_OUTPUT"


  # The generators' own failures, as a job result the verdict reads. Documentation passes even when
  # a generator failed, so that what the others produced is still merged and committed.
  docs-generators:
    name: Documentation Generators
    needs: [docs]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443

      - name: Fail on a failed generator
        env:
          DOCS_RESULT: ${{ needs.docs.result }}
          FAILED: ${{ needs.docs.outputs.failed_generators }}
        run: |
          set -euo pipefail
          if [ "${DOCS_RESULT}" != "success" ]; then
            echo "::error::Documentation ended ${DOCS_RESULT}."
            exit 1
          fi
          if [ -n "${FAILED}" ]; then
            echo "::error::These generators failed: ${FAILED}. What the others produced is still committed."
            exit 1
          fi

  # The required check. It needs every job above and runs whatever their result, so it reports on
  # every pull request.
  verdict:
    name: Generated Files
    needs: [docs, docs-generators]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to check out the commit the merged patch is made from
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Generated Files Verdict
        uses: TimSchoenle/actions/actions/common/generated-files-verdict@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-generated-files-verdict-v1.2.3
        with:
          needs: ${{ toJSON(needs) }}
