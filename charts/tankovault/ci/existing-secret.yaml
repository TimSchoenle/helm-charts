# The posture where no credential ever enters the Helm release: every value comes from Secrets
# the operator created out of band. `tankovault.validateValues` deliberately stops checking
# credential values in this mode, because it cannot see them.
#
# A render fixture, not an install fixture — the Secrets it names exist only in the operator's
# cluster, and the datastore endpoints do not resolve. Hence the name: `ct install` takes every
# `ci/*-values.yaml`, while the render and policy jobs glob `ci/*.yaml`.
existingSecret: tankovault-credentials
internal:
  # The `token` path, with the two per-caller tokens coming out of `existingSecret` under
  # `internal__tokens__api` and `internal__tokens__worker` rather than being generated here. This
  # is the fixture that proves the projection maps each stored key onto the configuration path the
  # reading pod expects — `internal__caller__token` on a caller, `internal__peers__<caller>__token`
  # on each of its callees.
  identity: token
externalDatabase:
  existingSecret: tankovault-database
  urlKey: url
externalRedis:
  existingSecret: tankovault-redis
  urlKey: url
externalNats:
  url: nats://nats.example.com:4222
externalTrawl:
  url: http://trawl.example.com:8191
anilist:
  redirectUri: https://tankovault.example.com/account/anilist-callback
bootstrap:
  migrate:
    mode: job
