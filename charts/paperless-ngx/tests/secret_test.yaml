suite: test secret
templates:
  - secret.yaml
tests:
  - it: holds only the credentials that were actually configured
    set:
      paperless.secretKey: ci-secret-key
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-paperless-ngx
      - equal:
          path: stringData.secret-key
          value: ci-secret-key
      # An empty optional credential is absent rather than blank: an empty password is a
      # supplied password, and the container would use it instead of falling back.
      - notExists:
          path: stringData.admin-password
      - notExists:
          path: stringData.redis-password
      - notExists:
          path: stringData.email-password

  - it: carries every credential the release uses
    set:
      paperless.secretKey: ci-secret-key
      paperless.admin.user: admin
      paperless.admin.password: hunter2
      paperless.email.host: smtp.example.com
      paperless.email.password: mail-pw
      redis.password: broker-pw
      database.engine: postgresql
      database.password: db-pw
      postgresql.enabled: true
    asserts:
      - equal:
          path: stringData.admin-password
          value: hunter2
      - equal:
          path: stringData.database-password
          value: db-pw
      - equal:
          path: stringData.redis-password
          value: broker-pw
      - equal:
          path: stringData.email-password
          value: mail-pw

  # SQLite needs no credentials, so a stray database password must not become a Secret key that
  # nothing consumes.
  - it: ignores a database password while SQLite is in use
    set:
      paperless.secretKey: ci-secret-key
      database.password: db-pw
    asserts:
      - notExists:
          path: stringData.database-password

  - it: ignores a mail password with no mail relay configured
    set:
      paperless.secretKey: ci-secret-key
      paperless.email.password: mail-pw
    asserts:
      - notExists:
          path: stringData.email-password

  - it: creates nothing when an existing Secret is supplied
    set:
      existingSecret: paperless-credentials
      paperless.secretKey: ci-secret-key
    asserts:
      - hasDocuments:
          count: 0
