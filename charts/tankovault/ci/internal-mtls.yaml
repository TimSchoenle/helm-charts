# The chart's default identity mode: cert-manager issues one certificate per service and
# trust-manager distributes the CA, so a caller is identified by the DNS SAN on its verified
# client certificate and no credential exists in the release at all.
#
# A render fixture, not an install fixture — the kind cluster runs neither cert-manager nor
# trust-manager, and these endpoints do not resolve. Hence the name: `ct install` takes every
# `ci/*-values.yaml`, while the render and policy jobs glob `ci/*.yaml`. Rendering it offline
# needs `--api-versions cert-manager.io/v1 --api-versions trust.cert-manager.io/v1alpha1`, both
# of which are in `.github/configs/render-api-versions.txt`.
#
# `internal.tokens` is deliberately absent: setting a token here is a render failure, which is
# the check that the two modes cannot both be half-configured at once.
auth:
  jwtSecret: ci-jwt-secret-0123456789abcdef0123
  passwordPepper: ci-password-pepper-0123456789abcd
internal:
  identity: mtls
  tls:
    # The recommended path, and the chart's default: cert-manager issues one certificate per
    # service, renews them on its own, and requests exactly the names the peer configuration
    # expects. `ci/internal-mtls-existing.yaml` covers the other source.
    source: certManager
    certManager:
      issuerRef:
        name: internal-ca
        kind: ClusterIssuer
    ca:
      # The trust-manager path rather than the default `certificateSecret`, so kubeconform and
      # the policy scan see the Bundle and the second volume too. It is also the more robust
      # setup on a real cluster — one bundle, rotatable independently of any one certificate.
      source: configMap
      name: tankovault-ca
      bundle:
        create: true
        sources:
          - secret:
              name: internal-ca
              key: ca.crt
anilist:
  clientId: "12345"
  clientSecret: ci-anilist-client-secret
  tokenEncryptionKey: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  redirectUri: https://tankovault.example.com/account/anilist-callback
externalDatabase:
  url: postgres://tankovault:ci@postgresql.example.com:5432/tankovault
externalRedis:
  url: redis://valkey.example.com:6379
# TLS-enabled, because under mtls each service presents its client certificate to the broker and
# requires TLS on that connection. The bundled NATS serves plaintext and the chart refuses the
# combination outright.
externalNats:
  url: tls://nats.example.com:4222
  # Per-service NATS accounts: one URL per service slug, each carrying its own credential, so the
  # broker can refuse `notifier` the subject `worker` publishes on. The chart projects each pod's
  # own key as `nats__url` and stops deriving the shared one.
  perServiceSecret: tankovault-nats-accounts
externalTrawl:
  url: http://trawl.example.com:8191
services:
  render:
    enabled: true
