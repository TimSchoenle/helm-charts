name: 'Setup Helm Environment'
description: 'Installs a pinned Helm and the chart plugins this repository depends on'
inputs:
  helm-version:
    description: >-
      Helm version to install. Pinned by default: `latest` silently carried this repository
      from Helm 3 to Helm 4, changing the toolchain that packages and signs releases with no
      signal in any diff.
    required: false
    default: 'v3.21.3'
  unittest-version:
    description: 'helm-unittest plugin version'
    required: false
    default: '1.1.2'
  schema-version:
    description: 'helm-schema plugin version'
    required: false
    default: '0.18.1'
runs:
  using: "composite"
  steps:
    - name: Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: ${{ inputs.helm-version }}

    - name: Install Helm plugins
      shell: bash
      env:
        UNITTEST_VERSION: ${{ inputs.unittest-version }}
        SCHEMA_VERSION: ${{ inputs.schema-version }}
      run: |
        set -euo pipefail

        # Helm 4 verifies plugin signatures on install by default and neither plugin publishes
        # a provenance file, so verification has to be disabled there. Helm 3 does not know the
        # flag at all and aborts with "unknown flag: --verify". Probe for the flag rather than
        # branching on the version, so this survives the whole version matrix.
        verify_args=()
        if helm plugin install --help | grep -q -- '--verify'; then
          verify_args=(--verify=false)
        fi

        helm plugin install https://github.com/helm-unittest/helm-unittest \
          --version "${UNITTEST_VERSION}" ${verify_args[@]+"${verify_args[@]}"}

        helm plugin install https://github.com/dadav/helm-schema \
          --version "${SCHEMA_VERSION}" ${verify_args[@]+"${verify_args[@]}"}

    - name: Report installed versions
      shell: bash
      run: |
        helm version
        helm plugin list
