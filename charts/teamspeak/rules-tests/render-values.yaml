# Values `just test-rules` renders this chart with before extracting its `PrometheusRule`.
#
# Everything here exists to get exactly one PrometheusRule out of `helm template`: the rules
# themselves, plus the two things the chart's validator refuses to render without. Nothing about
# the workloads matters — the rendered rules are the only output the harness keeps.
license:
  accept: true

serverQuery:
  adminPassword: rules-test-password

metrics:
  enabled: true
  prometheusRule:
    enabled: true
    # Left at the default on purpose: `release` is the scope a real install gets, and
    # `scoping_test.yml` asserts the property it exists for. The harness renders into the
    # `rules-test` namespace under the release name `teamspeak`, so the substituted matcher is
    # `namespace="rules-test", pod=~"teamspeak-.*"` — which makes this value, the namespace and
    # the release name one contract between the runner and that suite.
    scope: release
