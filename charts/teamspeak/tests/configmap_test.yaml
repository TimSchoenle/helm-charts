suite: test configmap
templates:
  - configmap.yaml
set:
  license.accept: true
tests:
  # Inputs are set explicitly so this stays a test of the values -> TS3SERVER_* mapping. The
  # shipped defaults are guarded separately, below.
  - it: publishes the port and query settings the entrypoint turns into ts3server.ini
    set:
      server.voicePort: 9988
      server.fileTransferPort: 30034
      server.queryPort: 10012
      serverQuery.protocols: ssh
      serverQuery.timeout: 301
    asserts:
      - equal:
          path: data.TS3SERVER_DEFAULT_VOICE_PORT
          value: "9988"
      - equal:
          path: data.TS3SERVER_FILETRANSFER_PORT
          value: "30034"
      - equal:
          path: data.TS3SERVER_QUERY_PORT
          value: "10012"
      - equal:
          path: data.TS3SERVER_QUERY_PROTOCOLS
          value: ssh
      - equal:
          path: data.TS3SERVER_QUERY_TIMEOUT
          value: "301"

  # Deliberate contract guard: TeamSpeak clients dial these numbers, so the shipped defaults
  # have to stay the protocol defaults. If this fails, the default was changed on purpose and
  # the change needs a conscious decision — it is not a test to relax.
  - it: ships the TeamSpeak protocol default ports
    asserts:
      - equal:
          path: data.TS3SERVER_DEFAULT_VOICE_PORT
          value: "9987"
      - equal:
          path: data.TS3SERVER_FILETRANSFER_PORT
          value: "30033"
      - equal:
          path: data.TS3SERVER_QUERY_PORT
          value: "10011"

  # The ini file takes 0/1, not the YAML booleans the values file is written in.
  - it: renders booleans the way the server's ini parser expects
    set:
      server.hintsEnabled: false
      server.logQueryCommands: true
      server.logAppend: true
      serverQuery.skipBruteForceCheck: true
    asserts:
      - equal:
          path: data.TS3SERVER_HINTS_ENABLED
          value: "0"
      - equal:
          path: data.TS3SERVER_LOG_QUERY_COMMANDS
          value: "1"
      - equal:
          path: data.TS3SERVER_LOG_APPEND
          value: "1"
      - equal:
          path: data.TS3SERVER_QUERY_SKIPBRUTEFORCECHECK
          value: "1"

  - it: defaults to the bundled SQLite database and its schema directory
    asserts:
      - equal:
          path: data.TS3SERVER_DB_PLUGIN
          value: ts3db_sqlite3
      - equal:
          path: data.TS3SERVER_DB_SQLCREATEPATH
          value: create_sqlite
      # Connection details would be meaningless for a file-backed database.
      - notExists:
          path: data.TS3SERVER_DB_HOST

  - it: derives the schema directory from the database plugin
    set:
      database.plugin: ts3db_mariadb
      database.host: mariadb.data.svc
      database.password: s3cret
      database.name: ts3
      database.user: ts3user
      database.port: 3307
    asserts:
      - equal:
          path: data.TS3SERVER_DB_SQLCREATEPATH
          value: create_mariadb
      - equal:
          path: data.TS3SERVER_DB_HOST
          value: mariadb.data.svc
      - equal:
          path: data.TS3SERVER_DB_PORT
          value: "3307"
      - equal:
          path: data.TS3SERVER_DB_NAME
          value: ts3
      - equal:
          path: data.TS3SERVER_DB_USER
          value: ts3user

  - it: uses the PostgreSQL schema directory for the PostgreSQL plugin
    set:
      database.plugin: ts3db_postgresql
      database.host: postgres.data.svc
      database.password: s3cret
    asserts:
      - equal:
          path: data.TS3SERVER_DB_SQLCREATEPATH
          value: create_postgresql

  # The ConfigMap is readable by anything with get on ConfigMaps in the namespace, so a
  # credential landing here would be a real leak.
  - it: never carries a password
    set:
      serverQuery.adminPassword: hunter2
      database.plugin: ts3db_mariadb
      database.host: mariadb
      database.password: s3cret
    asserts:
      - notExists:
          path: data.TS3SERVER_SERVERADMIN_PASSWORD
      - notExists:
          path: data.TS3SERVER_DB_PASSWORD

  - it: passes extra settings through, rendering templates in their values
    set:
      extraServerConfig:
        TS3SERVER_LOG_PATH: /var/ts3server/logs
        TS3SERVER_MACHINE_ID: "{{ .Release.Name }}-1"
    asserts:
      - equal:
          path: data.TS3SERVER_LOG_PATH
          value: /var/ts3server/logs
      - equal:
          path: data.TS3SERVER_MACHINE_ID
          value: RELEASE-NAME-1

  - it: omits the machine id unless one is set
    asserts:
      - notExists:
          path: data.TS3SERVER_MACHINE_ID
