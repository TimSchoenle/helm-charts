  - it: delivers sentry.server_name into config.toml
    documentSelector:
      path: data["config.toml"]
    set:
      config.csp.cloudflare.script_nonce: false
      config.sentry.server_name: contract-probe-sentry-server-name
    asserts:
      - matchRegex:
