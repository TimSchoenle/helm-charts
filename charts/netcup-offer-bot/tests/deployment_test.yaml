suite: deployment
templates:
  - deployment.yaml
  - configmap.yaml
  - secret.yaml
set:
  discord.webhookUrl: https://example.invalid/hook
tests:
  - it: creates a Deployment named after the release
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-netcup-offer-bot

  # The whole point of the migration: the loader refuses a key supplied by both the environment
  # and a file, and the webhook no longer appears in `kubectl describe pod` or in the
  # environment of a child process. The only variables left are the two that decide what the
  # file layers are.
  - it: passes configuration as files, not as environment
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: NETCUP_OFFER_BOT_CONFIG
              value: /etc/netcup-offer-bot/config
            - name: NETCUP_OFFER_BOT_SECRETS_DIR
              value: /etc/netcup-offer-bot/secrets
      - notExists:
          path: spec.template.spec.containers[0].envFrom

  - it: mounts the rendered configuration read-only
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            configMap:
              name: RELEASE-NAME-netcup-offer-bot
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /etc/netcup-offer-bot/config
            readOnly: true

  - it: projects the webhook the bot reads by file name
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: secrets
            projected:
              defaultMode: 256
              sources:
                - secret:
                    name: RELEASE-NAME-netcup-offer-bot
                    optional: true
                    items:
                      - key: discord__webhook_url
                        path: discord__webhook_url
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: secrets
            mountPath: /etc/netcup-offer-bot/secrets
            readOnly: true

  - it: projects an existing Secret when one is given
    documentSelector:
      path: kind
      value: Deployment
    set:
      discord.webhookUrl: null
      existingSecret: my-webhook-secret
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: secrets
            projected:
              defaultMode: 256
              sources:
                - secret:
                    name: my-webhook-secret
                    optional: true
                    items:
                      - key: discord__webhook_url
                        path: discord__webhook_url

  - it: mounts the state volume the bot needs to avoid re-announcing offers
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /app/data
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: RELEASE-NAME-netcup-offer-bot

  # A rolling update cannot start: the replacement pod would have to attach a ReadWriteOnce
  # volume that the outgoing pod still holds.
  - it: uses Recreate while a ReadWriteOnce claim is attached
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: leaves the default rolling update in place for a shared volume
    documentSelector:
      path: kind
      value: Deployment
    set:
      persistence.data.accessMode: ReadWriteMany
    asserts:
      - notExists:
          path: spec.strategy

  - it: lets an explicit strategy win
    documentSelector:
      path: kind
      value: Deployment
    set:
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate

  - it: falls back to an emptyDir when persistence is disabled
    documentSelector:
      path: kind
      value: Deployment
    set:
      persistence.data.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir: {}
      - notExists:
          path: spec.strategy

  - it: binds an existing claim when one is given
    documentSelector:
      path: kind
      value: Deployment
    set:
      persistence.data.existingClaim: my-state
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: my-state

  - it: exposes the metrics port only when metrics are enabled
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].ports

  - it: exposes a named metrics port when metrics are enabled
    documentSelector:
      path: kind
      value: Deployment
    set:
      metrics.enabled: true
      metrics.port: 9184
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - containerPort: 9184
              name: metrics
              protocol: TCP
