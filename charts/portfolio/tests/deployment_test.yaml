suite: deployment
templates:
  - deployment.yaml
  - configmap.yaml
# The deployment annotates a checksum of the ConfigMap, so both templates must render; the
# per-test selector keeps assertions on the Deployment.
tests:
  - it: creates a Deployment named after the release
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-portfolio

  - it: exposes the application port as http
    documentSelector:
      path: kind
      value: Deployment
    set:
      application.port: 9090
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - containerPort: 9090
              name: http
              protocol: TCP

  - it: probes the health endpoint on all three probes
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /api/health
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /api/health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /api/health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: http

  # Kubernetes rejects any successThreshold other than 1 on startup and liveness probes.
  - it: omits successThreshold where Kubernetes forbids it
    documentSelector:
      path: kind
      value: Deployment
    set:
      startupProbe.successThreshold: 3
      livenessProbe.successThreshold: 3
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe.successThreshold
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe.successThreshold
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.successThreshold
          value: 1

  - it: drops a probe entirely when disabled
    documentSelector:
      path: kind
      value: Deployment
    set:
      startupProbe.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - exists:
          path: spec.template.spec.containers[0].livenessProbe

  - it: loads configuration from the ConfigMap
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: RELEASE-NAME-portfolio

  - it: injects no secrets at runtime
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env

  # Without this the pod keeps running the old configuration after a values change.
  - it: rolls the pod when the ConfigMap changes
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/configmap"]

  - it: applies the configured resource requests and limits
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 250m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 32Mi

  - it: falls back to a named resource preset
    documentSelector:
      path: kind
      value: Deployment
    set:
      resources: null
      resourcesPreset: micro
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 25m
      # Presets set no CPU limit: it cannot protect the node the way a memory limit does,
      # it only throttles this workload.
      - notExists:
          path: spec.template.spec.containers[0].resources.limits.cpu
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 128Mi

  - it: scales to the requested replica count
    documentSelector:
      path: kind
      value: Deployment
    set:
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3
