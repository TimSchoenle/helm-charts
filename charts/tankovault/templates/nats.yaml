{{- if .Values.nats.enabled }}
{{- $nats := .Values.nats }}
{{- $name := include "common.fullname.suffixed" (dict "ctx" . "suffix" "nats") }}
{{- /*
  JetStream is not optional for TankoVault: the control plane publishes scan tasks to a work
  queue and the notifier consumes domain events from a stream, so a core-only NATS would start
  cleanly and then drop every task. The monitoring port exists purely so the probes have
  something to talk to — `/healthz` is the endpoint upstream's own compose healthcheck uses.
*/ -}}
{{- $probe := dict "enabled" true "httpGet" (dict "path" "/healthz" "port" "monitor") }}
{{- $values := include "tankovault.datastore.values" (dict
      "ctx" .
      "image" $nats.image
      "resources" $nats.resources
      "runAsUser" 1000 "runAsGroup" 1000 "fsGroup" 1000
      "startupProbe" (merge (dict "periodSeconds" 5 "timeoutSeconds" 3 "failureThreshold" 30) (deepCopy $probe))
      "livenessProbe" (merge (dict "periodSeconds" 30 "timeoutSeconds" 5 "failureThreshold" 5) (deepCopy $probe))
      "readinessProbe" (merge (dict "periodSeconds" 10 "timeoutSeconds" 3 "failureThreshold" 3) (deepCopy $probe))
    ) | fromYaml }}
{{- $ctx := dict "Values" $values "Chart" $.Chart "Release" $.Release "Capabilities" $.Capabilities "Template" $.Template "Files" $.Files }}
{{- $mounts := list (dict "name" "data" "mountPath" "/data") }}
{{- $volumes := list }}
{{- if not $nats.persistence.enabled }}
{{- $volumes = append $volumes (dict "name" "data" "emptyDir" dict) }}
{{- else if $nats.persistence.existingClaim }}
{{- $volumes = append $volumes (dict "name" "data" "persistentVolumeClaim" (dict "claimName" $nats.persistence.existingClaim)) }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  {{- include "tankovault.datastore.metadata" (dict "ctx" . "component" "nats") | nindent 2 }}
spec:
  type: ClusterIP
  ports:
    - name: client
      port: 4222
      targetPort: client
      protocol: TCP
    - name: monitor
      port: 8222
      targetPort: monitor
      protocol: TCP
  selector:
    {{- include "tankovault.datastore.selectorLabels" (dict "ctx" . "component" "nats") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  {{- include "tankovault.datastore.metadata" (dict "ctx" . "component" "nats") | nindent 2 }}
spec:
  replicas: 1
  serviceName: {{ $name }}
  selector:
    matchLabels:
      {{- include "tankovault.datastore.selectorLabels" (dict "ctx" . "component" "nats") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.podLabels" $ctx | nindent 8 }}
        app.kubernetes.io/component: nats
    spec:
      {{- include "common.podSpec.common" $ctx | nindent 6 }}
      containers:
        {{- include "common.container" (dict
              "ctx" $ctx
              "name" "nats"
              "args" (list "-js" "-sd" "/data" "-m" "8222")
              "ports" (list
                (dict "name" "client" "containerPort" 4222 "protocol" "TCP")
                (dict "name" "monitor" "containerPort" 8222 "protocol" "TCP"))
              "volumeMounts" $mounts
            ) | nindent 8 }}
      {{- with (include "common.volumes" (dict "ctx" $ctx "volumes" $volumes)) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
  {{- if and $nats.persistence.enabled (not $nats.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "common.immutableLabels" $ctx | nindent 10 }}
          app.kubernetes.io/component: nats
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with $nats.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $nats.persistence.size | quote }}
  {{- end }}
{{- end }}
