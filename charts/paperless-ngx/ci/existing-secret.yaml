# Every credential taken from a Secret the operator created, under key names of their choosing.
# This is the production shape: nothing sensitive is in `values.yaml`, and therefore nothing
# sensitive is in the Helm release object either.
#
# Named without the `-values` suffix, so `ct install` skips it: the Secret it names does not exist
# on the CI cluster, so the pod would sit in `CreateContainerConfigError` forever. What the render
# has to prove is that every `secretKeyRef` points at the operator's key names rather than the
# chart's own, and that no Secret of the chart's own is created alongside.
existingSecret: paperless-ngx-credentials

paperless:
  existingSecretKey: django-secret-key
  admin:
    user: admin
    email: admin@example.com
    existingSecretKey: admin-password
  email:
    host: smtp.example.com
    user: paperless
    existingSecretKey: smtp-password

database:
  engine: postgresql
  host: postgres.data.svc.cluster.local
  existingSecretKey: postgres-password

redis:
  host: valkey.data.svc.cluster.local
  existingSecretKey: broker-password

valkey:
  enabled: false

networkPolicy:
  enabled: true
  engine: kubernetes
  egress:
    external:
      enabled: true
      namespaceSelector:
        kubernetes.io/metadata.name: data

persistence:
  media:
    size: 1Gi
  data:
    size: 1Gi
  consume:
    size: 1Gi
