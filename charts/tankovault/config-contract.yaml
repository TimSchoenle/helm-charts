# vim: set ft=yaml:
# yaml-language-server: $schema=https://raw.githubusercontent.com/TimSchoenle/terrace-config/main/spec/helm/v1/declaration.schema.json

# What this chart's rendered configuration must satisfy, which images decide that, and the gates
# the chart is enrolled in. A key left out takes its default (spec/helm/v1/DEFAULTS.md in
# terrace-config). This chart writes each document's selector and image path, because neither is
# the default, and leaves out the `config.toml` key and the contract under the document's name. It
# writes consumers only where the workloads that mount the ConfigMap are not all its readers. This
# prints the file with every default written out:
#
#   terrace-contract config show --chart tankovault
#
# Nine documents, not one. Every service renders its own `config.toml` into its own ConfigMap —
# the chart merges the root `config` with each service's own block at render time — so each
# document has exactly one reader and the union is the identity for all nine. That is worth
# stating because the design this pipeline was built to expects the opposite shape: one document
# read by eight binaries, which is where unioning contracts would have earned its keep. It does
# not arise here.
#
# Selected by `app.kubernetes.io/component`, which is the only label that distinguishes these
# objects from one another: every one of them shares the release's `name` and `instance` labels,
# and `fullnameOverride` moves every object's name at once. The chart sets the component itself,
# so the selector is reading a fact the chart already asserts rather than a naming convention.
#
# A selector matching zero or several objects is reported rather than resolved, so a component
# that is renamed or dropped fails loudly instead of becoming a skipped check.

# What this chart adds to the credential reference in its README, which `just config-readme`
# generates from the nine contracts. The rows are theirs — every key any of them marks
# `secret: true`, whether the image requires it, and which services read it — and these two
# columns are the chart's: the value an operator may set instead of pre-creating the Secret, and
# the condition under which a release needs the credential at all. Neither is derivable: a
# credential travels the secrets directory rather than the configuration document, so it carries
# no `# @config` marker naming the value that feeds it, and no contract knows which of this
# chart's nine services a release turned on.
#
# Both go stale loudly. An entry for a key the contracts stop declaring secret fails the gate,
# and so does a `value` this chart's values.yaml no longer exposes.
credentials:
  - key: anilist.client_secret
    value: anilist.clientSecret
    note: "`services.sync.enabled`, and issued by AniList rather than generated"
  - key: anilist.token_encryption_key
    value: anilist.tokenEncryptionKey
    note: "`services.sync.enabled`; generated when empty"
  - key: auth.jwt_secret
    value: auth.jwtSecret
    note: always; generated when empty
  - key: auth.mfa_encryption_key
    value: auth.mfaEncryptionKey
    note: "`services.api.enabled`; generated when empty"
  - key: auth.password_pepper
    value: auth.passwordPepper
    note: generated on a first install only — see above
  - key: channels.discord_webhook_url
    value: channels.discordWebhookUrl
    note: "`services.notifier.enabled`, for the Discord channel"
  - key: channels.webhook_url
    value: channels.webhookUrl
    note: "`services.notifier.enabled`, for a generic webhook"
  - key: database.url
    note: >-
      derived from `postgresql` or `externalDatabase`; set it only through `config` or an
      `existingSecret`
  - key: email.password
    value: email.password
    note: with `email.host`
  - key: email.url
    note: not surfaced as a value; write it into `config` or the Secret
  - key: internal.caller.token
    note: >-
      `internal.identity=token`; stored under the Secret key `internal__tokens__<caller>` and
      projected to this file name, one per caller — see above
  - key: internal.token
    note: the pre-4.0 shared token, refused at boot upstream; see the migration note above
  - key: nats.url
    note: derived from `nats` or `externalNats`
  - key: redis.url
    note: derived from `redis` or `externalRedis`
  - key: seed_admin_password
    value: bootstrap.seedAdmin.password
    note: "`bootstrap.seedAdmin.enabled`; generated when empty"
  - key: telemetry.sentry.dsn
    value: telemetry.sentry.dsn
    note: "`telemetry.sentry.enabled`"

# Whether `just check-config-bindings` holds this chart's values against the keys below.
#
# Declared rather than inferred from the chart carrying markers: a chart that loses them — a
# botched edit, a spelling the parser does not recognise — would otherwise drop out of that gate's
# report without a word. With the switch here, markers without it and it without markers are both
# errors.
bindings: true

# Enrols this chart in the generated round-trip suites (`just contract-tests`), one per document.
# They prove what `just check-config` cannot: that a setting an operator writes arrives in the
# rendered document at the path the image reads it from. Each document's `tests` block says how its
# suite is generated.
#
# Nine documents, and two of this chart's properties decide what every entry below says.
#
# **`.Values.config` is the lowest layer here, not the highest.** `tankovault.configToml` merges
# the root `config` tree, then everything the chart derives from its first-class values, then
# `services.<name>.config`. Every other chart in this repository merges the operator's tree *over*
# what it derives, so a probe written into `config` wins; here it is overwritten before it reaches
# the file for any key the chart derives. Each service therefore names its own highest-precedence
# layer as the probe root, and the one document that has no such layer — `bootstrap`, a Job rather
# than a service — keeps the default.
#
# **A probe now goes into the chart's own value wherever one is bound.** 219 bindings carry a
# `# @config` marker naming the key they feed, so most cases here write `telemetry.sentry.release`
# rather than `services.api.config.telemetry.sentry.release` and prove the mapping rather than the
# merge. The probe root still matters: it is where a key with no bound value goes, and it is what
# the baseline and the prerequisite rules are read against.
tests: true

# Contract keys no chart value binds, each group with the reason it does not.
#
# Chart-level, and grouped: nine documents declare 190 key paths between them, and one entry per
# key per document would be 387 of them repeating four sentences. The keys are still written out
# one by one — there is no pattern form — so a key the next release adds turns
# `just check-config-bindings` red until someone decides which group it belongs in.
#
# Four groups, and the difference between them is what a reader needs: eleven keys the chart
# derives from the topology it just built, sixteen delivered as files in the secrets directory,
# the `branding.*` keys that *are* surfaced but are deliberately not sent to every service that
# declares them, and the rest — settings the image reads and this chart offers no value for.
#
# `documents:` appears on the third group only, which is the shape it exists for.
unbound:
  - keys:
      - bind_addr
      - control_plane_url
      - frontend.api_upstream
      - internal.caller.name
      - internal.peers
      - internal.tls.probe_listen
      - rate_limit.backend
      - sync_url
      - telemetry.service_name
      - worker.challenge_solver_endpoint
      - worker_url
    reason: >-
      Written by the chart from the topology it has just built rather than from any value an operator
      sets — a Service address, a port fixed in `tankovault.serviceSpecs`, a slug, or the peer list
      of the service being rendered. There is no chart value to put a marker on, and inventing one
      would make the release's own shape configurable for no reason. `just check-config` validates
      whatever these render to.

  - keys:
      - anilist.client_id
      - anilist.client_secret
      - anilist.token_encryption_key
      - auth.jwt_secret
      - auth.mfa_encryption_key
      - auth.password_pepper
      - channels.discord_webhook_url
      - channels.webhook_url
      - database.url
      - email.password
      - email.url
      - email.username
      - internal.caller.token
      - internal.token
      - seed_admin_password
      - telemetry.sentry.dsn
    reason: >-
      Delivered as a file in TANKOVAULT_SECRETS_DIR — from the Secret this chart renders, or from
      `existingSecret` — and never written into a ConfigMap, because a credential there is readable
      by anything that can read the namespace. Chart values do carry these; the binding runs through
      the Secret rather than through the configuration document a marker describes, and `just
      check-config-secrets` reconciles that channel from the rendered manifests rather than from a
      comment.

  - keys:
      - branding.bot_user_agent
    documents: [api, frontend]
    reason: >-
      Surfaced by a chart value, and deliberately not written into these documents. Every service
      that declares the block is sent only the half it reads: `api` serves the reader-facing identity
      and stamps it into mail and the WebAuthn prompt, `frontend` rewrites the app shell's title and
      description from the name and tagline alone, and `worker` reads the crawler user-agent and
      nothing else. Emitting the whole block to all three would give each of them keys it never
      opens. The marker on the value names the documents that do receive it.

  - keys:
      - branding.copyright.holder
      - branding.copyright.notice
      - branding.copyright.year
      - branding.licence.name
      - branding.licence.url
      - branding.project_url
      - branding.releases_url
      - branding.wordmark.accent
      - branding.wordmark.lead
    documents: [frontend, worker]
    reason: >-
      Surfaced by a chart value, and deliberately not written into these documents. Every service
      that declares the block is sent only the half it reads: `api` serves the reader-facing identity
      and stamps it into mail and the WebAuthn prompt, `frontend` rewrites the app shell's title and
      description from the name and tagline alone, and `worker` reads the crawler user-agent and
      nothing else. Emitting the whole block to all three would give each of them keys it never
      opens. The marker on the value names the documents that do receive it.

  - keys:
      - branding.name
      - branding.tagline
    documents: [worker]
    reason: >-
      Surfaced by a chart value, and deliberately not written into these documents. Every service
      that declares the block is sent only the half it reads: `api` serves the reader-facing identity
      and stamps it into mail and the WebAuthn prompt, `frontend` rewrites the app shell's title and
      description from the name and tagline alone, and `worker` reads the crawler user-agent and
      nothing else. Emitting the whole block to all three would give each of them keys it never
      opens. The marker on the value names the documents that do receive it.

