# vim: set ft=yaml:
# yaml-language-server: $schema=https://raw.githubusercontent.com/TimSchoenle/terrace-config/main/spec/helm/v1/declaration.schema.json

# What this chart's rendered configuration must satisfy, which images decide that, and the gates
# the chart is enrolled in. A key left out takes its default (spec/helm/v1/DEFAULTS.md in
# terrace-config): the ConfigMap labelled with the release, its `config.toml`, the one image at
# `image` with its contract under the document's name, and the workloads that mount it.
# This prints the file with every default written out:
#
#   terrace-contract config show --chart netcup-offer-bot

# What this chart adds to the credential reference in its README, which `just config-readme`
# generates from the contract. The rows are the contract's — every key it marks `secret: true`,
# and whether the image requires it — and these two columns are the chart's: the value an
# operator may set instead of pre-creating the Secret, and the condition under which a release
# needs the credential at all. Neither is derivable, and both are refused once they go stale: an
# entry for a key the contract stops declaring secret, or a `value` this chart's values.yaml no
# longer exposes, fails the gate.
credentials:
  - key: discord.webhook_url
    value: discord.webhookUrl
    note: always — the bot refuses to render without a webhook
  - key: telemetry.sentry.dsn
    value: telemetry.sentry.dsn
    note: "`telemetry.sentry.enabled`"

# Whether `just check-config-bindings` holds this chart's values against the keys below.
#
# Declared rather than inferred from the chart carrying markers: a chart that loses them — a
# botched edit, a spelling the parser does not recognise — would otherwise drop out of that gate's
# report without a word. With the switch here, markers without it and it without markers are both
# errors.
bindings: true

# Enrols this chart in the generated round-trip suites (`just contract-tests`). They prove what
# `just check-config` cannot: that a setting written into `config` arrives in the rendered document
# at the path the image reads it from. Each document's `tests` block states what every generated
# case has to carry before this chart will render.
tests: true

# Contract keys no chart value binds, each group with the reason it does not.
#
# Chart-level: a key nothing surfaces is unsurfaced in every document that declares it, and this
# chart declares one. `documents:` narrows an entry where that is untrue.
#
# Secret keys are not exempt by default, and each one is written out. The blanket rule
# "credentials need no marker" was refused because it cannot tell a key delivered as a file from
# a key a chart merely forgot: both look identical from the contract's side, and the second is
# exactly the regression this gate exists to catch. Naming them one by one costs a line and
# keeps the gate honest — a chart that stopped projecting one would go red rather than quiet.
unbound:
  - keys:
      - discord.webhook_url
      - telemetry.sentry.dsn
    reason: >-
      Delivered as files in the secrets directory — from the Secret this chart renders, or
      from `existingSecret` under the file names `discord__webhook_url` and
      `telemetry__sentry__dsn` — and never written into `config.toml`, because a bearer
      credential in a ConfigMap is readable by anything that can read the namespace. The DSN
      embeds an ingest key and is one. `discord.webhookUrl` and `telemetry.sentry.dsn` are the
      values that carry them, so both bindings exist; they simply do not run through the
      configuration document the markers describe. `just check-config-secrets` is what
      reconciles that channel, and it does it from the rendered manifests rather than from a
      comment.

documents:
  - name: bot
    tests:
      # The chart values every generated case carries, the identity case among them: this chart's
      # `validateValues` fails the template before a ConfigMap exists for any case to assert
      # against, so there is no case here that can do without them.
      #
      # Flat dotted paths, exactly as the helm-unittest `set` block they become spells them.
      # Nothing here may name a path under `config`: a prerequisite is never dropped for the case
      # it collides with, the way a baseline is, so one written into the tree the cases probe could
      # supply the very value a case exists to prove the chart delivered. The generator refuses one
      # outright.
      prerequisites:
        values:
          discord.webhookUrl: https://render-prerequisite.invalid/api/webhooks/0/0
          existingSecret: netcup-contract-probe

        reason: >-
          `netcup-offer-bot.validateValues` refuses a render that projects no
          `discord__webhook_url` file — a bot with nowhere to post announces into nothing — and it
          runs from `configmap.yaml`, so without a webhook there is no document for any case to
          assert against. The guard reads the projected key list rather than the value, so
          `existingSecret` would satisfy it as well; the first-class value is used instead because
          it keeps the enrolment to one line and leaves the chart's Secret rendering on the path
          every other case exercises. This is the one prerequisite in the repository that occupies
          a `secret: true` contract key, which the generator refuses to invent a probe for on the
          grounds that a credential-shaped value in a test file is a credential. It is written here
          rather than synthesised, and it is not a credential: `.invalid` is reserved by RFC 2606
          and can never resolve, and the webhook id and token are both zero, which Discord issues
          to nobody. `discord.webhook_url` carries no case in this suite for that same `secret`
          rule, so nothing is being covered up. The chart merges `.Values.config` over everything
          it derives from its values, so a probe still wins wherever the two would meet.

          `existingSecret` is the second entry, and it answers a different guard. Every
          `telemetry.sentry.*` key carries a `when telemetry.sentry.enabled` clause, so a case
          probing one switches Sentry on and the chart then refuses the render unless a DSN is
          available. Naming a Secret satisfies that without a credential-shaped string in a
          committed file, and changes nothing the cases assert against: the DSN travels as a file
          in the secrets directory and never reaches `config.toml`. The Secret does not have to
          exist for a template render.
