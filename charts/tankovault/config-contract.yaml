# vim: set ft=yaml:

# What this chart's rendered configuration must satisfy, and which images decide that.
#
# Nine documents, not one. Every service renders its own `config.toml` into its own ConfigMap —
# the chart merges the root `config` with each service's own block at render time — so each
# document has exactly one reader and the union is the identity for all nine. That is worth
# stating because the design this pipeline was built to expects the opposite shape: one document
# read by eight binaries, which is where unioning contracts would have earned its keep. It does
# not arise here.
#
# Selected by `app.kubernetes.io/component`, which is the only label that distinguishes these
# objects from one another: every one of them shares the release's `name` and `instance` labels,
# and `fullnameOverride` moves every object's name at once. The chart sets the component itself,
# so the selector is reading a fact the chart already asserts rather than a naming convention.
#
# A selector matching zero or several objects is reported rather than resolved, so a component
# that is renamed or dropped fails loudly instead of becoming a skipped check.

# Whether `just check-config-bindings` holds this chart's values against the keys below.
#
# Declared rather than inferred from the chart carrying markers: a chart that loses them — a
# botched edit, a spelling the parser does not recognise — would otherwise drop out of that gate's
# report without a word. With the switch here, markers without it and it without markers are both
# errors.
bindings: true

# Contract keys no chart value binds, each group with the reason it does not.
#
# Chart-level, and grouped: nine documents declare 183 key paths between them, and one entry per
# key per document would be 378 of them repeating four sentences. The keys are still written out
# one by one — there is no pattern form — so a key the next release adds turns
# `just check-config-bindings` red until someone decides which group it belongs in.
#
# Four groups, and the difference between them is what a reader needs: eleven keys the chart
# derives from the topology it just built, sixteen delivered as files in the secrets directory,
# the `branding.*` keys that *are* surfaced but are deliberately not sent to every service that
# declares them, and the rest — settings the image reads and this chart offers no value for.
#
# `documents:` appears on the third group only, which is the shape it exists for.
unbound:
  - keys:
      - bind_addr
      - control_plane_url
      - frontend.api_upstream
      - internal.caller.name
      - internal.peers
      - internal.tls.probe_listen
      - rate_limit.backend
      - sync_url
      - telemetry.service_name
      - worker.challenge_solver_endpoint
      - worker_url
    reason: >-
      Written by the chart from the topology it has just built rather than from any value an operator
      sets — a Service address, a port fixed in `tankovault.serviceSpecs`, a slug, or the peer list
      of the service being rendered. There is no chart value to put a marker on, and inventing one
      would make the release's own shape configurable for no reason. `just check-config` validates
      whatever these render to.

  - keys:
      - anilist.client_id
      - anilist.client_secret
      - anilist.token_encryption_key
      - auth.jwt_secret
      - auth.mfa_encryption_key
      - auth.password_pepper
      - channels.discord_webhook_url
      - channels.webhook_url
      - database.url
      - email.password
      - email.url
      - email.username
      - internal.caller.token
      - internal.token
      - seed_admin_password
      - telemetry.sentry.dsn
    reason: >-
      Delivered as a file in TANKOVAULT_SECRETS_DIR — from the Secret this chart renders, or from
      `existingSecret` — and never written into a ConfigMap, because a credential there is readable
      by anything that can read the namespace. Chart values do carry these; the binding runs through
      the Secret rather than through the configuration document a marker describes, and `just
      check-config-secrets` reconciles that channel from the rendered manifests rather than from a
      comment.

  - keys:
      - branding.bot_user_agent
    documents: [api, frontend]
    reason: >-
      Surfaced by a chart value, and deliberately not written into these documents. Every service
      that declares the block is sent only the half it reads: `api` serves the reader-facing identity
      and stamps it into mail and the WebAuthn prompt, `frontend` rewrites the app shell's title and
      description from the name and tagline alone, and `worker` reads the crawler user-agent and
      nothing else. Emitting the whole block to all three would give each of them keys it never
      opens. The marker on the value names the documents that do receive it.

  - keys:
      - branding.copyright.holder
      - branding.copyright.notice
      - branding.copyright.year
      - branding.licence.name
      - branding.licence.url
      - branding.project_url
      - branding.releases_url
      - branding.wordmark.accent
      - branding.wordmark.lead
    documents: [frontend, worker]
    reason: >-
      Surfaced by a chart value, and deliberately not written into these documents. Every service
      that declares the block is sent only the half it reads: `api` serves the reader-facing identity
      and stamps it into mail and the WebAuthn prompt, `frontend` rewrites the app shell's title and
      description from the name and tagline alone, and `worker` reads the crawler user-agent and
      nothing else. Emitting the whole block to all three would give each of them keys it never
      opens. The marker on the value names the documents that do receive it.

  - keys:
      - branding.name
      - branding.tagline
    documents: [worker]
    reason: >-
      Surfaced by a chart value, and deliberately not written into these documents. Every service
      that declares the block is sent only the half it reads: `api` serves the reader-facing identity
      and stamps it into mail and the WebAuthn prompt, `frontend` rewrites the app shell's title and
      description from the name and tagline alone, and `worker` reads the crawler user-agent and
      nothing else. Emitting the whole block to all three would give each of them keys it never
      opens. The marker on the value names the documents that do receive it.

  - keys:
      - anilist.default_conflict_policy
      - anilist.graphql_url
      - anilist.min_request_interval_ms
      - anilist.oauth_base
      - audit.enabled
      - audit.record_ip
      - audit.record_user_agent
      - audit.retention_days
      - audit.sweep_interval_hours
      - auth.access_ttl_minutes
      - auth.cookie_secure
      - auth.mfa_challenge_ttl_minutes
      - auth.refresh_ttl_days
      - auth.step_up_max_ttl_minutes
      - auth.step_up_ttl_minutes
      - auth.totp_issuer
      - auth.webauthn_rp_id
      - auth.webauthn_rp_name
      - channels.timeout_secs
      - chapter_outliers.enabled
      - chapter_outliers.gap_factor
      - chapter_outliers.max_rejected_fraction
      - chapter_outliers.min_body
      - chapter_outliers.min_gap
      - chapter_outliers.min_sample
      - chapter_outliers.sparse_factor
      - client.max_version
      - client.min_version
      - client.release_repo
      - database.acquire_timeout_secs
      - database.max_connections
      - email.envelope_from
      - email.timeout_secs
      - features.refresh_secs
      - frontend.connect_timeout_secs
      - frontend.max_body_bytes
      - frontend.notices_path
      - frontend.static_dir
      - matching.auto_merge
      - matching.block_auto_merge_on_author_conflict
      - matching.block_auto_merge_on_numeric_conflict
      - matching.block_auto_merge_on_type_conflict
      - matching.block_auto_merge_on_year_conflict
      - matching.candidate_limit
      - matching.high
      - matching.low
      - metadata.enrich_batch
      - metadata.enrich_enabled
      - metadata.enrich_interval_secs
      - metadata.enrich_max_series
      - metadata.priority
      - metadata.tags.adult_tags
      - metadata.tags.blocklist
      - metadata.tags.use_defaults
      - metrics.http_requests
      - metrics.route
      - rate_limit.auth.burst
      - rate_limit.auth.per_minute
      - rate_limit.enabled
      - rate_limit.expensive.burst
      - rate_limit.expensive.per_minute
      - rate_limit.global.burst
      - rate_limit.global.per_minute
      - rate_limit.trust_forwarded_for
      - reconcile_interval_secs
      - render.challenge_wait_ms
      - render.chrome_path
      - render.default_wait_ms
      - render.headless
      - render.nav_timeout_ms
      - render.no_sandbox
      - render.session_ttl_secs
      - render.user_agent
      - scheduler.failure_backoff_max_secs
      - scheduler.fast_interval_secs
      - scheduler.full_interval_secs
      - scheduler.merge_sweep_interval_secs
      - scheduler.merge_sweep_max_auto_merges
      - scheduler.merge_sweep_pairs
      - scheduler.merge_sweep_recheck
      - scheduler.merge_sweep_requeue
      - scheduler.merge_sweep_rotation_interval_secs
      - scheduler.reconcile_interval_secs
      - scheduler.recsys_batch
      - scheduler.recsys_full_interval_secs
      - scheduler.recsys_incremental_interval_secs
      - scheduler.recsys_incremental_max
      - scheduler.run_stale_after_secs
      - security.cors.allow_credentials
      - security.cors.allowed_origins
      - security.cors.max_age_secs
      - security.expose_api_docs
      - security.hsts
      - security.hsts_max_age_secs
      - security.max_body_bytes
      - security.request_timeout_secs
      - security.security_headers
      - security.trust_request_id
      - solver.backend
      - solver.max_timeout_ms
      - solver.session_ttl_secs
      - telemetry.json_logs
      - telemetry.log_filter
      - worker.max_catalog_pages
      - worker.max_concurrent_providers
      - worker.provider_refresh_secs
    reason: >-
      Read by the image and not surfaced as a chart value: the application's own default stands, and
      an operator who needs to move one writes it into the raw `config` tree or
      `services.<name>.config`, which `just check-config` then validates against this same contract.
      Listed key by key rather than written off as a family, so that a key the next release adds
      turns this gate red until somebody decides which of the three it is.

documents:
  - name: frontend

    source:
      kind: ConfigMap
      selector: { app.kubernetes.io/component: frontend }
      key: config.toml
      format: toml

    images:
      - values: services.frontend.image
        contract: contracts/frontend.json

    consumers:
      - workload: { kind: Deployment, selector: { app.kubernetes.io/component: frontend } }
        containers: [frontend]

    exempt: []

  - name: api

    source:
      kind: ConfigMap
      selector: { app.kubernetes.io/component: api }
      key: config.toml
      format: toml

    images:
      - values: services.api.image
        contract: contracts/api.json

    consumers:
      - workload: { kind: Deployment, selector: { app.kubernetes.io/component: api } }
        containers: [api]

    exempt: []

  - name: control-plane

    source:
      kind: ConfigMap
      selector: { app.kubernetes.io/component: control-plane }
      key: config.toml
      format: toml

    images:
      - values: services.controlPlane.image
        contract: contracts/control-plane.json

    consumers:
      - workload: { kind: Deployment, selector: { app.kubernetes.io/component: control-plane } }
        containers: [control-plane]

    exempt: []

  - name: worker

    source:
      kind: ConfigMap
      selector: { app.kubernetes.io/component: worker }
      key: config.toml
      format: toml

    images:
      - values: services.worker.image
        contract: contracts/worker.json

    consumers:
      - workload: { kind: Deployment, selector: { app.kubernetes.io/component: worker } }
        containers: [worker]

    exempt: []

  - name: notifier

    source:
      kind: ConfigMap
      selector: { app.kubernetes.io/component: notifier }
      key: config.toml
      format: toml

    images:
      - values: services.notifier.image
        contract: contracts/notifier.json

    consumers:
      - workload: { kind: Deployment, selector: { app.kubernetes.io/component: notifier } }
        containers: [notifier]

    exempt: []

  - name: sync

    source:
      kind: ConfigMap
      selector: { app.kubernetes.io/component: sync }
      key: config.toml
      format: toml

    images:
      - values: services.sync.image
        contract: contracts/sync.json

    consumers:
      - workload: { kind: Deployment, selector: { app.kubernetes.io/component: sync } }
        containers: [sync]

    exempt: []

  - name: challenge-solver

    source:
      kind: ConfigMap
      selector: { app.kubernetes.io/component: challenge-solver }
      key: config.toml
      format: toml

    images:
      - values: services.challengeSolver.image
        contract: contracts/challenge-solver.json

    consumers:
      - workload: { kind: Deployment, selector: { app.kubernetes.io/component: challenge-solver } }
        containers: [challenge-solver]

    exempt: []

  - name: render

    source:
      kind: ConfigMap
      selector: { app.kubernetes.io/component: render }
      key: config.toml
      format: toml

    images:
      - values: services.render.image
        contract: contracts/render.json

    consumers:
      - workload: { kind: Deployment, selector: { app.kubernetes.io/component: render } }
        containers: [render]

    exempt: []

  # The migration Job rather than a Deployment. It reads the same configuration the long-running
  # services do — the database URL it migrates against is the one the API will use — so leaving it
  # out would exempt the one workload whose failure is hardest to see: a Job that exits non-zero
  # once, at install time, on a key nothing else validated.
  - name: bootstrap

    source:
      kind: ConfigMap
      selector: { app.kubernetes.io/component: bootstrap }
      key: config.toml
      format: toml

    images:
      - values: bootstrap.image
        contract: contracts/bootstrap.json

    # Three Jobs read this one document: the migration step and the two seed steps. They are one
    # consumer entry rather than three, because the only label distinguishing them is the
    # component they share, and the migration Job's name carries a content hash.
    consumers:
      - workload: { kind: Job, selector: { app.kubernetes.io/component: bootstrap } }
        containers: [migrate, seed-admin, seed-providers]

    exempt:
      - values: "*"
        gates: [closed]
        reason: >-
          The chart writes `telemetry.service_name` into this document — its own comment says the
          key is "required of every binary" — and the contract `tankovault-bootstrap` v8.1.0
          publishes declares no `telemetry` key at all. One of the two is wrong and this gate
          cannot tell which: either the chart is writing configuration the bootstrap binary never
          reads, which is harmless today but silently ignores anything an operator sets there, or
          the binary does read it and its `Describe` implementation is missing the key, in which
          case the contract is under-reporting its own surface. Only `closed` is relaxed, so every
          key the contract *does* describe is still type-checked here. Remove this exemption once
          the producer settles it.
