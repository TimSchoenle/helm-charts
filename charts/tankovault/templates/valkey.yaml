{{- if .Values.valkey.enabled }}
{{- $valkey := .Values.valkey }}
{{- /*
  Everything TankoVault keeps here is derived state — rate-limit counters, SSE tickets and the
  scheduler's leader lock. Losing it costs one leader re-election and a rate-limit window, which
  is why persistence would be a liability (stale locks surviving a restart) rather than a
  feature. See `tankovault.valkey` for the shape.
*/ -}}
{{ include "tankovault.valkey" (dict
      "ctx" .
      "component" "valkey"
      "image" $valkey.image
      "resources" $valkey.resources
      "placement" (dict
        "podAntiAffinity" $valkey.podAntiAffinity
        "affinity" $valkey.affinity
        "nodeSelector" $valkey.nodeSelector
        "tolerations" $valkey.tolerations
        "topologySpreadConstraints" $valkey.topologySpreadConstraints
        "priorityClassName" $valkey.priorityClassName)) }}
{{- end }}
