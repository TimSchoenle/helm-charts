# vim: set ft=yaml:
# yaml-language-server: $schema=values.schema.json

# @schema
# enum: [production, staging, development]
# @schema
# -- Deployment profile, passed as `TANKOVAULT_PROFILE`. This is a process-level key: it is
# read before the layered configuration exists, so it can only ever come from the environment.
# `production` is what turns on the fail-fast secret validation and turns off the API docs
# endpoint; anything other than exactly `production` leaves those safeties off.
profile: production

# @schema
# additionalProperties: true
# @schema
image:
  # @schema
  # type: string
  # @schema
  # -- Registry host shared by every TankoVault image. Empty means Docker Hub.
  registry: ""

  # @schema
  # enum: ["", Always, IfNotPresent, Never]
  # @schema
  # -- Image pull policy. Empty derives it from the tag: pinned digests and versions get
  # `IfNotPresent`, `latest` gets `Always`.
  pullPolicy: ""

# @schema
# type: object
# additionalProperties: true
# @schema
# -- Global TankoVault configuration, expressed exactly as the TOML tree documented in
# `docs/CONFIGURATION.md` (`database.max_connections`, `security.cors.allowed_origins`, ...).
# It is rendered to a ConfigMap and mounted as a file, never passed as environment variables,
# so **changing a value here reloads the running services in place instead of restarting
# them**. Two carve-outs from upstream: `telemetry.*` and `metrics.*` are installed
# process-globally and still need a restart to take effect.
config: {}

# @schema
# type: string
# @schema
# -- Verbatim TOML appended after the rendered `config` tree. The escape hatch for anything
# this chart's TOML renderer cannot express, notably arrays of tables.
configExtraToml: ""

# @schema
# additionalProperties: true
# @schema
configReload:
  # @schema
  # type: boolean
  # @schema
  # -- Add `checksum/config` pod annotations so a configuration change rolls the Deployments.
  # Off by default, and deliberately so: every TankoVault service watches the directories its
  # configuration came from and rebuilds its runtime when the kubelet updates the mounted
  # ConfigMap or Secret, which is strictly better than a rollout. Turn this on only if you
  # want config changes to behave like an ordinary image bump.
  rolloutOnChange: false

  # @schema
  # type: string
  # @schema
  # -- Directory the configuration fragments are mounted at, passed as `TANKOVAULT_CONFIG`.
  configDir: /etc/tankovault/config

  # @schema
  # type: string
  # @schema
  # -- Directory the credential files are mounted at, passed as `TANKOVAULT_SECRETS_DIR`.
  secretsDir: /etc/tankovault/secrets

# @schema
# additionalProperties: true
# @schema
auth:
  # @schema
  # type: string
  # @schema
  # -- Token signing secret (`auth.jwt_secret`). Left empty the chart generates one and remembers
  # it across upgrades, which is the recommended setting; set one explicitly (minimum 32
  # characters, e.g. `openssl rand -hex 32`) only if it has to be known outside the release. The
  # known upstream placeholder is refused at boot in every profile, and rotating the value signs
  # every user out.
  jwtSecret: ""

  # @schema
  # type: string
  # @schema
  # -- Server-side pepper mixed into every argon2id hash, so a database leak alone cannot be
  # brute-forced offline. Left empty the chart generates one **on a first install only** and
  # remembers it across upgrades; a release that already exists without a pepper keeps running
  # without one, because every password stored unpeppered would stop verifying the moment one
  # appeared. For the same reason it must never change once set: rotating or losing it
  # invalidates every stored password, so back the Secret up. The `seed-admin` step receives the
  # identical value, or the administrator it creates could never log in.
  passwordPepper: ""

# @schema
# additionalProperties: true
# @schema
internal:
  # @schema
  # type: string
  # @schema
  # -- Shared service-to-service token (`internal.token`), identical across api, control-plane,
  # worker, sync, render and challenge-solver. Without it those services accept privileged calls
  # from anything that can reach the port, so the `production` profile refuses to boot without
  # one. Left empty in that profile the chart generates a token and remembers it across upgrades,
  # which is the recommended setting; set one explicitly (minimum 32 characters, e.g.
  # `openssl rand -hex 32`) only if it has to be known outside the release.
  token: ""

# @schema
# additionalProperties: true
# @schema
anilist:
  # @schema
  # type: string
  # @schema
  # -- AniList OAuth application client ID. Register at <https://anilist.co/settings/developer>.
  clientId: ""

  # @schema
  # type: string
  # @schema
  # -- AniList OAuth application client secret.
  clientSecret: ""

  # @schema
  # type: string
  # @schema
  # -- Base64 of exactly 32 bytes, sealing every user's AniList token at rest. Left empty the
  # chart generates one when `services.sync` is enabled and remembers it across upgrades, which
  # is the recommended setting; set one explicitly (`openssl rand -base64 32`) only if it has to
  # be known outside the release. Losing it forces every account to re-link; leaking it exposes
  # every stored token. Rotating it does not re-seal tokens already stored.
  tokenEncryptionKey: ""

  # @schema
  # type: string
  # @schema
  # -- OAuth redirect URI. Left empty it is derived from the ingress as
  # `<external URL>/account/anilist-callback`. It must point at the **frontend**, not the API:
  # the API callback would need the SPA's in-memory bearer token, which a browser redirect
  # cannot carry.
  redirectUri: ""

# @schema
# additionalProperties: true
# @schema
# -- Transactional email relay, shared by `api` (password reset, verification) and `notifier`.
# The channel is enabled only when a relay and `from` are both present; a partial
# configuration falls back to a no-op mailer that logs and drops.
email:
  # @schema
  # type: string
  # @schema
  # -- SMTP host. Empty disables outbound email entirely.
  host: ""

  # @schema
  # type: integer
  # minimum: 1
  # maximum: 65535
  # @schema
  # -- SMTP port.
  port: 587

  # @schema
  # enum: [starttls, tls, none]
  # @schema
  # -- Transport security for the relay connection.
  security: starttls

  # @schema
  # type: string
  # @schema
  # -- SMTP username.
  username: ""

  # @schema
  # type: string
  # @schema
  # -- SMTP password.
  password: ""

  # @schema
  # type: string
  # @schema
  # -- `From` header, e.g. `TankoVault <no-reply@example.com>`. Required for any mail to be sent.
  from: ""

  # @schema
  # type: string
  # @schema
  # -- Public base URL used to build links in outgoing mail. Left empty it is derived from the
  # ingress. Leaving it pointed at localhost produces unusable links in real emails.
  baseUrl: ""

# @schema
# additionalProperties: true
# @schema
# -- Notification fan-out targets read by the `notifier` service.
channels:
  # @schema
  # type: array
  # items:
  #   type: string
  # @schema
  # -- Static recipient addresses for new-chapter notifications. Empty disables the channel.
  emailTo: []

  # @schema
  # type: string
  # @schema
  # -- Discord webhook URL. Empty disables the channel.
  discordWebhookUrl: ""

  # @schema
  # type: string
  # @schema
  # -- Generic outbound webhook URL. Empty disables the channel.
  webhookUrl: ""

# @schema
# type: string
# @schema
# -- Name of an existing Secret holding the credentials, instead of having the chart render one
# from the values above. When set it takes precedence and no credential value is written into
# the Helm release. Its keys are the configuration paths with `__` for nesting and no dots —
# `auth__jwt_secret`, `auth__password_pepper`, `internal__token`, `anilist__client_id`,
# `anilist__client_secret`, `anilist__token_encryption_key`, `email__username`,
# `email__password`, `channels__discord_webhook_url`, `channels__webhook_url`,
# `database__url`, `redis__url`. Only the keys a given service reads are projected into it.
existingSecret: ""

# @schema
# additionalProperties: true
# @schema
# -- Settings shared by every TankoVault workload. Anything here can be overridden per service
# under `services.<name>`, which is merged over this block.
defaults:
  # @schema
  # enum: [restricted, none]
  # @schema
  # -- Pod security context baseline.
  podSecurityContextPreset: restricted

  # @schema
  # $ref: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.0/_definitions.json#/definitions/io.k8s.api.core.v1.PodSecurityContext
  # @schema
  # -- Pod security context, merged over the preset. The identity fields match the numeric
  # nonroot user baked into every published TankoVault image (`USER 1001:1001`).
  podSecurityContext:
    # @schema
    # type: integer
    # @schema
    # -- User ID to run as.
    runAsUser: 1001

    # @schema
    # type: integer
    # @schema
    # -- Primary group ID to run as.
    runAsGroup: 1001

    # @schema
    # type: integer
    # @schema
    # -- Group ID applied to mounted volumes.
    fsGroup: 1001

  # @schema
  # enum: [restricted, none]
  # @schema
  # -- Container security context baseline. Safe for every service: eight of the nine images
  # are bare `scratch` layers holding only the binary, the musl loader and a CA bundle, so
  # there is no writable path to depend on.
  securityContextPreset: restricted

  # @schema
  # $ref: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.0/_definitions.json#/definitions/io.k8s.api.core.v1.SecurityContext
  # @schema
  # -- Container security context, merged over the preset.
  securityContext: {}

  # @schema
  # enum: ["", nano, micro, small, medium, large]
  # @schema
  # -- Default resource t-shirt size, overridden per service below.
  resourcesPreset: medium

  # @schema
  # $ref: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.0/_definitions.json#/definitions/io.k8s.api.core.v1.ResourceRequirements
  # @schema
  # -- Explicit resources. Wins over `resourcesPreset` when set.
  resources: {}

  # @schema
  # additionalProperties: true
  # @schema
  # -- Startup probe. Hits `/health`, which deliberately checks nothing external.
  startupProbe:
    # @schema
    # type: boolean
    # @schema
    # -- Enable the startup probe.
    enabled: true

    # @schema
    # additionalProperties: true
    # @schema
    # -- HTTP handler for the probe.
    httpGet:
      # @schema
      # type: string
      # @schema
      # -- Liveness path.
      path: /health

      # @schema
      # type: string
      # @schema
      # -- Named container port to probe.
      port: http

    # @schema
    # type: integer
    # @schema
    # -- Probe interval.
    periodSeconds: 5

    # @schema
    # type: integer
    # @schema
    # -- Probe timeout.
    timeoutSeconds: 3

    # @schema
    # type: integer
    # @schema
    # -- Consecutive failures before the container is considered failed.
    failureThreshold: 30

  # @schema
  # additionalProperties: true
  # @schema
  # -- Liveness probe. Uses `/health`, never `/ready`: `/ready` reports on Postgres and NATS,
  # so wiring liveness to it would turn a database blip into a fleet-wide restart storm.
  livenessProbe:
    # @schema
    # type: boolean
    # @schema
    # -- Enable the liveness probe.
    enabled: true

    # @schema
    # additionalProperties: true
    # @schema
    # -- HTTP handler for the probe.
    httpGet:
      # @schema
      # type: string
      # @schema
      # -- Liveness path.
      path: /health

      # @schema
      # type: string
      # @schema
      # -- Named container port to probe.
      port: http

    # @schema
    # type: integer
    # @schema
    # -- Probe interval.
    periodSeconds: 30

    # @schema
    # type: integer
    # @schema
    # -- Probe timeout.
    timeoutSeconds: 5

    # @schema
    # type: integer
    # @schema
    # -- Consecutive failures before the container is restarted.
    failureThreshold: 5

  # @schema
  # additionalProperties: true
  # @schema
  # -- Readiness probe. Uses `/ready`, which probes every registered dependency concurrently
  # and returns per-dependency detail.
  readinessProbe:
    # @schema
    # type: boolean
    # @schema
    # -- Enable the readiness probe.
    enabled: true

    # @schema
    # additionalProperties: true
    # @schema
    # -- HTTP handler for the probe.
    httpGet:
      # @schema
      # type: string
      # @schema
      # -- Readiness path.
      path: /ready

      # @schema
      # type: string
      # @schema
      # -- Named container port to probe.
      port: http

    # @schema
    # type: integer
    # @schema
    # -- Probe interval.
    periodSeconds: 10

    # @schema
    # type: integer
    # @schema
    # -- Probe timeout. Upstream bounds each dependency check at 2s, so 3s leaves headroom
    # without letting a wedged probe hang.
    timeoutSeconds: 3

    # @schema
    # type: integer
    # @schema
    # -- Consecutive failures before the pod leaves the Service.
    failureThreshold: 3

  # @schema
  # enum: ["", soft, hard]
  # @schema
  # -- Pod anti-affinity across nodes. `soft` prefers spreading replicas, `hard` requires it.
  podAntiAffinity: soft

  # @schema
  # $ref: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.0/_definitions.json#/definitions/io.k8s.api.core.v1.Affinity
  # @schema
  # -- Explicit affinity rules. Wins over `podAntiAffinity` when set.
  affinity: {}

  # @schema
  # type: object
  # additionalProperties:
  #   type: string
  # @schema
  # -- Node selector for pod assignment.
  nodeSelector: {}

  # @schema
  # type: array
  # items:
  #   $ref: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.0/_definitions.json#/definitions/io.k8s.api.core.v1.Toleration
  # @schema
  # -- Tolerations for pod assignment.
  tolerations: []

  # @schema
  # type: array
  # items:
  #   $ref: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.0/_definitions.json#/definitions/io.k8s.api.core.v1.TopologySpreadConstraint
  # @schema
  # -- Topology spread constraints.
  topologySpreadConstraints: []

  # @schema
  # type: string
  # @schema
  # -- Priority class for the pods.
  priorityClassName: ""

  # @schema
  # type: integer
  # @schema
  # -- Grace period for shutdown. Every service cancels its work loop on SIGTERM and stops
  # between units of work.
  terminationGracePeriodSeconds: 30

  # @schema
  # type: integer
  # @schema
  # -- Number of old ReplicaSets to retain.
  revisionHistoryLimit: 3

  # @schema
  # additionalProperties: true
  # @schema
  # -- Deployment update strategy.
  strategy: {}

  # @schema
  # type: boolean
  # @schema
  # -- Whether to automount the service account token. Nothing in TankoVault talks to the
  # Kubernetes API.
  automountServiceAccountToken: false

  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Extra pod annotations.
  podAnnotations: {}

  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Extra pod labels.
  podLabels: {}

  # @schema
  # type: array
  # items:
  #   $ref: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.0/_definitions.json#/definitions/io.k8s.api.core.v1.EnvVar
  # @schema
  # -- Extra environment variables. Use sparingly: this chart delivers configuration as files
  # precisely so it can be reloaded, and a `TANKOVAULT_*` key supplied both here and as a
  # mounted secret file **fails the boot** rather than resolving by precedence.
  extraEnv: []

  # @schema
  # type: array
  # items:
  #   $ref: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.0/_definitions.json#/definitions/io.k8s.api.core.v1.Volume
  # @schema
  # -- Extra pod volumes.
  extraVolumes: []

  # @schema
  # type: array
  # items:
  #   $ref: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.0/_definitions.json#/definitions/io.k8s.api.core.v1.VolumeMount
  # @schema
  # -- Extra container volume mounts.
  extraVolumeMounts: []

# @schema
# additionalProperties: true
# @schema
# -- Per-service settings. Each block is merged over `defaults`, so any key from `defaults`
# may be repeated here for one service only.
services:
  # @schema
  # additionalProperties: true
  # @schema
  # -- The Dioxus WASM SPA and its axum server. It serves the client and reverse-proxies
  # `/v1/*` to the API, so this single origin is all a browser needs — which is why it is the
  # only service the ingress exposes.
  frontend:
    # @schema
    # type: boolean
    # @schema
    # -- Deploy the frontend.
    enabled: true

    # @schema
    # type: integer
    # minimum: 0
    # @schema
    # -- Replica count, ignored when autoscaling is enabled.
    replicaCount: 2

    # @schema
    # additionalProperties: true
    # @schema
    image:
      # @schema
      # type: string
      # @schema
      # -- Image repository.
      repository: timschoenle/tankovault-frontend

      # @schema
      # type: string
      # @schema
      # -- Image tag, pinned by digest.
      tag: v1.5.0@sha256:265f2185768477cdc5cd0aa2a8c1549f84e33a8af5141c94880fb0bb321e781f

    # @schema
    # enum: ["", nano, micro, small, medium, large]
    # @schema
    # -- Resource t-shirt size.
    resourcesPreset: small

    # @schema
    # type: object
    # additionalProperties: true
    # @schema
    # -- Service-specific configuration, merged over the global `config` tree for this service
    # only. Rendered into this service's own TOML fragment.
    config: {}

    # @schema
    # additionalProperties: true
    # @schema
    service:
      # @schema
      # enum: [ClusterIP, NodePort, LoadBalancer]
      # @schema
      # -- Service type. The frontend is the one service it is safe to publish directly.
      type: ClusterIP

      # @schema
      # type: object
      # additionalProperties: true
      # @schema
      # -- Extra Service annotations.
      annotations: {}

    # @schema
    # additionalProperties: true
    # @schema
    autoscaling:
      # @schema
      # type: boolean
      # @schema
      # -- Enable a HorizontalPodAutoscaler.
      enabled: false

      # @schema
      # type: integer
      # minimum: 1
      # @schema
      # -- Minimum replicas.
      minReplicas: 2

      # @schema
      # type: integer
      # minimum: 1
      # @schema
      # -- Maximum replicas.
      maxReplicas: 6

      # @schema
      # type: [integer, "null"]
      # @schema
      # -- Target average CPU utilisation, percent. Null disables the CPU metric.
      targetCPUUtilizationPercentage: 80

      # @schema
      # type: [integer, "null"]
      # @schema
      # -- Target average memory utilisation, percent. Null disables the memory metric.
      targetMemoryUtilizationPercentage: null

    # @schema
    # additionalProperties: true
    # @schema
    podDisruptionBudget:
      # @schema
      # type: boolean
      # @schema
      # -- Create a PodDisruptionBudget.
      enabled: false

      # @schema
      # type: [integer, string, "null"]
      # @schema
      # -- Minimum available pods during voluntary disruption.
      minAvailable: 1

      # @schema
      # type: [integer, string, "null"]
      # @schema
      # -- Maximum unavailable pods. Mutually exclusive with `minAvailable`.
      maxUnavailable: null

  # @schema
  # additionalProperties: true
  # @schema
  # -- The axum REST edge: authentication, read models, write endpoints, administration and
  # the server-sent scan feed.
  api:
    # @schema
    # type: boolean
    # @schema
    # -- Deploy the API.
    enabled: true

    # @schema
    # type: integer
    # minimum: 0
    # @schema
    # -- Replica count, ignored when autoscaling is enabled.
    replicaCount: 2

    # @schema
    # additionalProperties: true
    # @schema
    image:
      # @schema
      # type: string
      # @schema
      # -- Image repository.
      repository: timschoenle/tankovault-api

      # @schema
      # type: string
      # @schema
      # -- Image tag, pinned by digest.
      tag: v1.5.0@sha256:a2e7c6eb76d9f79a0e41550e1d2c4140150d7068bf73eb17eeca81b87a14f0f9

    # @schema
    # enum: ["", nano, micro, small, medium, large]
    # @schema
    # -- Resource t-shirt size.
    resourcesPreset: large

    # @schema
    # type: object
    # additionalProperties: true
    # @schema
    # -- Service-specific configuration, merged over the global `config` tree.
    config: {}

    # @schema
    # additionalProperties: true
    # @schema
    service:
      # @schema
      # enum: [ClusterIP, NodePort, LoadBalancer]
      # @schema
      # -- Service type.
      type: ClusterIP

      # @schema
      # type: object
      # additionalProperties: true
      # @schema
      # -- Extra Service annotations.
      annotations: {}

    # @schema
    # additionalProperties: true
    # @schema
    autoscaling:
      # @schema
      # type: boolean
      # @schema
      # -- Enable a HorizontalPodAutoscaler.
      enabled: false

      # @schema
      # type: integer
      # minimum: 1
      # @schema
      # -- Minimum replicas.
      minReplicas: 2

      # @schema
      # type: integer
      # minimum: 1
      # @schema
      # -- Maximum replicas.
      maxReplicas: 10

      # @schema
      # type: [integer, "null"]
      # @schema
      # -- Target average CPU utilisation, percent.
      targetCPUUtilizationPercentage: 80

      # @schema
      # type: [integer, "null"]
      # @schema
      # -- Target average memory utilisation, percent.
      targetMemoryUtilizationPercentage: null

    # @schema
    # additionalProperties: true
    # @schema
    podDisruptionBudget:
      # @schema
      # type: boolean
      # @schema
      # -- Create a PodDisruptionBudget.
      enabled: false

      # @schema
      # type: [integer, string, "null"]
      # @schema
      # -- Minimum available pods during voluntary disruption.
      minAvailable: 1

      # @schema
      # type: [integer, string, "null"]
      # @schema
      # -- Maximum unavailable pods.
      maxUnavailable: null

  # @schema
  # additionalProperties: true
  # @schema
  # -- The singleton scheduler: run planning, task distribution and provider health. Safe to
  # run with more than one replica — it elects a leader through Redis, and falls open to
  # sole-leader when Redis is absent.
  controlPlane:
    # @schema
    # type: boolean
    # @schema
    # -- Deploy the control plane.
    enabled: true

    # @schema
    # type: integer
    # minimum: 0
    # @schema
    # -- Replica count.
    replicaCount: 1

    # @schema
    # additionalProperties: true
    # @schema
    image:
      # @schema
      # type: string
      # @schema
      # -- Image repository.
      repository: timschoenle/tankovault-control-plane

      # @schema
      # type: string
      # @schema
      # -- Image tag, pinned by digest.
      tag: v1.5.0@sha256:45f36c8bc7aa7aee8d8eef53687aad9717f604ed12f81771731fdac8a1bf6961

    # @schema
    # enum: ["", nano, micro, small, medium, large]
    # @schema
    # -- Resource t-shirt size.
    resourcesPreset: medium

    # @schema
    # type: object
    # additionalProperties: true
    # @schema
    # -- Service-specific configuration, merged over the global `config` tree.
    config: {}

    # @schema
    # additionalProperties: true
    # @schema
    service:
      # @schema
      # enum: [ClusterIP, NodePort, LoadBalancer]
      # @schema
      # -- Service type. Publishing this service exposes a privileged contract; the chart
      # refuses anything but `ClusterIP` unless `allowUnsafeExposure` is set.
      type: ClusterIP

      # @schema
      # type: object
      # additionalProperties: true
      # @schema
      # -- Extra Service annotations.
      annotations: {}

    # @schema
    # additionalProperties: true
    # @schema
    podDisruptionBudget:
      # @schema
      # type: boolean
      # @schema
      # -- Create a PodDisruptionBudget.
      enabled: false

      # @schema
      # type: [integer, string, "null"]
      # @schema
      # -- Minimum available pods during voluntary disruption.
      minAvailable: 1

      # @schema
      # type: [integer, string, "null"]
      # @schema
      # -- Maximum unavailable pods.
      maxUnavailable: null

  # @schema
  # additionalProperties: true
  # @schema
  # -- Fetches and parses provider data through the adapters and upserts chapter and metadata
  # changes. Scales horizontally for free: replicas join one NATS JetStream consumer group.
  worker:
    # @schema
    # type: boolean
    # @schema
    # -- Deploy the worker.
    enabled: true

    # @schema
    # type: integer
    # minimum: 0
    # @schema
    # -- Replica count, ignored when autoscaling is enabled.
    replicaCount: 2

    # @schema
    # additionalProperties: true
    # @schema
    image:
      # @schema
