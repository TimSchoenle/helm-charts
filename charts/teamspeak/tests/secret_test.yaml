suite: test secret
templates:
  - secret.yaml
set:
  license.accept: true
tests:
  # A server that lets the image generate its admin password and stores its data in SQLite
  # has no secret material at all; an empty Secret would be pure noise.
  - it: renders nothing when there is no secret material
    asserts:
      - hasDocuments:
          count: 0

  - it: stores the ServerQuery admin password
    set:
      serverQuery.adminPassword: hunter2
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-teamspeak
      - equal:
          path: stringData.serveradmin-password
          value: hunter2
      - notExists:
          path: stringData.database-password

  - it: stores the database password for external backends
    set:
      database.plugin: ts3db_mariadb
      database.host: mariadb
      database.password: s3cret
    asserts:
      - equal:
          path: stringData.database-password
          value: s3cret

  # SQLite needs no credentials, so a stray database.password must not become a Secret key
  # that nothing consumes.
  - it: ignores a database password while SQLite is in use
    set:
      database.password: s3cret
    asserts:
      - hasDocuments:
          count: 0

  - it: creates nothing when an existing Secret is supplied
    set:
      existingSecret: ts3-credentials
      serverQuery.adminPassword: hunter2
    asserts:
      - hasDocuments:
          count: 0
