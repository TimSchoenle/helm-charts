# Gateway API exposure.
#
# Named without the `-values` suffix on purpose: `ct` globs `ci/*-values.yaml` for `ct install`,
# while the render and kubeconform scripts glob `ci/*.yaml`. The kind cluster CI installs into
# has no Gateway API CRDs, so an install would fail; this keeps render, schema-validation and
# policy-scan coverage without asking chart-testing to install something that cannot work.

s3:
  accessKey: "fe47359d4fe04df0a8689fba2358c8d2.access"
  secretKey: "7ae0f15050f34f29b394495331ca28a2"
  host: "s3.amazon.com"
  region: "eu-central-1"

bucket:
  entries:
    "4tv#Sjfpj&":
      bucket: bucket
      object: file.txt

ingress:
  enabled: false

gateway:
  enabled: true
  create: true
  gatewayClassName: cilium
  hostnames:
    - links.example.com
  tls:
    enabled: true
    certificateRefs:
      - name: s3-bucket-perma-link-tls
  httpsRedirect:
    enabled: true
  timeouts:
    request: 30s
  filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        set:
          - name: X-Content-Type-Options
            value: nosniff
  infrastructure:
    annotations:
      io.cilium/lb-ipam-ips: 203.0.113.10

networkPolicy:
  enabled: true
  ingress:
    enabled: true
  egress:
    enabled: true
