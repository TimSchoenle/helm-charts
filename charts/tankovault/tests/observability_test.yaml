# The mechanics of the dashboards and the rules belong to the library and are covered against
# `.github/testdata/common-fixture`. What is tested here is the wiring this chart owns: which
# values gate which objects, that this chart's own rule files survive the round trip intact, and
# that the validator folds the library's complaints into the single aggregated report rather than
# failing somewhere else with its own format.
suite: test observability objects
templates:
  - dashboard-configmap.yaml
  - grafanadashboard.yaml
  - nats-exporter.yaml
  - prometheusrule.yaml
  - serviceaccount.yaml
values:
  - ../ci/default.yaml
tests:
  - it: ships no dashboard unless asked
    asserts:
      - hasDocuments:
          count: 0
        template: dashboard-configmap.yaml
      - hasDocuments:
          count: 0
        template: grafanadashboard.yaml

  - it: labels the ConfigMap for the sidecar to find
    set:
      metrics.dashboard.enabled: true
    template: dashboard-configmap.yaml
    asserts:
      - equal:
          path: metadata.labels["grafana_dashboard"]
          value: "1"
      - exists:
          path: data["tankovault-overview.json"]

  - it: keeps the sidecar ConfigMap alone when the operator path is off
    set:
      metrics.dashboard.enabled: true
    template: grafanadashboard.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: adds a GrafanaDashboard per dashboard, referencing the ConfigMap
    # Cross-namespace import is the point of this path: a Grafana in another namespace can pick
    # these up without `sidecar.dashboards.searchNamespace` being widened cluster-wide.
    capabilities:
      apiVersions:
        - grafana.integreatly.org/v1beta1
    set:
      metrics.dashboard.enabled: true
      metrics.dashboard.grafanaOperator.enabled: true
    template: grafanadashboard.yaml
    asserts:
      # One per dashboard file, not one per chart: a `configMapRef` addresses a single key, and
      # the operator tracks folder and import status per dashboard.
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-tankovault-overview
        documentIndex: 0
      - equal:
          path: spec.configMapRef.key
          value: tankovault-overview.json
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-tankovault-scan-pipeline
        documentIndex: 1
      - equal:
          path: spec.configMapRef.key
          value: tankovault-scan-pipeline.json
        documentIndex: 1
      - equal:
          path: spec.allowCrossNamespaceImport
          value: true
        documentIndex: 0
      - equal:
          path: spec.configMapRef.name
          value: RELEASE-NAME-tankovault-dashboards
        documentIndex: 0

  - it: reports the library's dashboard complaints through the chart's own validator
    capabilities:
      apiVersions:
        - grafana.integreatly.org/v1beta1
    set:
      metrics.dashboard.enabled: false
      metrics.dashboard.grafanaOperator.enabled: true
    template: serviceaccount.yaml
    asserts:
      - failedTemplate:
          errorPattern: "TankoVault chart configuration is invalid[\\s\\S]*under `metrics.dashboard`, the Grafana Operator dashboards need the dashboard ConfigMap"

  - it: refuses the operator path when the CRD is absent rather than dropping the objects
    set:
      metrics.dashboard.enabled: true
      metrics.dashboard.grafanaOperator.enabled: true
    template: serviceaccount.yaml
    asserts:
      - failedTemplate:
          errorPattern: "registers no `grafana.integreatly.org/v1beta1` API"

  - it: refuses a dashboard that nothing would ever populate
    set:
      metrics.enabled: false
      metrics.dashboard.enabled: true
    template: serviceaccount.yaml
    asserts:
      - failedTemplate:
          errorPattern: "metrics.dashboard.enabled has no effect while metrics.enabled=false"

  # The rules have only ever had one carrier — `PrometheusRule` is the operator's own CRD — so
  # what is checked here is the same refusal contract the dashboards got, not a second path.

  - it: ships the chart's rules as a PrometheusRule
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1
    set:
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.labels:
        release: kube-prometheus-stack
    template: prometheusrule.yaml
    asserts:
      - equal:
          path: metadata.labels["release"]
          value: kube-prometheus-stack
      - lengthEqual:
          path: spec.groups
          count: 21

  - it: keeps Prometheus' alert templating out of the template engine
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1
    set:
      metrics.prometheusRule.enabled: true
    template: prometheusrule.yaml
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[0].annotations.description
          pattern: '\{\{ \$labels\.job \}\}'

  - it: refuses the rules when the Prometheus Operator CRDs are absent
    set:
      metrics.prometheusRule.enabled: true
    template: serviceaccount.yaml
    asserts:
      - failedTemplate:
          errorPattern: "metrics.prometheusRule.enabled is enabled, but the cluster registers no `monitoring.coreos.com/v1` API"

  - it: refuses the ServiceMonitors when the Prometheus Operator CRDs are absent
    set:
      metrics.serviceMonitor.enabled: true
    template: serviceaccount.yaml
    asserts:
      - failedTemplate:
          errorPattern: "metrics.serviceMonitor.enabled is enabled, but the cluster registers no `monitoring.coreos.com/v1` API"

  - it: refuses rules that would evaluate against no data
    set:
      metrics.enabled: false
      metrics.prometheusRule.enabled: true
    template: serviceaccount.yaml
    asserts:
      - failedTemplate:
          errorPattern: "metrics.prometheusRule.enabled has no effect while metrics.enabled=false"

  # Scoping. A `PrometheusRule` matches series from every namespace Prometheus scrapes, so an
  # unscoped `up{job="api"}` alerts on somebody else's `api`. The mechanics belong to the library
  # and are covered against the common fixture; what is pinned here is that this chart supplies
  # both halves — its own placeholder and its own release namespace.
  - it: scopes every rule expression to the release namespace by default
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1
    release:
      namespace: tankovault-prod
    set:
      metrics.prometheusRule.enabled: true
    template: prometheusrule.yaml
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[0].expr
          pattern: 'namespace="tankovault-prod"'
      - notMatchRegex:
          path: spec.groups[0].rules[0].expr
          pattern: 'tankovault_scope'

  - it: leaves the rules unscoped when asked, placeholder and all
    # `none` is for a Prometheus that sets `enforcedNamespaceLabel` and does the same rewrite
    # itself. The placeholder is already an always-true matcher, so "unscoped" means shipping the
    # files unchanged rather than stripping the token back out.
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1
    release:
      namespace: tankovault-prod
    set:
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.scope: none
    template: prometheusrule.yaml
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[0].expr
          pattern: 'tankovault_scope=~"\.\*"'
      - notMatchRegex:
          path: spec.groups[0].rules[0].expr
          pattern: 'namespace="tankovault-prod"'

  - it: does not rewrite the runbooks, only the expressions
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1
    release:
      namespace: tankovault-prod
    set:
      metrics.prometheusRule.enabled: true
    template: prometheusrule.yaml
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[0].annotations.description
          pattern: '\{\{ \$labels\.namespace \}\}'

  # The NATS exporter. NATS publishes no Prometheus exposition of its own, so without this the
  # queue-depth rules and the pipeline dashboard's backlog row have no producer at all.
  - it: ships no NATS exporter unless asked
    template: nats-exporter.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: points the exporter at the bundled NATS monitoring listener, not the client port
    set:
      nats.enabled: true
      metrics.natsExporter.enabled: true
    template: nats-exporter.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - -varz
            - -jsz=all
            - -port
            - "7777"
            - http://RELEASE-NAME-tankovault-nats:8222

  - it: splits the JetStream consumer name into provider and scan
    # Without this the per-lane backlog arrives as one opaque `consumer_name` and cannot be read
    # against the throughput series, which carry `provider` and `scan` as real labels.
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1
    set:
      nats.enabled: true
      metrics.natsExporter.enabled: true
      metrics.serviceMonitor.enabled: true
    template: nats-exporter.yaml
    documentSelector:
      path: kind
      value: ServiceMonitor
    asserts:
      - equal:
          path: spec.jobLabel
          value: app.kubernetes.io/component
      - equal:
          path: spec.endpoints[0].metricRelabelings
          value:
            - sourceLabels: [consumer_name]
              regex: tankovault-workers-(fast|full)-(.+)
              targetLabel: scan
              replacement: $1
            - sourceLabels: [consumer_name]
              regex: tankovault-workers-(fast|full)-(.+)
              targetLabel: provider
              replacement: $2

  - it: refuses an exporter with nothing to scrape
    # `externalNats.url` is the client port and a different protocol, so it cannot stand in.
    set:
      metrics.natsExporter.enabled: true
      externalNats.url: nats://nats.example.com:4222
      postgresql.enabled: true
    template: serviceaccount.yaml
    asserts:
      - failedTemplate:
          errorPattern: "needs a NATS monitoring endpoint"

  - it: ships both dashboards under one ConfigMap
    set:
      metrics.dashboard.enabled: true
    template: dashboard-configmap.yaml
    asserts:
      - exists:
          path: data["tankovault-overview.json"]
      - exists:
          path: data["tankovault-scan-pipeline.json"]
