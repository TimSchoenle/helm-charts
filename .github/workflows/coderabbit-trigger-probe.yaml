# Temporary probe: does CodeRabbit start a review when `@coderabbitai review` is posted by a
# GitHub App installation (actions-maintenance-bot)? Removed before this branch is used.
name: CodeRabbit Trigger Probe

on:
  pull_request:
    types: [opened, synchronize]

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-pull-requests: write
      - name: Post review command as the app
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr comment "$PR_URL" --body '@coderabbitai review'
