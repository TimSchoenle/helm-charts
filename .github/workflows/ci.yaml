name: CI

# Every gate below is a `just` recipe, and this workflow only decides which ones run, on what
# matrix, with what permissions. What a recipe does and why lives next to the recipe in
# `justfile` / `just/*.just`, so a contributor can reproduce any job here with a single command
# and neither copy can drift from the other. `just check` runs the whole cluster-free set.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Every chart's `values.schema.json` and `README.md` are generated from `values.yaml` and
  # `README.md.gotmpl`, and the root `README.md` from `.github/templates/README.md.hbs`.
  # This job regenerates them and commits the result back to the PR branch, so contributors
  # never have to run the toolchain locally. It also repins the Kubernetes schema references in
  # `values.yaml` itself, which is derived from `kube_version` in the same way even though it is
  # hand-written. The other jobs deliberately do not gate on it:
  # the follow-up push re-runs the whole workflow against the corrected tree anyway, and
  # skipping them here would drop lint, unit tests and install on exactly the runs that
  # change a chart's values.
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit documentation changes
      pull-requests: write # to comment on PRs
      issues: write # to comment on PRs
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.generate_token.outputs.token }}
          persist-credentials: true

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      # Every chart types its Kubernetes values by URL, pinned to the release `kube_version` names.
      # Nothing derives those URLs from it, so this repins them before the dependencies are built —
      # `charts/common` has to carry the new version before it is packaged into its consumers, or
      # the schema generation below would put the old one back.
      - name: Repin Kubernetes schema references
        run: just sync-kube-refs

      - name: Build Helm dependencies
        run: just deps

      - name: Generate schemas
        run: just schema

      # Refreshing the vendored configuration contracts belongs here, between the schemas and
      # helm-docs, so the existing commit step below sweeps the result up with everything else it
      # already commits — and its message, "docs: update Helm chart documentation and schemas",
      # already covers it.
      #
      # The vendored configuration contracts, refreshed from the images the charts pin. Placed
      # between the schemas and helm-docs so the existing commit step below sweeps the result up
      # with everything else it already commits, under a message that already covers it.
      #
      # This is the one networked step in the repository, and the only one depending on a service
      # outside GitHub: `just contracts` verifies each image's signature, which queries the
      # Sigstore transparency log, so a Sigstore outage fails this job. That is a deliberate trade
      # rather than an oversight — there is no "fetch it unverified" path, because a contract that
      # cannot be proven to belong to the pinned digest is worse than none: every gate downstream
      # would trust it. No other job touches a registry, and none depends on this one.
      #
      # Versions come from `justfile` rather than being repeated here, so a bump stays the single
      # edit the other pinned tools already are.
      - name: Install oras and cosign
        run: |
          set -euo pipefail
          oras_version="$(just --evaluate oras_version)"
          cosign_version="$(just --evaluate cosign_version)"
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v${oras_version}/oras_${oras_version}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oras
          curl -fsSL -o /tmp/cosign "https://github.com/sigstore/cosign/releases/download/${cosign_version}/cosign-linux-amd64"
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
          oras version
          cosign version

      - name: Refresh image configuration contracts
        run: just contracts

      - name: Run helm-docs
        uses: losisin/helm-docs-github-action@3a4528e97c49a5e83de6b78c50c61c8ee5c9f944 # v2
        with:
          chart-search-root: charts
          template-files: README.md.gotmpl

      - name: Commit documentation changes
        id: auto-commit
        uses: TimSchoenle/actions/actions/common/commit-changes@76719ba61e9b9cf1ffafdc3cb895308055a7f3bd # tag=actions-common-commit-changes-v1.3.2
        with:
          commit_message: "docs: update Helm chart documentation and schemas"
          token: ${{ steps.generate_token.outputs.token }}

      # The chart table in the root README is rendered from every chart's Chart.yaml, so a new
      # chart or a version bump cannot leave the index stale. Deliberately placed after the
      # commit above, whose `.` file pattern would otherwise sweep the rendered README into the
      # helm-docs commit; the render commits only its own output path.
      #
      # PyYAML ships with the runner image's system `python3`, which is what the recipe resolves
      # to. `actions/setup-python` is not used here on purpose: the interpreter it installs would
      # not have it.
      - name: Collect chart metadata
        id: chart-index
        run: |
          set -euo pipefail
          index="$(just chart-index)"
          echo "variables=${index}" >> "$GITHUB_OUTPUT"

      - name: Render and commit the root README
        id: readme
        uses: TimSchoenle/actions/actions/common/render-template-and-commit@15d83f02081c9dc8a844646199c63792dcccdfa8 # tag=actions-common-render-template-and-commit-v1.1.3
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.chart-index.outputs.variables }}
          token: ${{ steps.generate_token.outputs.token }}
          commit_message: "docs: update chart index in README"

      - name: Comment on PR
        if: steps.auto-commit.outputs.changes_detected == 'true' || steps.readme.outputs.changes_detected == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DOCS_CHANGED: ${{ steps.auto-commit.outputs.changes_detected }}
          README_CHANGED: ${{ steps.readme.outputs.changes_detected }}
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          script: |
            const updated = [];
            if (process.env.DOCS_CHANGED === 'true') {
              updated.push('chart documentation and schemas');
            }
            if (process.env.README_CHANGED === 'true') {
              updated.push('the README chart index');
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📚 Automatically updated ${updated.join(' and ')}.`
            })

  unit-test:
    name: Unit Tests (Helm ${{ matrix.helm }})
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout code
    strategy:
      fail-fast: false
      matrix:
        # The release pipeline runs Helm 3; 4.x is tracked here so a toolchain bump becomes a
        # deliberate, visible change rather than a surprise from `version: latest`.
        helm: ['v3.21.3', 'v4.2.3']
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          helm-version: ${{ matrix.helm }}

      - name: Build Helm dependencies
        run: just deps

      - name: Run chart unit tests
        run: just test-unit

      - name: Run common library tests
        run: just test-library

  rule-test:
    name: Rule & Dashboard Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build Helm dependencies
        run: just deps

      # `helm unittest` proves a chart emits a PrometheusRule; it cannot prove the PromQL inside
      # it is correct. See the recipe for what this evaluates and why.
      #
      # promtool comes from the official Prometheus image, so there is no binary to pin a checksum
      # for. PyYAML ships with the runner image's system `python3`; `actions/setup-python` is
      # deliberately not used here, for the same reason as in the docs job.
      - name: Run rule and dashboard tests
        run: just test-rules

  # Every other job in this workflow renders charts and inspects the result. This one runs a
  # chart's own shell against the real application, which is the only way to test the parts of a
  # chart that are a program rather than a manifest — and so it is per-chart by nature. The matrix
  # is the list of charts that have such a program: `.github/scripts/e2e/<chart>.sh`. Charts
  # without one are covered by the render, lint, unit-test and install jobs above and need nothing
  # here.
  #
  # paperless-ngx qualifies because its backup CronJob and its import initContainer are scripts
  # wrapped around upstream management commands, and both defects this gate was written for lived
  # in upstream's behaviour rather than in the chart's YAML: `document_importer` finishes by
  # rebuilding a search index whose directory only the image's s6 init step creates, and its file
  # copy raises `FileExistsError` rather than overwriting, so an attempt killed part-way made every
  # later one fail on a file it had already written. A rendered manifest looks identical either way.
  #
  # Not gated on `list-changed`: the drivers and fixtures live outside `charts/`, where `ct` would
  # not see them change.
  e2e:
    name: End-to-End (${{ matrix.chart }})
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout code
    strategy:
      fail-fast: false
      matrix:
        chart: [paperless-ngx]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build Helm dependencies
        run: just deps

      # PyYAML ships with the runner image's system `python3`; `actions/setup-python` is
      # deliberately not used here, for the same reason as in the docs job.
      - name: Run the ${{ matrix.chart }} end-to-end test
        env:
          CHART: ${{ matrix.chart }}
        run: just test-e2e "${CHART}"

  lint:
    name: Lint Charts
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout code
    # Whether any chart changed is derived from the diff against the target branch. The install
    # job needs the same answer and gates on this one anyway, so it is published here rather
    # than re-derived by a second `ct list-changed` run there.
    outputs:
      changed: ${{ steps.list-changed.outputs.changed }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build Helm dependencies
        run: just deps

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          if [[ -n "$(just lint-changed)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # `just lint` covers both halves: `helm lint` for the library chart, which `ct` cannot lint
      # at all, and `ct lint` for every chart that changed. It is a no-op when nothing changed.
      - name: Lint charts
        run: just lint

  validate-manifests:
    name: Validate Manifests (k8s ${{ matrix.kubernetes }})
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout code
    strategy:
      fail-fast: false
      matrix:
        # Spans the `common.capabilities.*` branch points, so API-version selection is
        # exercised rather than assumed.
        kubernetes: ['1.28.0', '1.31.0', '1.34.0']
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build Helm dependencies
        run: just deps

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.7.0
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Render and validate every chart against every ci/ values file
        env:
          KUBE_VERSION: ${{ matrix.kubernetes }}
        run: just validate-manifests "${KUBE_VERSION}"

  # Immutable fields are the one class of defect that renders, lints and installs cleanly and
  # only fails on an upgrade of an already-running release — on a cluster, during a sync, long
  # after review. The `install` job runs `ct install --upgrade`, which patches a live release
  # and so catches this on a real API server; this job is the cheap and complete half of that
  # pair. See the recipe for what it diffs and why.
  immutable-fields:
    name: Immutable Fields
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build Helm dependencies
        run: just deps

      # PyYAML ships with the runner image's system `python3`, matching the `chart-index` step
      # above. `actions/setup-python` is deliberately not used: the interpreter it installs would
      # not have it.
      #
      # The recipe's default pins which StatefulSet schema the mutable-field list is cross-checked
      # against; it is the highest version in the validate-manifests matrix.
      - name: Check immutable fields
        run: just check-immutable

  policy-scan:
    name: Policy Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build Helm dependencies
        run: just deps

      # `just lint-policy` is the same pair of steps for a local shell; here they are split so the
      # pinned action supplies kube-linter rather than the runner needing it on PATH.
      - name: Render all charts
        run: just render rendered

      # Enforces the restricted Pod Security Standard the charts now claim, so a later change
      # cannot quietly regress the baseline.
      - name: Run kube-linter
        uses: stackrox/kube-linter-action@87802a2f4e01abebb3ee3c67a3002fea71f6eae5 # v1.0.7
        with:
          directory: rendered
          config: .github/configs/kube-linter.yaml

  # The rendered configuration is the one artifact in this repository that no other job can see
  # into: `values.schema.json` describes the chart's values, kubeconform describes Kubernetes
  # objects, and a ConfigMap holding a stale `config.toml` is a valid ConfigMap by both. `serde`
  # ignores an unknown key by design, so the pod starts, reports healthy, and runs on a compiled
  # default nobody chose. This job validates that document against the contract published by the
  # image the chart pins — and the environment variables and secret file names beside it, which
  # are the same contract's other half.
  #
  # Offline: the contracts are committed files, and the schema engine is refused any reference it
  # would have to fetch. Mirrors `policy-scan` otherwise — same permissions, same render, one
  # pinned binary — so it needs no new reviewer intuition.
  #
  # Blocking. The Documentation job refreshes the vendored contracts, so a red run here is the
  # chart disagreeing with the image it pins rather than a contract nobody had updated.
  #
  # Deliberately no `needs:`. The Documentation job that refreshes the contracts does not gate
  # anything — the follow-up push re-runs the whole workflow — and the staleness interlock is what
  # makes that safe: `just check-config` refuses to validate at all unless the vendored contract
  # provably belongs to the digest the chart pins, so the run that sees a bumped digest and a
  # stale contract fails loudly rather than passing on a check it did not do.
  config-contracts:
    name: Configuration Contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build Helm dependencies
        run: just deps

      # A pinned single binary installed by release URL, exactly as kubeconform is above. Not
      # `pip install jsonschema`: the scripts in `.github/scripts` are stdlib + PyYAML, and a pip
      # install inside a recipe is the difference between a gate that reproduces locally on the
      # Git Bash shell this repository is developed from and one that does not.
      #
      # The version is read from `jv_version` in justfile rather than repeated here, so a bump
      # stays the single edit the other pinned tools already are — a copy in this file could
      # disagree with the one a contributor reproduces the job with, which is the drift the whole
      # recipe-based topology exists to prevent.
      - name: Install jv
        run: |
          set -euo pipefail
          version="$(just --evaluate jv_version)"
          curl -fsSL "https://github.com/santhosh-tekuri/jsonschema/releases/download/${version}/jv-${version}-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin jv
          jv --version

      # PyYAML ships with the runner image's system `python3`, which is what the recipes resolve
      # to. `actions/setup-python` is deliberately not used, for the same reason as in the docs job.
      - name: Validate rendered configuration against image contracts
        run: just check-config

      - name: Report configuration contract coverage
        run: just check-contract-coverage

      - name: Contract model unit tests
        run: just test-contract-union

  install:
    name: Install & Verify (k8s ${{ matrix.kubernetes }})
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout code
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ['v1.31.0', 'v1.34.0']
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      # Three nodes, because `--upgrade` rolls every workload at once and a single node cannot
      # schedule the rolling-update surge alongside the datastore StatefulSets it is also
      # replacing. See the header of the config for what that deadlock looks like.
      - name: Create kind cluster
        if: needs.lint.outputs.changed == 'true'
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          config: ./.github/configs/kind.yaml
          node_image: kindest/node:${{ matrix.kubernetes }}
          wait: '120s'

      # kind's own `--wait` covers the control plane; the workers join after it returns. Without
      # this the install can start while they are still NotReady, land everything on the one node
      # that is, and hit exactly the capacity limit the extra nodes were added to remove.
      - name: Wait for every node to be ready
        if: needs.lint.outputs.changed == 'true'
        run: kubectl wait --for=condition=Ready nodes --all --timeout=180s

      # Charts that ship PodMonitors or PrometheusRules fail to render without the Prometheus
      # Operator's CRDs, and kind provides none. Only the two kinds the charts actually use are
      # applied: the operator itself is not needed, because nothing has to reconcile these
      # objects for the install to be verified — the API server just has to accept them.
      # Server-side apply because the CRD schemas exceed the annotation size limit that
      # client-side `kubectl apply` would hit.
      - name: Install Prometheus Operator CRDs
        if: needs.lint.outputs.changed == 'true'
        env:
          # renovate: datasource=github-releases depName=prometheus-operator/prometheus-operator
          PROMETHEUS_OPERATOR_VERSION: v0.93.0
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/${PROMETHEUS_OPERATOR_VERSION}/example/prometheus-operator-crd"
          for crd in podmonitors prometheusrules; do
            kubectl apply --server-side -f "${base}/monitoring.coreos.com_${crd}.yaml"
          done
          kubectl wait --for=condition=Established --timeout=60s \
            crd/podmonitors.monitoring.coreos.com \
            crd/prometheusrules.monitoring.coreos.com

      # `--upgrade` is what makes this job an upgrade test rather than only an install test, and
      # the recipe explains how new charts are partitioned out of it. `origin/main` is named in
      # both the recipe and ct.yaml — keep the two in step.
      - name: Run chart-testing (install & upgrade)
        if: needs.lint.outputs.changed == 'true'
        run: just test-install

  renovate-validate:
    name: Validate Renovate Config
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Renovate configuration
        uses: suzuki-shunsuke/github-action-renovate-config-validator@ee9f69e1f683ed0d08225086482b34fc9abe9300 # v2.1.0
