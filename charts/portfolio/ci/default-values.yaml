ingress:
  enabled: true
  hosts:
    - host: portfolio.local
      paths:
        - path: /
          pathType: Prefix

# The image refuses to start without an `imprint` and a `privacy` document —
# `values.schema.json` states that as a `required` pair under `legal.documents`, so every
# install fixture needs both or `helm template`/`ct install` fails before a pod is ever
# scheduled. Fixture content only; not a template for a real deployment's legal text.
legal:
  documents:
    imprint:
      title:
        en: Imprint
      body:
        en: |
          # Imprint
    privacy:
      title:
        en: Privacy Policy
      body:
        en: |
          # Privacy Policy
