webhook:
  targetBase: "https://test.google.com"
  paths:
    "/api/webhook/.*":
      - ALL
    "/api/webhook2/.*":
      - GET
      - POST

cloudflare:
  clientId: "testId"
  clientSecret: "testSecret"

ingress:
  enabled: true
  hosts:
    - host: test.test.de
      paths:
       - path: /
         pathType: Prefix
  tls:
    - secretName: test-tls
      hosts:
        - test.test.de
