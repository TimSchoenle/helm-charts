name: CodeQL

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['**']
  schedule:
    # Off the hour: GitHub queues the most scheduled runs at the top of the hour and drops some.
    - cron: '23 6 * * 1'

# The event is part of the group: a scheduled run and a push to the default branch share its ref,
# so without it a merge cancelled the weekly analysis.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to fetch code
      security-events: write # to upload SARIF results
    strategy:
      fail-fast: false
      matrix:
        language: [actions]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run CodeQL
        uses: TimSchoenle/actions/actions/security/codeql@49acdef9979f343817ec2a85ddd25e5f34befc8b # tag=actions-security-codeql-v1.1.11
        with:
          language: ${{ matrix.language }}
