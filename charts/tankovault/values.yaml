# vim: set ft=yaml:
# yaml-language-server: $schema=values.schema.json

# @schema
# enum: [production, staging, development]
# @schema
# -- Deployment profile, passed as `TANKOVAULT_PROFILE`. This is a process-level key: it is
# read before the layered configuration exists, so it can only ever come from the environment.
# `production` is what turns on the fail-fast secret validation and turns off the API docs
# endpoint; anything other than exactly `production` leaves those safeties off.
profile: production

# @schema
# additionalProperties: true
# @schema
image:
  # @schema
  # type: string
  # @schema
  # -- Registry host shared by every TankoVault image. Empty means Docker Hub.
  registry: ""

  # @schema
  # enum: ["", Always, IfNotPresent, Never]
  # @schema
  # -- Image pull policy. Empty derives it from the tag: pinned digests and versions get
  # `IfNotPresent`, `latest` gets `Always`.
  pullPolicy: ""

# @schema
# type: object
# additionalProperties: true
# @schema
# -- Global TankoVault configuration, expressed exactly as the TOML tree documented in
# `docs/CONFIGURATION.md` (`database.max_connections`, `security.cors.allowed_origins`, ...).
# It is rendered to a ConfigMap and mounted as a file, never passed as environment variables,
# so **changing a value here reloads the running services in place instead of restarting
# them**. Two carve-outs from upstream: `telemetry.*` and `metrics.*` are installed
# process-globally and still need a restart to take effect.
config: {}

# @schema
# type: string
# @schema
# -- Verbatim TOML appended after the rendered `config` tree. The escape hatch for anything
# this chart's TOML renderer cannot express, notably arrays of tables.
configExtraToml: ""

# @schema
# additionalProperties: true
# @schema
configReload:
  # @schema
  # type: boolean
  # @schema
  # -- Add `checksum/config` pod annotations so a configuration change rolls the Deployments.
  # Off by default, and deliberately so: every TankoVault service watches the directories its
  # configuration came from and rebuilds its runtime when the kubelet updates the mounted
  # ConfigMap or Secret, which is strictly better than a rollout. Turn this on only if you
  # want config changes to behave like an ordinary image bump.
  rolloutOnChange: false

  # @schema
  # type: string
  # @schema
  # -- Directory the configuration fragments are mounted at, passed as `TANKOVAULT_CONFIG`.
  configDir: /etc/tankovault/config

  # @schema
  # type: string
  # @schema
  # -- Directory the credential files are mounted at, passed as `TANKOVAULT_SECRETS_DIR`.
  secretsDir: /etc/tankovault/secrets

# @schema
# additionalProperties: true
# @schema
auth:
  # @schema
  # type: string
  # @schema
  # -- Token signing secret (`auth.jwt_secret`). Left empty the chart generates one and remembers
  # it across upgrades, which is the recommended setting; set one explicitly (minimum 32
  # characters, e.g. `openssl rand -hex 32`) only if it has to be known outside the release. The
  # known upstream placeholder is refused at boot in every profile, and rotating the value signs
  # every user out.
  jwtSecret: ""

  # @schema
  # type: string
  # @schema
  # -- Server-side pepper mixed into every argon2id hash, so a database leak alone cannot be
  # brute-forced offline. Left empty the chart generates one **on a first install only** and
  # remembers it across upgrades; a release that already exists without a pepper keeps running
  # without one, because every password stored unpeppered would stop verifying the moment one
  # appeared. For the same reason it must never change once set: rotating or losing it
  # invalidates every stored password, so back the Secret up. The `seed-admin` step receives the
  # identical value, or the administrator it creates could never log in.
  passwordPepper: ""

  # @schema
  # type: string
  # @schema
  # -- Base64 of exactly 32 bytes (`auth.mfa_encryption_key`), sealing every enrolled TOTP secret
  # at rest. A TOTP secret is symmetric, unlike a password hash — whoever reads the column can mint
  # that account's codes — so a database dump must not be enough on its own. Left empty the chart
  # generates one when `services.api` is enabled and remembers it across upgrades, which is the
  # recommended setting; set one explicitly (`openssl rand -base64 32`) only if it has to be known
  # outside the release. **It must never change once anyone has enrolled**: rotating or losing it
  # locks every enrolled account out of its second factor, and the only repair is clearing
  # `user_totp` and having them enrol again. Deliberately not derived from `jwtSecret`, which is
  # routine to rotate. Unset disables authenticator-app enrolment only — security keys and
  # recovery codes still work — but the seeded administrator holds permissions that require a
  # second factor, so unset leaves it only a hardware key.
  mfaEncryptionKey: ""

# @schema
# additionalProperties: true
# @schema
# -- How the services identify each other on their privileged internal routes. Authorisation is
# the same either way — every callee carries a compiled-in table of which callers may reach which
# routes — so this chooses only how a caller proves who it is, and the two modes are otherwise
# indistinguishable.
internal:
  # @schema
  # enum: [mtls, token]
  # @schema
  # -- Identification mode. `mtls` identifies a caller by the DNS SAN on its verified client
  # certificate; it is the default, it needs no credential in the release at all, and the
  # certificates can come either from cert-manager or from Secrets you already have. `token`
  # gives each caller its own secret, presented in `X-Internal-Token`, and is the mode for
  # clusters with no PKI to hand.
  identity: mtls

  # @schema
  # additionalProperties: true
  # @schema
  # -- Certificate material for `identity: mtls`. Ignored entirely under `token`.
  tls:
    # @schema
    # enum: [certManager, existingSecrets]
    # @schema
    # -- Where each service's keypair comes from. `certManager` has this chart issue one
    # `Certificate` per service and is the recommended path by some distance: cert-manager renews
    # and rotates on its own, so nothing here expires unattended, and the SANs cannot drift from
    # what the peer configuration expects because the same template writes both.
    # `existingSecrets` takes Secrets you produced some other way — an external PKI, a Vault
    # Agent sidecar, SPIRE, or a certificate issued by hand — and creates no `Certificate` at all.
    # In that mode renewal is yours to arrange, and a certificate that expires stops every
    # privileged call in the release.
    source: certManager

    # @schema
    # additionalProperties: true
    # @schema
    # -- Settings for `source: certManager`. Ignored under `existingSecrets`.
    certManager:
      # @schema
      # additionalProperties: true
      # @schema
      # -- The cert-manager issuer that signs each service's certificate. It has to be one whose
      # CA every service can also verify against, so a public ACME issuer is the wrong shape here
      # — a CA `Issuer` or `ClusterIssuer`, or a Vault/Venafi issuer, is what this expects.
      issuerRef:
        # @schema
        # type: string
        # @schema
        # -- Issuer name. Required under `source: certManager`; there is no default to fall back
        # on.
        name: ""

        # @schema
        # enum: [Issuer, ClusterIssuer]
        # @schema
        # -- Issuer kind.
        kind: ClusterIssuer

        # @schema
        # type: string
        # @schema
        # -- API group of the issuer resource.
        group: cert-manager.io

      # @schema
      # type: string
      # @schema
      # -- Requested certificate lifetime.
      duration: 2160h

      # @schema
      # type: string
      # @schema
      # -- How far ahead of expiry cert-manager renews. Renewal needs no rollout: the services
      # re-read the files every 30 seconds and swap the credential without dropping connections,
      # which is why no `checksum/` annotation names these Secrets.
      renewBefore: 360h

      # @schema
      # additionalProperties: true
      # @schema
      # -- Private key policy, passed to the Certificate verbatim. `rotationPolicy: Always`
      # issues a fresh key on every renewal rather than re-signing the old one.
      privateKey:
        # @schema
        # enum: [RSA, ECDSA, Ed25519]
        # @schema
        # -- Key algorithm.
        algorithm: ECDSA

        # @schema
        # type: integer
        # @schema
        # -- Key size, in the units the algorithm uses.
        size: 256

        # @schema
        # enum: [Never, Always]
        # @schema
        # -- Whether a renewal also rotates the private key.
        rotationPolicy: Always

    # @schema
    # type: object
    # additionalProperties:
    #   type: string
    # @schema
    # -- Secrets holding each service's keypair, for `source: existingSecrets`, keyed by service.
    # Every enabled service but the `frontend` needs one — including `notifier`, which presents
    # its certificate to NATS — and the chart refuses to render while any is missing rather than
    # producing a pod that waits forever on a volume.
    #
    # Each must be a `kubernetes.io/tls`-shaped Secret (`tls.crt`, `tls.key`), and **no two
    # services may share one**: a service is identified by the SANs on the certificate it
    # presents, so a shared Secret would let either of them speak as the other. Each certificate
    # has to be valid for the Service name its peers dial it at — `<release>-tankovault-<slug>` —
    # and, if it also carries the name under `sans`, for that.
    existingSecrets:
      api: ""
      controlPlane: ""
      worker: ""
      notifier: ""
      sync: ""
      challengeSolver: ""
      render: ""

    # @schema
    # type: object
    # additionalProperties:
    #   type: string
    # @schema
    # -- The DNS name each service is identified by, keyed by service, overriding the derived
    # `<release>-tankovault-<slug>.<namespace>.svc`. This is the name written into every peer's
    # configuration and, under `source: certManager`, requested on the certificate too — the two
    # halves always agree because one value sets both.
    #
    # For an external PKI that issues names of its own (`api.tankovault.internal`), name them
    # here. The verifier checks the configured name against *every* DNS SAN on the presented
    # certificate rather than only the first, so a certificate carrying both the in-cluster name
    # and yours satisfies both this and the hostname check on the dialed address.
    sans: {}

    # @schema
    # additionalProperties: true
    # @schema
    # -- Where the CA every service verifies its peers against comes from.
    ca:
      # @schema
      # enum: [certificateSecret, configMap, secret]
      # @schema
      # -- CA source. `certificateSecret` reads it from the `ca.crt` key of the same Secret that
      # holds the keypair — the default, because it needs no second object, no second volume and
      # no trust-manager: cert-manager writes that key for a CA issuer, and the
      # `kubernetes.io/tls` + `ca.crt` layout is what most PKIs produce anyway. `configMap` reads
      # a ConfigMap, which is what a trust-manager `Bundle` writes and the more robust setup:
      # one bundle for the cluster, rotatable independently of any single certificate, and the
      # only option when your issuer does not populate `ca.crt`. `secret` reads a Secret, for a
      # PKI that ships its root that way.
      source: certificateSecret

      # @schema
      # type: string
      # @schema
      # -- Name of the ConfigMap or Secret holding the bundle. Required unless `source` is
      # `certificateSecret`, which reads the keypair Secret the service already mounts. With
      # `bundle.create` this is also the name of the trust-manager `Bundle`.
      name: tankovault-ca

      # @schema
      # type: string
      # @schema
      # -- Key holding the PEM bundle, in whichever object `source` selects.
      key: ca.crt

      # @schema
      # additionalProperties: true
      # @schema
      # -- The trust-manager `Bundle` that produces the ConfigMap, rendered as part of this
      # release. Only meaningful with `source: configMap`.
      bundle:
        # @schema
        # type: boolean
        # @schema
        # -- Render the `Bundle`. Off by default because a Bundle is cluster-scoped: two releases
        # creating the same name would be two objects overwriting each other. Leave it off and
        # point `ca.name` at the ConfigMap your existing cluster-wide Bundle already writes here.
        create: false

        # @schema
        # type: array
        # items:
        #   type: object
        #   additionalProperties: true
        # @schema
        # -- trust-manager `spec.sources`, verbatim. Required when `create` is set, because
        # nothing in an issuer reference says where the CA certificate lives — a `ClusterIssuer`
        # names a Secret in cert-manager's namespace, not in this one. For a CA issuer that is
        # usually `[{secret: {name: internal-ca, key: ca.crt}}]`.
        sources: []

        # @schema
        # type: object
        # additionalProperties: true
        # @schema
        # -- Label selector for the namespaces the Bundle writes into. Empty confines it to this
        # release's namespace; a Bundle with no selector at all would write a ConfigMap into
        # every namespace in the cluster.
        namespaceSelector: {}

    # @schema
    # type: string
    # @schema
    # -- Directory the keypair is mounted at, as `tls.crt` and `tls.key`. With
    # `ca.source: certificateSecret` the bundle is read from this directory too.
    certDir: /etc/tankovault/tls

    # @schema
    # type: string
    # @schema
    # -- Directory the CA bundle is mounted at, when it comes from an object of its own. Kept
    # apart from `certDir` because the two are then written by different controllers — a
    # cert-manager Secret and a trust-manager ConfigMap — and a volume can only carry one.
    caDir: /etc/tankovault/tls-ca

  # @schema
  # type: object
  # additionalProperties:
  #   type: string
  # @schema
  # -- Per-caller tokens for `identity: token`, keyed by caller name. Exactly two services make
  # privileged calls — `api` and `worker` — so exactly two tokens exist, and each callee receives
  # only the tokens of the callers it accepts: holding `worker`'s opens the routes `worker` may
  # call and nothing else. Left empty the chart generates each one and remembers it across
  # upgrades, which is the recommended setting; set one explicitly (minimum 32 characters, e.g.
  # `openssl rand -hex 32`) only if it has to be known outside the release. Ignored under `mtls`,
  # and the chart refuses to render rather than leave a value here meaning nothing.
  tokens:
    api: ""
    worker: ""

  # @schema
  # type: string
  # @schema
  # -- **Removed in chart 4.0.0.** The single shared token that used to open every privileged
  # route on every service. Upstream refuses it at boot in every profile with no dual-accept
  # window, so this chart fails the render with the migration path rather than letting a release
  # carry it into a fleet-wide crash loop. Use `internal.identity` with `internal.tls` or
  # `internal.tokens`.
  token: ""

# @schema
# additionalProperties: true
# @schema
anilist:
  # @schema
  # type: string
  # @schema
  # -- AniList OAuth application client ID. Register at <https://anilist.co/settings/developer>.
  clientId: ""

  # @schema
  # type: string
  # @schema
  # -- AniList OAuth application client secret.
  clientSecret: ""

  # @schema
  # type: string
  # @schema
  # -- Base64 of exactly 32 bytes, sealing every user's AniList token at rest. Left empty the
  # chart generates one when `services.sync` is enabled and remembers it across upgrades, which
  # is the recommended setting; set one explicitly (`openssl rand -base64 32`) only if it has to
  # be known outside the release. Losing it forces every account to re-link; leaking it exposes
  # every stored token. Rotating it does not re-seal tokens already stored.
  tokenEncryptionKey: ""

  # @schema
  # type: string
  # @schema
  # -- OAuth redirect URI. Left empty it is derived from the ingress as
  # `<external URL>/account/anilist-callback`. It must point at the **frontend**, not the API:
  # the API callback would need the SPA's in-memory bearer token, which a browser redirect
  # cannot carry.
  redirectUri: ""

# @schema
# additionalProperties: true
# @schema
# -- Transactional email relay, shared by `api` (password reset, verification) and `notifier`.
# The channel is enabled only when a relay and `from` are both present; a partial
# configuration falls back to a no-op mailer that logs and drops.
email:
  # @schema
  # type: string
  # @schema
  # -- SMTP host. Empty disables outbound email entirely.
  host: ""

  # @schema
  # type: integer
  # minimum: 1
  # maximum: 65535
  # @schema
  # -- SMTP port.
  port: 587

  # @schema
  # enum: [starttls, tls, none]
  # @schema
  # -- Transport security for the relay connection.
  security: starttls

  # @schema
  # type: string
  # @schema
  # -- SMTP username.
  username: ""

  # @schema
  # type: string
  # @schema
  # -- SMTP password.
  password: ""

  # @schema
  # type: string
  # @schema
  # -- `From` header, e.g. `TankoVault <no-reply@example.com>`. Required for any mail to be sent.
  from: ""

  # @schema
  # type: string
  # @schema
  # -- Public base URL used to build links in outgoing mail. Left empty it is derived from the
  # ingress. Leaving it pointed at localhost produces unusable links in real emails.
  baseUrl: ""

# @schema
# additionalProperties: true
# @schema
# -- Notification fan-out targets read by the `notifier` service.
channels:
  # @schema
  # type: array
  # items:
  #   type: string
  # @schema
  # -- Static recipient addresses for new-chapter notifications. Empty disables the channel.
  emailTo: []

  # @schema
  # type: string
  # @schema
  # -- Discord webhook URL. Empty disables the channel.
  discordWebhookUrl: ""

  # @schema
  # type: string
  # @schema
  # -- Generic outbound webhook URL. Empty disables the channel.
  webhookUrl: ""

# @schema
# type: string
# @schema
# -- Name of an existing Secret holding the credentials, instead of having the chart render one
# from the values above. When set it takes precedence and no credential value is written into
# the Helm release. Its keys are the configuration paths with `__` for nesting and no dots —
# `auth__jwt_secret`, `auth__password_pepper`, `auth__mfa_encryption_key`,
# `anilist__client_id`, `anilist__client_secret`, `anilist__token_encryption_key`,
# `email__username`, `email__password`, `channels__discord_webhook_url`,
# `channels__webhook_url`, `database__url`, `redis__url`. Only the keys a given service reads
# are projected into it. Under `internal.identity=token` add `internal__tokens__api` and
# `internal__tokens__worker`: those two are keyed by caller rather than by configuration path,
# because one token is read as `internal.caller.token` by the caller and as
# `internal.peers.<caller>.token` by each of its callees, and the projection maps the key onto
# whichever path the reading pod needs. Under `mtls` no internal credential is needed at all.
existingSecret: ""

# @schema
# additionalProperties: true
# @schema
# -- Settings shared by every TankoVault workload. Anything here can be overridden per service
# under `services.<name>`, which is merged over this block.
defaults:
  # @schema
  # enum: [restricted, none]
  # @schema
  # -- Pod security context baseline.
  podSecurityContextPreset: restricted

  # @schema
  # $ref: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.0/_definitions.json#/definitions/io.k8s.api.core.v1.PodSecurityContext
  # @schema
  # -- Pod security context, merged over the preset. The identity fields match the numeric
  # nonroot user baked into every published TankoVault image (`USER 1001:1001`).
  podSecurityContext:
    # @schema
    # type: integer
    # @schema
    # -- User ID to run as.
    runAsUser: 1001

    # @schema
    # type: integer
    # @schema
    # -- Primary group ID to run as.
    runAsGroup: 1001

    # @schema
    # type: integer
    # @schema
    # -- Group ID applied to mounted volumes.
    fsGroup: 1001

  # @schema
  # enum: [restricted, none]
  # @schema
  # -- Container security context baseline. Safe for every service: eight of the nine images
  # are bare `scratch` layers holding only the binary, the musl loader and a CA bundle, so
  # there is no writable path to depend on.
  securityContextPreset: restricted

  # @schema
  # $ref: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.0/_definitions.json#/definitions/io.k8s.api.core.v1.SecurityContext
  # @schema
  # -- Container security context, merged over the preset.
  securityContext: {}

  # @schema
  # enum: ["", nano, micro, small, medium, large]
  # @schema
  # -- Default resource t-shirt size, overridden per service below.
  resourcesPreset: medium

  # @schema
  # $ref: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.0/_definitions.json#/definitions/io.k8s.api.core.v1.ResourceRequirements
  # @schema
  # -- Explicit resources. Wins over `resourcesPreset` when set.
  resources: {}

  # @schema
  # additionalProperties: true
  # @schema
  # -- Startup probe. Hits `/health`, which deliberately checks nothing external.
  startupProbe:
    # @schema
    # type: boolean
    # @schema
    # -- Enable the startup probe.
    enabled: true

    # @schema
    # additionalProperties: true
    # @schema
    # -- HTTP handler for the probe.
    httpGet:
      # @schema
      # type: string
      # @schema
      # -- Liveness path.
      path: /health

      # @schema
      # type: string
      # @schema
      # -- Named container port to probe.
      port: http

    # @schema
    # type: integer
    # @schema
    # -- Probe interval.
    periodSeconds: 5

    # @schema
    # type: integer
    # @schema
    # -- Probe timeout.
    timeoutSeconds: 3

    # @schema
    # type: integer
    # @schema
    # -- Consecutive failures before the container is considered failed.
    failureThreshold: 30

  # @schema
  # additionalProperties: true
  # @schema
  # -- Liveness probe. Uses `/health`, never `/ready`: `/ready` reports on Postgres and NATS,
  # so wiring liveness to it would turn a database blip into a fleet-wide restart storm.
  livenessProbe:
    # @schema
    # type: boolean
    # @schema
    # -- Enable the liveness probe.
    enabled: true

    # @schema
    # additionalProperties: true
    # @schema
    # -- HTTP handler for the probe.
    httpGet:
      # @schema
      # type: string
      # @schema
      # -- Liveness path.
      path: /health

      # @schema
      # type: string
      # @schema
      # -- Named container port to probe.
      port: http

    # @schema
    # type: integer
    # @schema
    # -- Probe interval.
    periodSeconds: 30

    # @schema
    # type: integer
    # @schema
    # -- Probe timeout.
    timeoutSeconds: 5

    # @schema
    # type: integer
    # @schema
    # -- Consecutive failures before the container is restarted.
    failureThreshold: 5

  # @schema
  # additionalProperties: true
  # @schema
  # -- Readiness probe. Uses `/ready`, which probes every registered dependency concurrently
  # and returns per-dependency detail.
  readinessProbe:
    # @schema
    # type: boolean
    # @schema
    # -- Enable the readiness probe.
    enabled: true

    # @schema
    # additionalProperties: true
    # @schema
    # -- HTTP handler for the probe.
    httpGet:
      # @schema
      # type: string
      # @schema
      # -- Readiness path.
      path: /ready

      # @schema
      # type: string
      # @schema
      # -- Named container port to probe.
      port: http

    # @schema
    # type: integer
    # @schema
    # -- Probe interval.
    periodSeconds: 10

    # @schema
    # type: integer
    # @schema
    # -- Probe timeout. Upstream bounds each dependency check at 2s, so 3s leaves headroom
    # without letting a wedged probe hang.
    timeoutSeconds: 3

    # @schema
    # type: integer
    # @schema
    # -- Consecutive failures before the pod leaves the Service.
    failureThreshold: 3

  # @schema
  # enum: ["", soft, hard]
  # @schema
  # -- Pod anti-affinity across nodes. `soft` prefers spreading replicas, `hard` requires it.
  podAntiAffinity: soft

  # @schema
  # $ref: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.0/_definitions.json#/definitions/io.k8s.api.core.v1.Affinity
  # @schema
  # -- Explicit affinity rules. Wins over `podAntiAffinity` when set.
  affinity: {}

  # @schema
  # type: object
  # additionalProperties:
  #   type: string
  # @schema
  # -- Node selector for pod assignment.
  nodeSelector: {}

  # @schema
  # type: array
  # items:
  #   $ref: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.0/_definitions.json#/definitions/io.k8s.api.core.v1.Toleration
  # @schema
  # -- Tolerations for pod assignment.
  tolerations: []

  # @schema
  # type: array
  # items:
  #   $ref: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.0/_definitions.json#/definitions/io.k8s.api.core.v1.TopologySpreadConstraint
  # @schema
  # -- Topology spread constraints.
  topologySpreadConstraints: []

  # @schema
  # type: string
  # @schema
  # -- Priority class for the pods.
  priorityClassName: ""

  # @schema
  # type: integer
  # @schema
  # -- Grace period for shutdown. Every service cancels its work loop on SIGTERM and stops
  # between units of work.
  terminationGracePeriodSeconds: 30

  # @schema
  # type: integer
  # @schema
  # -- Number of old ReplicaSets to retain.
  revisionHistoryLimit: 3

  # @schema
  # additionalProperties: true
  # @schema
  # -- Deployment update strategy.
  strategy: {}

  # @schema
  # type: boolean
  # @schema
  # -- Whether to automount the service account token. Nothing in TankoVault talks to the
  # Kubernetes API.
  automountServiceAccountToken: false

  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Extra pod annotations.
  podAnnotations: {}

  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Extra pod labels.
  podLabels: {}

  # @schema
  # type: array
  # items:
