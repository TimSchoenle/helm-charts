          pattern: '(?m)^\[csp\]$\n(?:[^\[\n][^\n]*\n|\n)*^hash_inline_scripts = false$'

  - it: delivers isr.cache_dir into config.toml
    documentSelector:
      path: data["config.toml"]
    set:
      config.csp.cloudflare.script_nonce: false
