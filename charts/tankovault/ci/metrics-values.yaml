# Autoscaling, disruption budgets and the full Prometheus Operator surface.
auth:
  jwtSecret: ci-jwt-secret-0123456789abcdef0123
internal:
  token: ci-internal-token-0123456789abcdef01
anilist:
  clientId: "12345"
  clientSecret: ci-anilist-client-secret
  tokenEncryptionKey: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  redirectUri: https://tankovault.example.com/account/anilist-callback
externalDatabase:
  url: postgres://tankovault:ci@postgresql.example.com:5432/tankovault
externalNats:
  url: nats://nats.example.com:4222
externalFlaresolverr:
  url: http://flaresolverr.example.com:8191
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  prometheusRule:
    enabled: true
    labels:
      release: kube-prometheus-stack
  dashboard:
    enabled: true
services:
  api:
    autoscaling:
      enabled: true
    podDisruptionBudget:
      enabled: true
  worker:
    autoscaling:
      enabled: true
    podDisruptionBudget:
      enabled: true
  frontend:
    autoscaling:
      enabled: true
    podDisruptionBudget:
      enabled: true
