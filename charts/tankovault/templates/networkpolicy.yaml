{{- /*
Per-service NetworkPolicies, rendered from `tankovault.netpol.plan`.

The library builder emits one ingress and one egress policy for a single-workload chart and keys
them off a `networkPolicy.egress.{dns,http,https,cidr}` value shape. Neither fits: this chart has
twelve workloads whose rules are pod-to-pod and asymmetric. What the topology *is* lives in
`_netpol.tpl`, derived from `tankovault.serviceSpecs`; this file only knows how to say it in
`networking.k8s.io/v1`. `ciliumnetworkpolicy.yaml` says the same plan in Cilium's dialect, which
is why the two engines cannot describe different graphs.

Default-deny is implicit: a policy naming a policy type denies everything it does not list for
that type. Which types are named comes from the plan's `governsIngress` rather than being fixed at
both — the bootstrap Jobs listen on nothing, and naming `Ingress` on their policy would invent a
denial out of an object written only to let them out. The Cilium rendering says the same thing
with `enableDefaultDeny.ingress: false`.

The central rule the egress side enforces: every rule carries a `to:` selector. A rule that lists
only `ports:` is not a restriction — the API reads a missing `to` as "all destinations", so
"the pod may talk HTTPS" actually reads "the pod may talk to anything, anywhere, on 443",
including the cloud metadata endpoint at 169.254.169.254.
*/ -}}

{{- define "tankovault.netpol.peer" -}}
{{- if .namespace }}
- namespaceSelector:
    matchLabels:
      {{- toYaml .namespace | nindent 6 }}
  {{- with .selector }}
  podSelector:
    matchLabels:
      {{- toYaml . | nindent 6 }}
  {{- end }}
{{- else }}
- podSelector:
    matchLabels:
      {{- toYaml .selector | nindent 6 }}
{{- end }}
{{- end -}}

{{- define "tankovault.netpol.dnsPeers" -}}
- namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: kube-system
  podSelector:
    matchLabels:
      k8s-app: kube-dns
{{- end -}}

{{- /*
"The internet" with the private ranges and the cloud metadata endpoint carved out. The worker
fetches provider sites, sync talks to AniList and the notifier reaches SMTP and webhooks, so these
tiers genuinely need egress — but a scraping tier that can also reach 169.254.169.254 is an SSRF
away from the node's instance credentials.

One rule per entry in `internetCidrs`, which is dual-stack by default: the worker prefers IPv6 and
some provider origins serve nothing else usefully, so a v4-only rule denies those fetches outright
on a dual-stack cluster. The carve-outs come from `tankovault.netpol.internetExcept`, which picks
them per family because the API rejects an `except` outside its own `cidr`.
*/ -}}
{{- define "tankovault.netpol.internetPeers" -}}
{{- range $cidr := .Values.networkPolicy.internetCidrs }}
- ipBlock:
    cidr: {{ $cidr }}
    except:
      {{- include "tankovault.netpol.internetExcept" $cidr | trim | nindent 6 }}
{{- end }}
{{- end -}}

{{- if .Values.networkPolicy.enabled }}
{{- if has (.Values.networkPolicy.engine | default "kubernetes") (list "kubernetes" "both") }}
{{- range $policy := include "tankovault.netpol.plan" . | fromYamlArray }}
---
apiVersion: {{ include "common.capabilities.networkPolicy.apiVersion" $ }}
kind: NetworkPolicy
metadata:
  name: {{ $policy.name }}
  namespace: {{ include "common.namespace" $ }}
  labels:
    {{- include "common.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $policy.component }}
  {{- /*
    Only the bootstrap policies carry any: a policy applied after the pod it protects is the same
    outage as no policy, and the plan is where that ordering is decided for both dialects at once.
  */}}
  {{- with $policy.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $policy.selector | nindent 6 }}
  policyTypes:
    {{- if $policy.governsIngress }}
    - Ingress
    {{- end }}
    - Egress
  {{- if $policy.governsIngress }}
  ingress:
    {{- range $rule := $policy.ingress }}
    - from:
        {{- include "tankovault.netpol.peer" $rule | nindent 8 }}
      ports:
        - port: {{ $rule.port }}
          protocol: TCP
    {{- end }}
    {{- with $.Values.networkPolicy.extraIngress }}
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
  egress:
    {{- range $rule := $policy.egress }}
    {{- if $rule.dns }}
    - to:
        {{- include "tankovault.netpol.dnsPeers" $ | nindent 8 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- else if $rule.internet }}
    - to:
        {{- include "tankovault.netpol.internetPeers" $ | nindent 8 }}
    {{- else }}
    - to:
        {{- include "tankovault.netpol.peer" $rule | nindent 8 }}
      ports:
        - port: {{ $rule.port }}
          protocol: TCP
    {{- end }}
    {{- end }}
    {{- with $.Values.networkPolicy.extraEgress }}
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
