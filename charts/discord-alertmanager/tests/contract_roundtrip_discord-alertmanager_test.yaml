# can see: `just check-config` proves the rendered document satisfies the contract, and a
# document missing a setting entirely satisfies it perfectly.
#
# Chart:       discord-alertmanager
# Declaration: charts/discord-alertmanager/config-contract.yaml (document `discord-alertmanager`)
# Contract:    charts/discord-alertmanager/contracts/discord-alertmanager.json
# Coverage:    46 of 63 contract keys carry a probe
#
# Regenerate with `just contract-tests`. `just check-contract-tests` fails a pull request whose
# committed copy has drifted from the contract it was generated against.

suite: 'contract round trip (discord-alertmanager)'

# `just render` installs every chart under a release named after it, and the declaration's
# selector is written against that render. Naming the release the same way here is what makes
# `app.kubernetes.io/instance` carry the value the declaration selects on.
release:
  name: discord-alertmanager

# Every case below carries this chart's render prerequisites, the identity case included: chart
# values its own `validateValues` insists on before it will render anything at all. They are
# first-class chart values rather than configuration, and none of them may be written under
# `config` — a prerequisite there would sit in the tree every case probes, free to supply the
# value the case exists to prove the chart delivered. Unlike a baseline, a prerequisite is never
# dropped for the case it would collide with, because a case without it does not render at all;
# the refusal is what takes that dropping's place.
#
# `discord-alertmanager.validateValues` refuses a render that could only produce a
# CrashLoopBackOff, and both of these are that case. `SerenitySink::from_token` and
# `AlertmanagerClient::new` are constructed in `main` before the listener binds, and the second
# returns `Config("no Alertmanager endpoint is configured")` for an empty list — so a release
# missing either exits during startup rather than running degraded. The guard runs from
# `configmap.yaml`, so without both there is no ConfigMap for any case to assert against.
# Neither is one this suite covers in any case. `discord.token` is a credential: it travels the
# Secret under the file name `discord__token` and is never written into the configuration
# document at all, so there is no document pair for a probe to check. `alertmanager.endpoints`
# is `structured` in the contract and is refused a probe for that reason, and is named in the
# generated file's skip list. Supplied as the chart's own first-class values although the guard
# reads the effective tree and would accept the endpoint list through `config` too: `config` is
# where every probe is written, and a prerequisite there is refused. `.invalid` is reserved by
# RFC 2606 and can never resolve, which keeps a value that looks like a deployment's real
# Alertmanager from being mistaken for one. The chart merges `.Values.config` over everything it
# derives from these values, so a probe still wins wherever the two would meet.
