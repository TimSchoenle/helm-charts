  # enum: ["", nano, micro, small, medium, large]
  # @schema
  # -- Resource t-shirt size for the bootstrap containers.
  resourcesPreset: small

  # @schema
  # additionalProperties: true
  # @schema
  migrate:
    # @schema
    # enum: [auto, job, initContainer, disabled]
    # @schema
    # -- How `bootstrap migrate` runs. `job` is a `pre-install,pre-upgrade` Helm hook, correct
    # when the database already exists. `initContainer` runs it in every service pod, which is
    # what the bundled PostgreSQL needs — a pre-install hook would run before the StatefulSet
    # exists and could only ever fail. Concurrent runs are safe: sqlx takes a Postgres advisory
    # lock. `auto` picks `initContainer` when `postgresql.enabled`, otherwise `job`.
    mode: auto

    # @schema
    # enum: [helmHook, argoSyncWave]
    # @schema
    # -- How the migration Job is ordered against the workloads. Ignored unless `mode` resolves
    # to `job`, and irrelevant under plain `helm install`, which has no phases to order across.
    # `helmHook` is the `pre-install,pre-upgrade` hook, which Argo CD compiles to the PreSync
    # phase — and PreSync runs before **every** Sync-phase resource, with sync waves ordering
    # only within a phase. So when `database__url` arrives from an ExternalSecret, a first
    # install deadlocks and never recovers: the Job's projected secrets volume names a Secret
    # that does not exist yet, the pod sits in ContainerCreating on FailedMount, the Job never
    # completes, PreSync never finishes, Sync never starts, and the ExternalSecret that would
    # have created that Secret is therefore never applied. Nothing inside PreSync can break the
    # cycle. `argoSyncWave` drops the hook annotations entirely and orders the Job by sync wave
    # inside the Sync phase instead, where the ExternalSecret reconciles alongside it.
    ordering: helmHook

    # @schema
    # type: integer
    # @schema
    # -- Sync wave the migration Job takes under `ordering: argoSyncWave`; the workloads take
    # this plus one, which is what reproduces the `pre-upgrade` guarantee — Argo CD holds a wave
    # until the previous one is healthy, and a Job is healthy only once it is Complete. Anything
    # the migration itself depends on — the ExternalSecret carrying `database__url`, a database
    # some operator provisions — must be given a wave strictly below this one.
    argoSyncWaveBase: 0

    # @schema
    # type: integer
    # minimum: 0
    # @schema
    # -- Retries before the migration Job is considered failed.
    backoffLimit: 3

  # @schema
  # additionalProperties: true
  # @schema
  seedAdmin:
    # @schema
    # type: boolean
    # @schema
    # -- Create the first administrator on install. Create-only: re-running changes nothing.
    # This is the only account privilege is ever minted for, since registration confers none.
    enabled: false

    # @schema
    # type: string
    # @schema
    # -- Administrator username.
    username: admin

    # @schema
    # type: string
    # @schema
    # -- Administrator email address.
    email: ""

    # @schema
    # type: string
    # @schema
    # -- Initial administrator password. Left empty the chart generates one and remembers it
    # across upgrades; NOTES.txt prints the command that reads it back out of the Secret. It is
    # created with the same `auth.passwordPepper` the API runs with, because a mismatch produces
    # an account that can never log in.
    password: ""

  # @schema
  # additionalProperties: true
  # @schema
  seedProviders:
    # @schema
    # type: boolean
    # @schema
    # -- Install the built-in provider presets. Each can be disabled or retargeted from the
    # admin console afterwards.
    enabled: false

# @schema
# additionalProperties: true
# @schema
# -- Bundled PostgreSQL. A single instance with a PVC, on the same image the upstream compose
# stack pins. Deliberately not an operator and not a third-party subchart, so `helm install`
# works on a bare cluster — but equally deliberately **not a production database**: one
# replica, no failover, no point-in-time recovery. Use `externalDatabase` for anything real —
# and give it [pgvector](https://github.com/pgvector/pgvector), which migration `0027` requires.
postgresql:
  # @schema
  # type: boolean
  # @schema
  # -- Deploy the bundled PostgreSQL.
  enabled: false

  # @schema
  # additionalProperties: true
  # @schema
  image:
    # @schema
    # type: string
    # @schema
    # -- Image repository. `pgvector/pgvector`, not stock `postgres`: TankoVault migration
    # `0027_recsys_signals` runs `CREATE EXTENSION vector` and the recommender retrieves through
    # an HNSW index, so the extension is a hard dependency of the deployment rather than an
    # optional extra. This is the official PostgreSQL image with pgvector preinstalled — same
    # major, same entrypoint, same environment contract, same `postgres` uid — so nothing else
    # in this block changes and an existing PVC is reused in place. It is Debian-based rather
    # than Alpine; `resourcesPreset` already accommodates that.
    repository: pgvector/pgvector

    # @schema
    # type: string
    # @schema
    # -- Image tag, pinned by digest. Held to the same digest as upstream's compose stack and CI
    # services, so the database this chart runs is the one the queries were type-checked against.
    tag: pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62

  # @schema
  # additionalProperties: true
  # @schema
  auth:
    # @schema
    # type: string
    # @schema
    # -- Database name.
    database: tankovault

    # @schema
    # type: string
    # @schema
    # -- Database role.
    username: tankovault

    # @schema
    # type: string
    # @schema
    # -- Database password. Generated and persisted across upgrades when left empty.
    password: ""

  # @schema
  # additionalProperties: true
  # @schema
  persistence:
    # @schema
    # type: boolean
    # @schema
    # -- Persist the data directory on a PersistentVolumeClaim. Turning this off means the
    # whole catalogue is lost when the pod is rescheduled.
    enabled: true

    # @schema
    # type: string
    # @schema
    # -- Use an existing claim instead of creating one.
    existingClaim: ""

    # @schema
    # type: string
    # @schema
    # -- Storage class. Empty uses the cluster default.
    storageClassName: ""

    # @schema
    # type: string
    # @schema
    # -- Requested volume size.
    size: 20Gi

  # @schema
  # enum: ["", nano, micro, small, medium, large]
  # @schema
  # -- Resource t-shirt size.
  resourcesPreset: large

# @schema
# additionalProperties: true
# @schema
# -- Point TankoVault at a PostgreSQL you already run. Used whenever `postgresql.enabled` is
# false, and the only supported production topology.
externalDatabase:
  # @schema
  # type: string
  # @schema
  # -- Connection URL, e.g. `postgres://user:password@host:5432/tankovault`. Rendered into the
  # chart's Secret; prefer `existingSecret` so it never enters the Helm release.
  url: ""

  # @schema
  # type: string
  # @schema
  # -- Name of an existing Secret holding the connection URL.
  existingSecret: ""

  # @schema
  # type: string
  # @schema
  # -- Key within that Secret.
  urlKey: database__url

# @schema
# additionalProperties: true
# @schema
# -- Bundled Valkey, backing the API rate limiter and the control-plane's leader election.
# Embedded rather than taken as a subchart: the official Valkey chart defines its own
# `common.image`, and Helm's template namespace is global across dependencies, so it and the
# `common` library overwrite each other. TankoVault degrades gracefully without Valkey — the
# rate limiter falls back to per-replica in-memory counters and the scheduler to sole-leader.
valkey:
  # @schema
  # type: boolean
  # @schema
  # -- Deploy the bundled Valkey.
  enabled: false

  # @schema
  # additionalProperties: true
  # @schema
  image:
    # @schema
    # type: string
    # @schema
    # -- Image repository.
    repository: valkey/valkey

    # @schema
    # type: string
    # @schema
    # -- Image tag, pinned by digest.
    tag: 9.1.1-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328

  # @schema
  # enum: ["", nano, micro, small, medium, large]
  # @schema
  # -- Resource t-shirt size.
  resourcesPreset: medium

# @schema
# additionalProperties: true
# @schema
# -- Point TankoVault at a Redis-compatible server you already run. Used whenever
# `valkey.enabled` is false.
externalRedis:
  # @schema
  # type: string
  # @schema
  # -- Connection URL, e.g. `redis://host:6379`. Empty leaves Redis unconfigured, which is
  # supported: the rate limiter and scheduler both degrade rather than fail.
  url: ""

  # @schema
  # type: string
  # @schema
  # -- Name of an existing Secret holding the connection URL.
  existingSecret: ""

  # @schema
  # type: string
  # @schema
  # -- Key within that Secret.
  urlKey: redis__url

# @schema
# additionalProperties: true
# @schema
# -- Bundled NATS JetStream, the task queue and event bus the control plane, worker and
# notifier are built on: a single instance with a file store on a PVC. Embedded rather than
# taken from the NATS authors' chart because that chart ships no `values.schema.json`, so
# `helm schema` derives a closed one from its own values.yaml and makes the `container.merge`
# and `podTemplate.merge` patches unsettable — and those patches are the only way to give its
# pods the security context and resource requests this repository's policy scan requires.
# Evaluation-tier like the other bundled datastores: no clustering, so no replication and no
# failover. Use `externalNats` for anything real.
nats:
  # @schema
  # type: boolean
  # @schema
  # -- Deploy the bundled NATS.
  enabled: false

  # @schema
  # additionalProperties: true
  # @schema
  image:
    # @schema
    # type: string
    # @schema
    # -- Image repository.
    repository: nats

    # @schema
    # type: string
    # @schema
    # -- Image tag, pinned by digest.
    tag: 2-alpine@sha256:f2123f533c2b0cada0a5c5ec434fb2b8cfe1cf220215ef9d7517e1372917ad66

  # @schema
  # additionalProperties: true
  # @schema
  persistence:
    # @schema
    # type: boolean
    # @schema
    # -- Persist the JetStream file store. Without it every queued scan task and every
    # undelivered event is lost when the pod is rescheduled.
    enabled: true

    # @schema
    # type: string
    # @schema
    # -- Use an existing claim instead of creating one.
    existingClaim: ""

    # @schema
    # type: string
    # @schema
    # -- Storage class. Empty uses the cluster default.
    storageClassName: ""

    # @schema
    # type: string
    # @schema
    # -- Requested volume size.
    size: 10Gi

  # @schema
  # enum: ["", nano, micro, small, medium, large]
  # @schema
  # -- Resource t-shirt size.
  resourcesPreset: medium

# @schema
# additionalProperties: true
# @schema
# -- Point TankoVault at a NATS you already run. Used whenever `nats.enabled` is false.
externalNats:
  # @schema
  # type: string
  # @schema
  # -- Connection URL, e.g. `nats://host:4222`. Required by control-plane, worker and notifier;
  # optional on the API, where its absence only degrades the live notification stream. Under
  # `internal.identity=mtls` the services present their client certificate to the broker and
  # require TLS on that connection, so it must be a TLS-enabled NATS.
  url: ""

  # @schema
  # type: string
  # @schema
  # -- Name of an existing Secret holding one NATS URL per service, keyed by service slug (`api`,
  # `control-plane`, `worker`, `notifier`). Each pod projects its own key as `nats__url`, which
  # replaces the derived URL entirely. This is how per-service NATS **accounts** are delivered —
  # the thing that stops `notifier` publishing scan tasks — since the credential belongs in the
  # URL and so cannot live in the ConfigMap. Note that the accounts themselves are NATS server
  # configuration: the services present what you give them here, and cannot assert what a broker
  # does not enforce.
  perServiceSecret: ""

# @schema
# additionalProperties: true
# @schema
# -- Bundled [TRAWL](https://github.com/germondai/trawl), the default backend for the challenge
# solver.
trawl:
  # @schema
  # type: boolean
  # @schema
  # -- Deploy the bundled TRAWL.
  enabled: false

  # @schema
  # additionalProperties: true
  # @schema
  image:
    # @schema
    # type: string
    # @schema
    # -- Image repository.
    repository: ghcr.io/germondai/trawl

    # @schema
    # type: string
    # @schema
    # -- Image tag, pinned by digest. Never `latest`: it silently changes the bot-management
    # behaviour the adapters are tuned against.
    tag: 1.3.1@sha256:1276e2937346190380310e15b3c4cbbf7757827c2ed3056459ad999b10cb90c9

  # @schema
  # type: integer
  # @schema
  # -- Numeric UID to run as. The upstream image declares no `USER`, so it would run as root
  # and the restricted Pod Security Standard would refuse the pod. Everything the image ships
  # is world-readable, so any non-root UID works.
  runAsUser: 1000

  # @schema
  # type: integer
  # minimum: 1
  # @schema
  # -- Number of warm browser instances to keep. Each is a full Firefox, so raising this raises
  # `resources` with it. The image's own default is 3, which fits none of the sizes below.
  browserPoolSize: 1

  # @schema
  # type: string
  # @schema
  # -- Size of the `/dev/shm` in-memory volume. Firefox needs far more shared memory than the
  # 64Mi Kubernetes provides by default, and fails in confusing ways without it.
  shmSize: 1Gi

  # @schema
  # additionalProperties: true
  # @schema
  redis:
    # @schema
    # type: boolean
    # @schema
    # -- Give TRAWL a Redis for its per-domain solved-session cache. Without one every request
    # re-solves from a cold browser — slower, not broken.
    enabled: true

    # @schema
    # type: string
    # @schema
    # -- Connection URL. Defaults to the same Redis the services use (`valkey` or
    # `externalRedis.url`). Sharing one instance is safe: TankoVault namespaces its keys under
    # `tankovault:` and TRAWL uses `session:<domain>`.
    url: ""

  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Resource requests and limits. Set explicitly rather than by t-shirt size because the
  # largest preset caps memory at 1Gi, and a browser tier exceeds that before it has solved
  # anything. Scale with `browserPoolSize`.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

# @schema
# additionalProperties: true
# @schema
# -- Point the challenge solver at a TRAWL you already run.
externalTrawl:
  # @schema
  # type: string
  # @schema
  # -- Endpoint URL, e.g. `http://trawl:8191`.
  url: ""

# @schema
# additionalProperties: true
# @schema
# -- Ingress. Only the frontend is exposed by default; it serves the SPA and proxies `/v1/*`
# to the API, so one origin covers the whole application and same-origin cookies, SSE and
# passkey origins all line up without extra configuration.
ingress:
  # @schema
  # type: boolean
  # @schema
  # -- Create an Ingress for the frontend.
  enabled: false

  # @schema
  # type: string
  # @schema
  # -- IngressClass name.
  className: ""

  # @schema
  # type: string
  # @schema
  # -- Hostname the application is served on.
  host: ""

  # @schema
  # type: string
  # @schema
  # -- Override the derived external URL used for `anilist.redirect_uri`, `email.base_url` and
  # `auth.webauthn_origin`. Set this when TLS terminates on a proxy in front of the ingress.
  url: ""

  # @schema
  # type: string
  # @schema
  # -- Path prefix.
  path: /

  # @schema
  # enum: [Prefix, Exact, ImplementationSpecific]
  # @schema
  # -- Path type.
  pathType: Prefix

  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Extra Ingress annotations.
  annotations: {}

  # @schema
  # additionalProperties: true
  # @schema
  tls:
    # @schema
    # type: boolean
    # @schema
    # -- Terminate TLS. Note `auth.cookie_secure` defaults to true, so sessions are lost over
    # plain HTTP on any host other than `localhost`.
    enabled: false

    # @schema
    # type: string
    # @schema
    # -- Name of the TLS Secret. Defaults to `<fullname>-tls` when empty.
    secretName: ""

  # @schema
  # additionalProperties: true
  # @schema
  # -- A second Ingress publishing the API on its own hostname, for split-origin clients.
  # Enabling it means the browser origin no longer matches the API origin, so CORS,
  # `auth.webauthn_origin` and cookie `SameSite` all have to be set consistently or logins
  # break in ways that only appear at runtime.
  api:
    # @schema
    # type: boolean
    # @schema
    # -- Create the API Ingress.
    enabled: false

    # @schema
    # type: string
    # @schema
    # -- Hostname the API is served on.
    host: ""

    # @schema
    # type: object
    # additionalProperties: true
    # @schema
    # -- Extra Ingress annotations.
    annotations: {}

# @schema
# additionalProperties: true
# @schema
# -- Gateway API exposure, the successor to `ingress` and an independent switch from it: a
# cluster migrating from an Ingress controller to a Gateway implementation runs both for a while.
#
# What it publishes is the same thing `ingress` does and for the same reason — the frontend
# serves the SPA and reverse-proxies `/v1/*` to the API, so one origin covers the whole
# application. Only the mechanism differs: the `Gateway` (its listeners, its address, its
# certificates) belongs to the cluster operator, and this chart owns the `HTTPRoute` that
# attaches to it.
gateway:
  # @schema
  # type: boolean
  # @schema
  # -- Create an HTTPRoute for the frontend. Requires the `gateway.networking.k8s.io` CRDs; the
  # render fails loudly rather than silently dropping the route when they are absent.
  enabled: false

  # @schema
  # type: boolean
  # @schema
  # -- Also create the Gateway itself, for an install with no cluster-wide one to attach to.
  # A route that names no parent attaches to it automatically.
  create: false

  # @schema
  # type: string
  # @schema
  # -- GatewayClass that programs the created Gateway, e.g. `cilium`, `istio`, `envoy-gateway`.
  # Required by `create`; a Gateway without one is never reconciled.
  gatewayClassName: ""

  # @schema
  # type: array
  # @schema
  # -- Gateways the routes attach to. Each entry takes `name` and optionally `namespace`,
  # `sectionName`, `port`, `group` and `kind`. Required unless `create` is set: a route with no
  # parent is accepted by the API server and then never programmed by any listener.
  parentRefs: []

  # @schema
  # type: string
  # @schema
  # -- Hostname the application is served on.
  host: ""

  # @schema
  # type: string
  # @schema
  # -- Override the derived external URL used for `anilist.redirect_uri`, `email.base_url` and
  # `auth.webauthn_origin`. Takes precedence over `ingress.url`. Set this when TLS terminates on
  # a proxy in front of the Gateway.
  url: ""

  # @schema
  # type: string
  # @schema
  # -- Path prefix the route matches.
  path: /

  # @schema
  # type: array
  # @schema
  # -- Filters applied to the frontend route: `RequestHeaderModifier`,
  # `ResponseHeaderModifier`, `RequestRedirect`, `URLRewrite`, `RequestMirror`, `ExtensionRef`.
  # This is where an Ingress controller's annotations end up, as typed fields.
  filters: []

  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Timeouts for the frontend route: `request` and `backendRequest`, as Go durations.
  #
  # Leave `request` unset or generous if the SPA holds the `/v1/events` SSE stream open through
  # this route — a request timeout cuts a long-lived stream at the Gateway, and the symptom is a
  # UI that quietly stops updating rather than an error anybody sees.
  timeouts: {}

  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Annotations for the HTTPRoute.
  annotations: {}

  # @schema
  # additionalProperties: true
  # @schema
  # -- A second route that redirects plaintext traffic to HTTPS. Under Ingress this was a
  # controller-specific annotation; Gateway API expresses it as a typed `RequestRedirect` filter,
  # which means it has to be a real object.
  httpsRedirect:
    # @schema
    # type: boolean
    # @schema
    # -- Create the redirect route.
    enabled: false

    # @schema
    # type: string
    # @schema
    # -- Listener to bind the redirect to. Must be the plaintext one: attached to every listener
    # the redirect would also apply to the HTTPS listener and loop forever. Defaults to `http`,
    # the name of the listener `create` renders.
    sectionName: ""

    # @schema
    # type: integer
    # @schema
    # -- Redirect status code. `301` or `302`.
    statusCode: 301

  # @schema
  # additionalProperties: true
  # @schema
  # -- TLS for the route's hostname.
  tls:
    # @schema
    # type: boolean
    # @schema
    # -- The hostname is served over HTTPS. Two effects: it adds the HTTPS listener when
    # `create` is set, and it is what the derived external URL takes its scheme from — so set it
    # even when the Gateway is somebody else's and it is their listener terminating TLS.
    # Note `auth.cookie_secure` defaults to true, so sessions are lost over plain HTTP on any
    # host other than `localhost`.
    enabled: false

    # @schema
    # enum: [Terminate, Passthrough]
    # @schema
    # -- TLS mode for the created Gateway's listener.
    mode: Terminate

    # @schema
    # type: array
    # @schema
    # -- Secrets holding the certificate for the created Gateway's listener. Required by
    # `Terminate`: unlike an Ingress there is no convention by which one is looked up from the
    # hostname. Ignored without `create` — otherwise the certificate is the Gateway owner's.
    certificateRefs: []

    # @schema
    # type: object
    # additionalProperties: true
    # @schema
    # -- Implementation-specific TLS options for the created Gateway's listener.
    options: {}

  # @schema
  # type: array
  # @schema
  # -- Listeners for the created Gateway, replacing the derived `http`/`https` pair entirely.
  listeners: []

  # @schema
  # type: integer
  # @schema
  # -- Port for the derived HTTP listener.
  httpPort: 80

  # @schema
  # type: integer
  # @schema
  # -- Port for the derived HTTPS listener.
  httpsPort: 443

  # @schema
  # type: array
  # @schema
  # -- Addresses requested for the created Gateway, e.g. a fixed `IPAddress`.
  addresses: []

  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Which routes may attach to the created Gateway's listeners. Defaults to `Same`.
  allowedRoutes: {}

  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- `infrastructure.labels` / `infrastructure.annotations` for the created Gateway, passed
  # through to the load balancer the implementation provisions. Where Cilium's LB-IPAM
  # annotations go.
  infrastructure: {}

  # @schema
  # additionalProperties: true
  # @schema
  # -- A second route publishing the API on its own hostname, for split-origin clients.
  # Enabling it means the browser origin no longer matches the API origin, so CORS,
  # `auth.webauthn_origin` and cookie `SameSite` all have to be set consistently or logins
  # break in ways that only appear at runtime.
  api:
    # @schema
    # type: boolean
    # @schema
    # -- Create the API HTTPRoute.
    enabled: false

    # @schema
    # type: string
    # @schema
    # -- Hostname the API is served on.
    host: ""

    # @schema
    # type: array
    # @schema
    # -- Filters applied to the API route.
    filters: []

    # @schema
    # type: object
    # additionalProperties: true
    # @schema
    # -- Timeouts for the API route.
    timeouts: {}

    # @schema
    # type: object
    # additionalProperties: true
    # @schema
    # -- Annotations for the API HTTPRoute.
    annotations: {}

# @schema
# additionalProperties: true
# @schema
# -- What the frontend's Content-Security-Policy concedes to Cloudflare, one flag per product.
# Both default off and both belong off on a deployment that is not behind Cloudflare: each admits
# something the policy otherwise refuses, and an unused concession is only a weakness. Nothing
# else Cloudflare's bot products need is opened here — the `/cdn-cgi/challenge-platform/` scripts
# and their beacons are same-origin, so `script-src 'self'` and `connect-src 'self'` already
# cover them. These are the only two things `'self'` can never reach.
cloudflare:
  # @schema
  # type: boolean
  # @schema
  # -- Send a freshly minted `'nonce-…'` in `script-src` on every response. Set this when the zone
  # runs Bot Fight Mode, JavaScript Detections or the challenge platform: each injects an inline
  # `<script>` at the edge, *after* the frontend has hashed the shell, so `script-src` refuses it
  # and the detection silently never runs. Cloudflare reads the nonce out of the response header
  # and copies it onto what it injects, so nothing is stamped into the shell and the shell's own
  # inline scripts keep being admitted by hash. Decide this rather than setting it by default: an
  # injected script that can already run could read the header back off a same-origin fetch and
  # admit further inline script. It cannot forge a nonce ahead of time (128 CSPRNG bits, minted
  # per response) and it still reaches neither `'unsafe-eval'` nor an off-origin host — but that
  # argument rests on the shell being served `Cache-Control: no-cache`, so **do not put an edge
  # cache in front of the shell**. A cached shell pins one nonce across every reader for the
  # lifetime of the entry, which is `'unsafe-inline'` with extra steps.
  scriptNonce: false

  # @schema
  # type: boolean
  # @schema
  # -- Admit `https://challenges.cloudflare.com` in `script-src` and `frame-src`, for a Turnstile
  # widget embedded **in** a page the frontend serves. One flag reaches both directives because
  # Turnstile loads `api.js` and then frames the widget from that same host; admitting the script
  # without the frame renders an empty box. A managed-challenge interstitial needs nothing here —
  # it is a Cloudflare-served document carrying its own policy. `frame-ancestors 'none'` is
  # untouched: this app framing the widget is the opposite direction from this app being framed.
  turnstile: false

# @schema
# additionalProperties: true
# @schema
# -- Operator-published legal documents, served unauthenticated by the API at `/v1/legal` and
# `/v1/legal/{slug}`; the frontend's footer builds its Legal column from that index. Upstream
# ships none of these on purpose — every deployment is a different operator under different law,
# and an imprint is a statutory requirement in some jurisdictions and meaningless in others. With
# no documents the index is empty and the footer publishes no Legal column at all, rather than
# links that 404.
legal:
  # @schema
  # type: string
  # @schema
  # -- Directory relative `sources` paths resolve against, and where the chart mounts any
  # document supplied through `content`. An absolute `sources` path ignores it.
  dir: /etc/tankovault/legal

  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Published documents, keyed by the URL slug they are served under. Each document names its
  # body exactly once, in one of three ways, and the chart refuses a document that names it
  # twice or not at all:
  #
  # - `content`: a locale-keyed map of the text itself. The chart writes it into a ConfigMap as
  #   `<slug>.<locale>.md` and mounts it into the API pod. Edits are picked up without a restart —
  #   the service re-reads behind an mtime check — so this is the option to reach for by default.
  # - `sources`: a locale-keyed map of file paths you have arranged to mount yourself, through
  #   `extraVolumes`/`extraVolumeMounts`. Use this when the texts belong to a Secret, a PVC or
  #   another chart.
  # - `url`: an absolute `http(s)` link to a document hosted elsewhere. Mounts nothing.
  #
  # `title` is a locale-keyed display name, and `updated` a free-form date shown alongside it.
  # Both are optional and independent of how the body is supplied.
  #
  # <details><summary>Example</summary>
  #
  # ```yaml
  # legal:
  #   documents:
  #     terms:
  #       updated: "2026-08-04"
  #       title:
  #         en: Terms of Service
  #         de: Nutzungsbedingungen
  #       content:
  #         en: |
  #           # Terms of Service
  #           ...
  #         de: |
  #           # Nutzungsbedingungen
  #           ...
  #     imprint:
  #       title:
  #         de: Impressum
  #       url: https://example.org/impressum
  # ```
  #
  # </details>
  documents: {}

# @schema
# additionalProperties: true
# @schema
# -- Prometheus integration. Every service serves a scrape on an isolated port, outside the
# request-facing listener and outside its own HTTP metrics middleware.
metrics:
  # @schema
  # type: boolean
  # @schema
  # -- Expose the metrics port on each Service.
  enabled: true

  # @schema
  # type: integer
  # minimum: 1
  # maximum: 65535
  # @schema
  # -- Port the Prometheus exposition is served on.
  port: 9090

  # @schema
  # additionalProperties: true
  # @schema
  serviceMonitor:
    # @schema
    # type: boolean
    # @schema
    # -- Create one ServiceMonitor per service. One per service, not one for the release:
    # the `job` label is the sole identifier of which service emitted a metric, and collapsing
    # them would silently break every per-service rule.
    enabled: false

    # @schema
    # type: string
    # @schema
    # -- Scrape interval.
    interval: 15s

    # @schema
    # type: string
    # @schema
    # -- Scrape timeout.
    scrapeTimeout: 10s

    # @schema
    # type: object
    # additionalProperties: true
    # @schema
    # -- Extra labels, e.g. the `release` label a Prometheus Operator selector requires.
    labels: {}

  # @schema
  # additionalProperties: true
  # @schema
  prometheusRule:
    # @schema
    # type: boolean
    # @schema
    # -- Create a PrometheusRule from the recording and alerting rules under `rules/`.
    enabled: false

    # @schema
    # type: object
    # additionalProperties: true
    # @schema
    # -- Extra labels for the PrometheusRule.
    labels: {}

    # @schema
    # enum: [namespace, none]
    # @schema
    # -- Confine the rules to this release's namespace. A `PrometheusRule` is not scoped to the
    # namespace it lives in, so an unscoped `up{job="api"} == 0` matches an `api` job anywhere
    # Prometheus can see — a second TankoVault release, or anyone else's service that happens to
    # produce the same `job` label, and the two then alert on each other. `namespace` rewrites
    # every rule expression to match only series from this namespace; `none` installs them as
    # written, which is correct when a Prometheus already sets `enforcedNamespaceLabel` and would
    # do the same rewrite itself, and wrong otherwise. Two releases of this chart in *one*
    # namespace cannot be told apart by either mechanism.
    scope: namespace

  # @schema
  # additionalProperties: true
  # @schema
  natsExporter:
    # @schema
    # type: boolean
    # @schema
    # -- Deploy `prometheus-nats-exporter` next to NATS. NATS speaks its own monitoring protocol
    # and no Prometheus exposition, so without this the scan pipeline's queue depth — tasks
    # waiting per provider lane, tasks being redelivered, whether the notifier backlog is
    # draining — is invisible. Nothing the services emit substitutes: they can report tasks handed
    # out, not tasks still sitting in the broker. The rules and dashboard panels that need it are
    # simply empty while it is off, never falsely green.
    enabled: false

    # @schema
    # type: string
    # @schema
    # -- NATS monitoring endpoint to scrape. Defaults to the bundled NATS' `:8222`. This is not
    # the client URL: `externalNats.url` points at 4222 and speaks the NATS protocol, while the
    # exporter reads HTTP on the monitoring listener, so an external NATS needs this set
    # explicitly — e.g. `http://nats.example.com:8222`.
    url: ""

    # @schema
    # additionalProperties: true
    # @schema
    image:
      # @schema
      # type: string
      # @schema
      # -- Image repository.
      repository: natsio/prometheus-nats-exporter

      # @schema
      # type: string
      # @schema
      # -- Image tag, pinned by digest.
      tag: 0.20.1@sha256:4fbf6dacb84780a45a1c3af9b1080c69451a288d20902deae671b80717bb8f61

    # @schema
    # enum: ["", nano, micro, small, medium, large]
    # @schema
    # -- Resource t-shirt size. The exporter polls two JSON endpoints and re-serves them; it does
    # no work proportional to traffic.
    resourcesPreset: nano

  # @schema
  # additionalProperties: true
  # @schema
  dashboard:
    # @schema
    # type: boolean
    # @schema
    # -- Create a ConfigMap holding the upstream Grafana overview dashboard.
    enabled: false

    # @schema
    # type: string
    # @schema
    # -- Label a Grafana sidecar watches for dashboard ConfigMaps. The sidecar only picks the
    # ConfigMap up if Grafana is configured to look in this namespace — its own by default.
    # Either set `sidecar.dashboards.searchNamespace` to `ALL` on the Grafana release, or use
    # `grafanaOperator` below, which carries the cross-namespace grant on the dashboard itself.
    label: grafana_dashboard

    # @schema
    # type: string
    # @schema
    # -- Value for that label.
    labelValue: "1"

    # @schema
    # additionalProperties: true
    # @schema
    grafanaOperator:
      # @schema
      # type: boolean
      # @schema
      # -- Also create one `GrafanaDashboard` per dashboard, for clusters running grafana-operator
      # v5. Unlike the sidecar ConfigMap, whose discovery is a property of the *Grafana* release,
      # a `GrafanaDashboard` declares its own reach, so a Grafana in another namespace can import
      # it without cluster-wide sidecar configuration. The CRs reference the ConfigMap through
      # `configMapRef` rather than inlining the JSON, so `dashboard.enabled` must stay true.
      # Requires the `grafana.integreatly.org/v1beta1` CRDs; rendering fails loudly without them.
      enabled: false

      # @schema
      # type: boolean
      # @schema
      # -- Let the CRs bind to Grafana instances outside this namespace. This is the entire point
      # of the operator path: with `false` the operator only considers Grafana CRs in this
      # release's own namespace, and a Grafana living elsewhere never imports the dashboard.
      allowCrossNamespaceImport: true

      # @schema
      # type: object
      # additionalProperties: true
      # @schema
      # -- Label selector for the Grafana instances to import into. Must select something: an
      # empty selector matches no instance, which the chart refuses rather than rendering a CR
      # that reconciles into nothing.
      instanceSelector:
        matchLabels:
          dashboards: grafana

      # @schema
      # type: string
      # @schema
      # -- Folder to file the dashboards under. Empty leaves them at the Grafana root.
      folder: ""

      # @schema
      # type: string
      # @schema
      # -- How often the operator re-reconciles the dashboard, undoing edits made in the Grafana
      # UI. A Go duration.
      resyncPeriod: 5m

# @schema
# additionalProperties: true
# @schema
# -- NetworkPolicies. Default-deny per service, then exactly the peers each one needs. Written
# per service rather than through the `common` builder, which cannot express pod-to-pod rules
# between nine workloads.
networkPolicy:
  # @schema
  # type: boolean
  # @schema
  # -- Create NetworkPolicies.
  enabled: false

  # @schema
  # enum: [kubernetes, cilium, both]
  # @schema
  # -- Which policy dialect to render. `kubernetes` emits the portable `networking.k8s.io/v1`
  # objects; `cilium` emits `CiliumNetworkPolicy`, which can express FQDN destinations, named
  # entities and L7 rules that the portable API cannot; `both` emits both, for the window in
  # which a cluster is migrating between CNIs.
  #
  # Both dialects are rendered from the same derived topology, so they cannot describe different
  # graphs — the engine picks how the rules are written, never what they are.
  engine: kubernetes

  # @schema
  # additionalProperties: true
  # @schema
  # -- Selectors matching the Gateway API data plane, allowed to reach the frontend (and the API
  # when `gateway.api.enabled` is set). Left empty they are derived from `gateway.parentRefs`:
  # the namespace of the first parent, and `gateway.networking.k8s.io/gateway-name` — the label
  # Cilium, Envoy Gateway, Istio and NGINX Gateway Fabric all put on the pods they provision.
  #
  # Restating the Gateway's identity here would be a second place to edit on a rename, and a
  # policy naming the wrong Gateway looks correct and blocks all inbound traffic.
  gateway:
    # @schema
    # type: object
    # additionalProperties:
    #   type: string
    # @schema
    # -- Namespace selector matching the Gateway's data plane. Empty derives it.
    namespaceSelector: {}

    # @schema
    # type: object
    # additionalProperties:
    #   type: string
    # @schema
    # -- Pod selector matching the Gateway's data plane. Empty derives it.
    podSelector: {}

  # @schema
  # additionalProperties: true
  # @schema
  ingressController:
    # @schema
    # type: object
    # additionalProperties:
    #   type: string
    # @schema
    # -- Namespace selector matching the ingress controller, allowed to reach the frontend.
    namespaceSelector: {}

    # @schema
    # type: object
    # additionalProperties:
    #   type: string
    # @schema
    # -- Pod selector matching the ingress controller.
    podSelector: {}

  # @schema
  # additionalProperties: true
  # @schema
  monitoring:
    # @schema
    # type: object
    # additionalProperties:
    #   type: string
    # @schema
    # -- Namespace selector matching Prometheus, allowed to reach the metrics port.
    namespaceSelector: {}

  # @schema
  # type: array
  # items:
  #   type: string
  # @schema
  # -- Egress CIDRs treated as "the internet". The worker scrapes provider sites, sync talks to
  # AniList and the notifier reaches SMTP and webhook endpoints, so these tiers need it.
  # RFC1918 ranges and the cloud metadata endpoint are excluded automatically.
  internetCidrs:
    - 0.0.0.0/0

  # @schema
  # type: array
  # items:
  #   $ref: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.0/_definitions.json#/definitions/io.k8s.api.networking.v1.NetworkPolicyIngressRule
  # @schema
  # -- Extra ingress rules appended to every service's policy.
  extraIngress: []

  # @schema
  # type: array
  # items:
  #   $ref: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.0/_definitions.json#/definitions/io.k8s.api.networking.v1.NetworkPolicyEgressRule
  # @schema
  # -- Extra egress rules appended to every service's policy.
  extraEgress: []

  # @schema
  # additionalProperties: true
  # @schema
  # -- Cilium-only additions, used when `engine` is `cilium` or `both`. The whole topology above
  # is rendered into the CiliumNetworkPolicies automatically; these are the rules the portable API
  # has no way to express.
  #
  # Note that `extraIngress` and `extraEgress` above are *not* carried over: those are verbatim
  # `networking.k8s.io/v1` rule objects and are not valid CNP. The fields below are their
  # counterparts.
  cilium:
    # @schema
    # type: string
    # @schema
    # -- `spec.description`, which Cilium surfaces in `cilium policy get` and in Hubble flow
    # verdicts. The one place to record why a rule exists where an operator debugging a drop
    # will actually see it.
    description: ""

    # @schema
    # additionalProperties: true
    # @schema
    # -- Cilium-only ingress rules, added to every service's policy.
    ingress:
      # @schema
      # type: array
      # items:
      #   type: string
      # @schema
      # -- Named source sets, e.g. `cluster`, `host`, `remote-node`, `kube-apiserver`.
      fromEntities: []

    # @schema
    # additionalProperties: true
    # @schema
    # -- Cilium-only egress rules.
    egress:
      # @schema
      # type: array
      # @schema
      # -- The hosts the internet-facing tiers may reach, by name: `- matchName: api.anilist.co`
      # or `- matchPattern: "*.example.com"`. Set, this *replaces* the `internetCidrs` rule for
      # every service that carries it — `worker`, `sync`, `notifier`, `render` and the bundled
      # TRAWL. That is the point: `0.0.0.0/0` on 443 permits every public host that exists, and
      # a scraping tier is precisely the one you do not want holding that.
      #
      # Emitting both would leave the broad rule in place and make this one decorative, so it is
      # a substitution rather than an addition.
      toFQDNs: []

      # @schema
      # type: array
      # items:
      #   $ref: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.0/_definitions.json#/definitions/io.k8s.api.networking.v1.NetworkPolicyPort
      # @schema
      # -- Ports the `toFQDNs` rule allows. Defaults to TCP/443. SMTP submission needs 587 here
      # if `notifier` sends mail directly.
      fqdnPorts: []

      # @schema
      # type: array
      # @schema
      # -- L7 HTTP rules layered onto the `toFQDNs` rule, e.g. `- method: GET` / `path: "/v1/.*"`.
      # Costs a proxy hop per connection.
      httpRules: []

      # @schema
      # type: array
      # items:
      #   type: string
      # @schema
      # -- Named destination sets added to every policy, e.g. `kube-apiserver`.
      toEntities: []

      # @schema
      # type: array
      # items:
      #   $ref: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.0/_definitions.json#/definitions/io.k8s.api.networking.v1.NetworkPolicyPort
      # @schema
      # -- Restrict the `toEntities` rule to specific ports. Empty means all ports.
      entityPorts: []

      # @schema
      # type: array
      # @schema
      # -- What the DNS proxy may resolve, e.g. `- matchPattern: "*.example.com"`. Defaults to
      # everything, which only permits the lookup — an answer is still only reachable if some
      # rule allows the address.
      dnsMatchPatterns: []

    # @schema
    # type: array
    # @schema
    # -- Extra ingress rules in CiliumNetworkPolicy form, appended to every service's policy.
    extraIngress: []

    # @schema
    # type: array
    # @schema
    # -- Extra egress rules in CiliumNetworkPolicy form, appended to every service's policy.
    extraEgress: []

# @schema
# additionalProperties: true
# @schema
serviceAccount:
  # @schema
  # type: boolean
  # @schema
