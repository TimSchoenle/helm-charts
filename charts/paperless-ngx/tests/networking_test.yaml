suite: service, ingress and route
templates:
  - service.yaml
  - ingress.yaml
  - httproute.yaml
  - persistentvolumeclaim.yaml
set:
  paperless.secretKey: ci-secret-key
tests:
  - it: publishes one HTTP port inside the cluster
    template: service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 8000
      - equal:
          path: spec.ports[0].targetPort
          value: http
      # Not `common.selectorLabels`: that also matches the bundled Valkey, PostgreSQL, Gotenberg
      # and Tika pods, which would put a database behind the web UI.
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: paperless-ngx
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: server

  - it: pins a node port only where one is honoured
    set:
      service.type: NodePort
      service.nodePort: 30800
    template: service.yaml
    asserts:
      - equal:
          path: spec.ports[0].nodePort
          value: 30800

  - it: ignores a node port on a ClusterIP Service
    set:
      service.nodePort: 30800
    template: service.yaml
    asserts:
      - notExists:
          path: spec.ports[0].nodePort

  - it: creates no Ingress by default
    template: ingress.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: publishes the Service on the configured hostname
    set:
      ingress.enabled: true
      ingress.host: paperless.example.com
      ingress.className: nginx
      ingress.annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: 100m
    template: ingress.yaml
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: spec.rules[0].host
          value: paperless.example.com
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-paperless-ngx
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 8000
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-body-size"]
          value: 100m
      - notExists:
          path: spec.tls

  - it: names the certificate cert-manager would create
    set:
      ingress.enabled: true
      ingress.host: paperless.example.com
      ingress.tls.enabled: true
    template: ingress.yaml
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: RELEASE-NAME-paperless-ngx-tls
      - equal:
          path: spec.tls[0].hosts[0]
          value: paperless.example.com

  - it: templates the hostname
    set:
      ingress.enabled: true
      ingress.host: "{{ .Release.Name }}.example.com"
    template: ingress.yaml
    asserts:
      - equal:
          path: spec.rules[0].host
          value: RELEASE-NAME.example.com

  - it: creates no route by default
    template: httproute.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: attaches a route to a Gateway somebody else owns
    set:
      gateway.enabled: true
      gateway.hostnames:
        - paperless.example.com
      gateway.parentRefs:
        - name: shared
          namespace: gateways
      gateway.timeouts:
        request: 300s
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
    template: httproute.yaml
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: spec.parentRefs[0].name
          value: shared
      - equal:
          path: spec.parentRefs[0].namespace
          value: gateways
      - equal:
          path: spec.hostnames[0]
          value: paperless.example.com
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: RELEASE-NAME-paperless-ngx
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 8000
      - equal:
          path: spec.rules[0].timeouts.request
          value: 300s

  # The redirect route has to bind to the plaintext listener by name: bound to all of them, the
  # HTTPS listener would redirect to itself forever.
  - it: creates its own Gateway and a redirect bound to the plaintext listener
    set:
      gateway.enabled: true
      gateway.create: true
      gateway.gatewayClassName: cilium
      gateway.hostnames:
        - paperless.example.com
      gateway.tls.enabled: true
      gateway.tls.certificateRefs:
        - name: paperless-tls
      gateway.httpsRedirect.enabled: true
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
    template: httproute.yaml
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: Gateway
        documentIndex: 0
      - equal:
          path: spec.gatewayClassName
          value: cilium
        documentIndex: 0
      - equal:
          path: spec.listeners[1].tls.certificateRefs[0].name
          value: paperless-tls
        documentIndex: 0
      - equal:
          path: spec.parentRefs[0].sectionName
          value: http
        documentIndex: 2
      - equal:
          path: spec.rules[0].filters[0].requestRedirect.scheme
          value: https
        documentIndex: 2

  - it: creates one claim per directory, named after it
    template: persistentvolumeclaim.yaml
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: RELEASE-NAME-paperless-ngx-media
        documentIndex: 0
      - equal:
          path: spec.resources.requests.storage
          value: 20Gi
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-paperless-ngx-data
        documentIndex: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-paperless-ngx-consume
        documentIndex: 2

  - it: creates no claim for a directory backed by an existing one
    set:
      persistence.consume.existingClaim: scanner-dropbox
    template: persistentvolumeclaim.yaml
    asserts:
      - hasDocuments:
          count: 2

  - it: keeps the archive on an uninstall when asked to
    set:
      persistence.media.annotations:
        helm.sh/resource-policy: keep
    template: persistentvolumeclaim.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: disables dynamic provisioning on request
    set:
      persistence.media.storageClassName: "-"
    template: persistentvolumeclaim.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.storageClassName
          value: ""
