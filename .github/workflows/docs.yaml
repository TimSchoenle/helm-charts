name: Docs

# The drift gate for the root README on the default branch, and for a fork's pull request.
#
# Rendering happens in the Documentation job of `generate.yaml`, and `generate-commit.yaml` commits
# the result back to a same-repository pull request branch. The Generated Files check holds every
# pull request while that commit is pending, a fork's included; this workflow adds the check after
# merge, and a fork's pull request gets a second, more specific failure naming the README. It
# renders with `check: true`, writes nothing, and fails when the committed README.md does not match
# its template.
#
# Kept out of `generate.yaml` because that workflow is pull-request-only by design. Adding a
# `push: main` trigger there to reach this one check would run every generator on every merge.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    name: readme
    # Same-repo pull requests are covered by Generate and Generate Commit, which
    # fix the file instead of reporting it. Running here as well would fail every pull request that
    # legitimately edits the template, in the window before that commit lands.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to checkout code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: $/.github/actions/setup-toolchain

      # The same two steps `generate.yaml` renders from, in the same order and with the same inputs. A
      # difference between them would make this gate fail on a README the render job just wrote.
      - name: Collect chart metadata
        id: chart-index
        run: |
          set -euo pipefail
          index="$(just chart-index)"
          echo "json=${index}" >> "$GITHUB_OUTPUT"

      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-common-readme-variables-v2.1.3
        with:
          manifest: charts/common/Chart.yaml
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.chart-index.outputs.json }}

      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-common-render-template-v3.0.3
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}
          check: 'true'
