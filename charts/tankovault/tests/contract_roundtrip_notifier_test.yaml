  # Contract keys carrying no case, and why. An unexplained absence is indistinguishable from an
  # oversight, so every one of them is named here rather than simply left out.
  #
  # channels.discord_webhook_url: `secret: true`: the probe would be committed to this
  #                               repository, and a credential-shaped value in a test file is a
  #                               credential
  # channels.email_to: `structured`: the keys beneath it are the operator's own names, so the
  #                    contract describes the container and not its contents and no probe
  #                    addresses a leaf
  # channels.webhook_url: `secret: true`: the probe would be committed to this repository, and a
  #                       credential-shaped value in a test file is a credential
  # database.url: `secret: true`: the probe would be committed to this repository, and a
  #               credential-shaped value in a test file is a credential
  # email.password: `secret: true`: the probe would be committed to this repository, and a
  #                 credential-shaped value in a test file is a credential
  # email.url: `secret: true`: the probe would be committed to this repository, and a
  #            credential-shaped value in a test file is a credential
  # internal.caller.token: `secret: true`: the probe would be committed to this repository, and
  #                        a credential-shaped value in a test file is a credential
  # internal.peers: `structured`: the keys beneath it are the operator's own names, so the
  #                 contract describes the container and not its contents and no probe addresses
  #                 a leaf
  # internal.token: `secret: true`: the probe would be committed to this repository, and a
  #                 credential-shaped value in a test file is a credential
  # nats.url: `secret: true`: the probe would be committed to this repository, and a
  #           credential-shaped value in a test file is a credential
  # security.cors.allowed_origins: `structured`: the keys beneath it are the operator's own
  #                                names, so the contract describes the container and not its
  #                                contents and no probe addresses a leaf
  # telemetry.sentry.breadcrumb_level: `unknown`: the producer publishes no constraint for this
  #                                    key, so no probe can be known-valid
  # telemetry.sentry.capture_level: `unknown`: the producer publishes no constraint for this
  #                                 key, so no probe can be known-valid
  # telemetry.sentry.dsn: `secret: true`: the probe would be committed to this repository, and a
  #                       credential-shaped value in a test file is a credential
  # telemetry.sentry.sample_rate: `unknown`: the producer publishes no constraint for this key,
  #                               so no probe can be known-valid
  # telemetry.sentry.traces_sample_rate: `unknown`: the producer publishes no constraint for
  #                                      this key, so no probe can be known-valid
