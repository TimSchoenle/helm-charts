{{- /*
One ConfigMap per service rather than one shared ConfigMap plus per-service fragments.

The services do support a directory of `*.toml` fragments merged in name order, but relying on
that would put the precedence of a global value against a per-service one inside a merge this
chart does not own or test. Merging in the template instead makes the effective configuration
of each service directly readable with `kubectl get configmap -o yaml`, which is also the
thing an operator wants to look at when a reload does not do what they expected.
*/ -}}
{{- $specs := include "tankovault.serviceSpecs" . | fromYaml -}}
{{- range $service, $spec := $specs }}
{{- if (index $.Values.services $service).enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tankovault.fullname" (dict "ctx" $ "service" $service) }}-config
  namespace: {{ include "common.namespace" $ }}
  labels:
    {{- include "common.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $spec.slug }}
  {{- with (include "common.annotations" $) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  config.toml: |
    {{- include "tankovault.configToml" (dict "ctx" $ "service" $service) | nindent 4 }}
{{- end }}
{{- end }}
