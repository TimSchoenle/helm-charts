# Generated by `just contract-tests`. Do not edit by hand.
#
# Every case below writes one setting into the chart's own value for it — or into
# `services.api.config` where no value is bound to that key — and asserts that it arrives in
# `config.toml`, under the table its contract path names. That is the round trip no other gate
# can see: `just check-config` proves the rendered document satisfies the contract, and a
# document missing a setting entirely satisfies it perfectly.
#
# Chart:       tankovault
# Declaration: charts/tankovault/config-contract.yaml (document `api`)
# Contract:    charts/tankovault/contracts/api.json
# Coverage:    89 of 110 contract keys carry a probe, 24 through the chart's own value
#
# Regenerate with `just contract-tests`. `just check-contract-tests` fails a pull request whose
# committed copy has drifted from the contract it was generated against.

suite: 'contract round trip (api)'

# `just render` installs every chart under a release named after it, and the declaration's
# selector is written against that render. Naming the release the same way here is what makes
# `app.kubernetes.io/instance` carry the value the declaration selects on.
release:
  name: tankovault

# Every case below carries this chart's render prerequisites, the identity case included: chart
# values its own `validateValues` insists on before it will render anything at all. They are
# first-class chart values rather than configuration, and none of them may be written under
# `services.api.config` — a prerequisite there would sit in the tree every case probes, free to
# supply the value the case exists to prove the chart delivered. Unlike a baseline, a
# prerequisite is never dropped for the case it would collide with, because a case without it
# does not render at all; the refusal is what takes that dropping's place.
#
# `tankovault.validateValues` refuses this chart's own default render, and it does so from
# `serviceaccount.yaml` — before any ConfigMap exists for a case to assert against. Every entry
# answers one of its guards, and each is the cheapest answer that keeps all nine documents
# rendered: `internal.identity=token` with both caller tokens, because the default `mtls` needs
# cert-manager's API registered and a CA the render has no way to reach, and because mtls and
# the bundled NATS are refused together — the broker serves plaintext. The tokens are set
# explicitly for the reason `ci/minimal-values.yaml` sets them: `helm template` has no cluster
# to read a generated value back out of, so an empty one renders differently on every invocation
# and the suite's own `set` block would be the only stable thing in the diff. `auth.jwtSecret`
# is set for that reason alone. `postgresql.enabled`, `nats.enabled` and `trawl.enabled` bring
# up the bundled datastores the enabled services require — a database for everything, JetStream
# for the worker and the control plane, a solver backend for the challenge solver.
# `anilist.clientId`, `anilist.clientSecret` and `anilist.redirectUri` are what
# `services.sync.enabled` demands. `services.render.enabled` is the one service off by default,
# and without it the `render` document has no ConfigMap and its whole suite would assert against
# nothing. None of these is a credential. The AniList pair identifies an application registered
# with a third party and these values identify none; the tokens and the JWT secret mean nothing
# outside a release that does not exist; and `.invalid` is reserved by RFC 2606 and can never
# resolve. No key any of them occupies carries a case in these suites either — every one is
# `secret: true` in the contract, which the generator refuses to synthesise a probe for. The
# last three answer guards that gate a whole *table* rather than the render. `[email]` is
# written only when `email.host` or a base URL is set, so without a host the six `email.*` cases
# assert against a block that is not there. `[legal]` is written only when at least one document
# is published, which is what `legal.dir` needs to appear beside. And `branding.wordmark.accent`
# is refused without `branding.wordmark.lead` — the accent half is only ever drawn beside a lead
# half. Each of the three is a chart value a case probing *it* then collides with, and the
# generator answers that by routing those probes back into the raw tree rather than by dropping
# the prerequisite. `existingSecret` answers one more guard, and a different one. Every
# `telemetry.sentry.*` key carries a `when telemetry.sentry.enabled` clause, so a case probing
# one switches Sentry on for the whole release — and the chart then refuses the render unless a
# DSN is available. Naming a Secret satisfies that without a credential-shaped string in a
# committed file, and changes nothing any case asserts against: the DSN travels as a file in the
# secrets directory and never reaches a `config.toml`. The Secret does not have to exist for a
# template render. It also takes over the generation of every other credential this chart would
# otherwise write, which is why the tokens and the JWT secret above are still set explicitly:
# with `existingSecret` the chart fills in nothing, and the values are what the guards read. The
# probe root still wins over everything these values derive: each service's own `config` block
# is the last layer `tankovault.configToml` merges, so a probe written there outranks the wiring
# the chart builds from the values above.
tests:
  # Every case below selects its document by the key it carries and by
  # `app.kubernetes.io/component: api`, because this chart renders `config.toml` into more than
  # one document and the key on its own identifies all of them at once. The labels on their own
  # would not do it either — they are on the workload and its Service as well — so the two are
  # spelled as one JSONPath filter, which is what helm-unittest's single-matcher selector has
  # room for. This case is what ties that selection back to the declaration: the object holding
  # `config.toml` has to be the ConfigMap the declaration names, carrying the labels the
  # declaration selects on.
  - it: renders config.toml on the ConfigMap the declaration selects
    documentSelector:
      path: '$[?(@.metadata.labels["app.kubernetes.io/component"]=="api")].data["config.toml"]'
    set:
      anilist.clientId: probe-anilist-client-id
      anilist.clientSecret: probe-anilist-client-secret
      anilist.redirectUri: 'https://render-prerequisite.invalid/account/anilist-callback'
      auth.jwtSecret: probe-jwt-secret-0123456789abcdef0123
      branding.wordmark.lead: Render
      email.host: smtp.render-prerequisite.invalid
      existingSecret: tankovault-contract-probe
      internal.identity: token
      internal.tokens.api: probe-internal-token-api-0123456789ab
      internal.tokens.worker: probe-internal-token-worker-01234567
      legal.documents: {"render-prerequisite": {"url": "https://render-prerequisite.invalid/legal"}}
      nats.enabled: true
      postgresql.auth.password: probe-postgresql-password
      postgresql.enabled: true
      services.render.enabled: true
      trawl.enabled: true
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: api

