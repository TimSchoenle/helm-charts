name: Generate Commit

# Commits what `Generate` produced on a pull request. A pull_request run executes the pull request's
# own copy of its workflow, so a job there holding the maintenance App's key hands it to anyone who
# can push a branch. This workflow_run job runs the default branch's copy, which a pull request
# cannot change, and only reads the merged patch the Generated Files job uploaded:
# common/commit-generated-files finds it without a secret, mints the App token only when there is
# something to commit, and commit-patch refuses anything outside allowed_paths or made from another
# head. Nothing from the branch executes.

on:
  workflow_run:
    workflows: ['Generate']
    types: [completed]

# One queue per pull request branch, keyed on the head repository too. Runs wait rather than
# cancel: an older run completing late (a re-run, say) must not drop the run for the current head,
# and its own patch is skipped as branch_moved by commit-patch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}:${{ github.event.workflow_run.head_branch }}
  queue: max

permissions: {}

jobs:
  commit:
    name: Commit Generated Files
    # The action checks the same again, but only once the job holds the environment's secrets. A
    # push, this repository's default branch or a cancelled run never reaches the environment. A
    # fork's run does: the action commits to it only while its pull request allows edits by
    # maintainers, so this job must hold nothing but the action.
    if: >-
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.head_repository.full_name != github.repository ||
        github.event.workflow_run.head_branch != github.event.repository.default_branch)
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # to list and download the pull_request run's artifacts
      contents: read # to fetch the commit the patch applies to
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # The allowlist is every file a generator in generate.yaml writes, and nothing else:
      #
      #   charts/*/Chart.yaml           both version bumps, the `kubeVersion` floor
      #   charts/*/values.yaml          the schema repins, the contract `@schema` blocks, helm-schema's
      #                                 schema reference
      #   charts/*/values.schema.json   `just schema`, and the repins
      #   charts/*/README.md            helm-docs
      #   charts/*/README.md.gotmpl     the contract sync's credential reference
      #   charts/*/contracts/**/*.json  the contract sync's refreshed contracts, at any depth a
      #                                 chart's `images[].contract` names
      #   charts/*/tests/contract_roundtrip_*_test.yaml
      #                                 `just contract-tests`, and only its suites: the hand-written
      #                                 tests beside them are never a generator's to change
      #   .github/testdata/common-fixture/Chart.yaml  the library pin `bump-common-version` moves
      #   README.md                     the chart index
      #
      # A generator that starts writing another file fails this step until the line is added here.
      - name: Commit Generated Files
        uses: TimSchoenle/actions/actions/common/commit-generated-files@0701d3b35ad7e10e3159471c82f4743b67fdc01f # tag=actions-common-commit-generated-files-v1.2.4
        with:
          client_id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private_key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          allowed_paths: >-
            charts/*/Chart.yaml
            charts/*/values.yaml
            charts/*/values.schema.json
            charts/*/README.md
            charts/*/README.md.gotmpl
            charts/*/contracts/**/*.json
            charts/*/tests/contract_roundtrip_*_test.yaml
            .github/testdata/common-fixture/Chart.yaml
            README.md
          commit_message: 'docs: update Helm chart documentation and schemas'
