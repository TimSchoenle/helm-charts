suite: test pod hardening
# kube-linter covers most of the restricted Pod Security Standard, but it has no template for
# seccomp, so that one is only ever asserted here.
templates:
  - deployment.yaml
  - postgresql.yaml
  - nats.yaml
  - valkey.yaml
  - trawl.yaml
  - job-seed.yaml
values:
  - ../ci/bundled-datastores-values.yaml
tests:
  - it: runs every TankoVault workload as the image's numeric nonroot user
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1001
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: gives the bootstrap Jobs the same identity, so they can read the projected credentials
    # The credentials are projected at mode 0400 and owned by root; only `fsGroup` makes them
    # readable to the image's UID 1001. A Job rendered without it fails on the first key it
    # opens with `Permission denied (os error 13)`, which is what a missing `fsGroup` looks
    # like from inside the container.
    template: job-seed.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1001
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 1001
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1001

  - it: drops every capability and forbids privilege escalation
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: [ALL]

  - it: hardens the bundled PostgreSQL too
    template: postgresql.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 999

  - it: hardens the bundled NATS
    template: nats.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: hardens the bundled Valkey
    template: valkey.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: gives TRAWL an explicit numeric UID
    # Its image declares no USER at all, so it would run as root and the kubelet would refuse
    # the pod outright on runAsNonRoot.
    template: trawl.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: gives TRAWL a writable HOME and /dev/shm without giving up the read-only root filesystem
    # Camoufox is a full Firefox: it writes its profile and caches under HOME, and needs far
    # more shared memory than the 64Mi Kubernetes provides by default.
    template: trawl.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HOME
            value: /home/trawl
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: home
            mountPath: /home/trawl
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: dshm
            mountPath: /dev/shm
      - contains:
          path: spec.template.spec.volumes
          content:
            name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 1Gi

  - it: gives TRAWL a writable addons directory inside its install directory
    # `camoufox-js` downloads uBlock Origin into `CAMOUFOX_INSTALL_DIR/addons` on every launch
    # unless the directory is already there. Without this the mkdir fails with EROFS on the
    # read-only root and the browser runs without the blocker.
    template: trawl.yaml
    documentIndex: 1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: addons
            mountPath: /opt/camoufox/addons
      - contains:
          path: spec.template.spec.volumes
          content:
            name: addons
            emptyDir:
              sizeLimit: 64Mi

  - it: gives the render tier the writable paths Chromium needs
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-tankovault-render
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 1Gi
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: home
            mountPath: /home/nonroot
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
