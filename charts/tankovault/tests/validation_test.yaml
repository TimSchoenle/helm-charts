suite: test values validation
templates:
  - serviceaccount.yaml
values:
  - ../ci/default.yaml
tests:
  - it: generates a signing secret rather than refusing to render without one
    set:
      auth.jwtSecret: ""
    asserts:
      - hasDocuments:
          count: 1

  - it: refuses a signing secret shorter than the service accepts
    set:
      auth.jwtSecret: "too-short"
    asserts:
      - failedTemplate:
          errorPattern: "at least 32 characters"

  - it: generates the per-caller tokens rather than refusing to render without them
    set:
      internal.tokens.api: ""
      internal.tokens.worker: ""
    asserts:
      - hasDocuments:
          count: 1

  - it: refuses an explicit caller token shorter than the service accepts
    # Length is checked in every profile upstream, not only in production, so a short value is
    # a boot failure on every service that reads it.
    set:
      internal.tokens.worker: "too-short"
    asserts:
      - failedTemplate:
          errorPattern: "internal.tokens.worker must be at least 32 characters"

  - it: refuses the removed shared token by name, with the migration path
    # The break this major exists for. Upstream refuses `internal.token` at boot with no
    # dual-accept window, so a release carrying it through would not degrade — every service
    # would fail to start at once. Failing the render turns that into one message.
    set:
      internal.token: "a-perfectly-long-shared-token-value"
    asserts:
      - failedTemplate:
          errorPattern: "internal.token no longer exists"

  # The mTLS checks layer a fixture over `ci/default.yaml`, which is a `token` fixture, so each
  # clears the two tokens it sets — a token left behind under mtls is itself a render failure and
  # would mask the message under test.
  - it: refuses cert-manager issuance without an issuer to sign with
    values:
      - ../ci/internal-mtls.yaml
    set:
      internal.tokens.api: ""
      internal.tokens.worker: ""
      internal.tls.certManager.issuerRef.name: ""
    capabilities:
      apiVersions:
        - cert-manager.io/v1
        - trust.cert-manager.io/v1alpha1
    asserts:
      - failedTemplate:
          errorPattern: "internal.tls.certManager.issuerRef.name"

  - it: refuses cert-manager issuance on a cluster with no cert-manager
    values:
      - ../ci/internal-mtls.yaml
    set:
      internal.tokens.api: ""
      internal.tokens.worker: ""
    asserts:
      - failedTemplate:
          errorPattern: "registers no `cert-manager.io/v1` API"

  - it: needs no cert-manager at all for operator-supplied certificates
    # The point of the second source: mTLS without a controller. No Certificate is rendered, so
    # no CRD is required, and the CA comes out of the keypair Secret the pod already mounts.
    values:
      - ../ci/internal-mtls-existing.yaml
    set:
      internal.tokens.api: ""
      internal.tokens.worker: ""
    asserts:
      - hasDocuments:
          count: 1

  - it: refuses a probe port that collides with the scrape
    # Three listeners in one pod. A collision is not a render error anywhere else — it is a
    # container that binds one, fails on the second with `Address already in use`, and restarts
    # forever.
    values:
      - ../ci/internal-mtls-existing.yaml
    set:
      internal.tokens.api: ""
      internal.tokens.worker: ""
      internal.tls.probePort: 9090
    asserts:
      - failedTemplate:
          errorPattern: "internal.tls.probePort and metrics.port are both 9090"

  - it: refuses a probe port that collides with a request port
    values:
      - ../ci/internal-mtls-existing.yaml
    set:
      internal.tokens.api: ""
      internal.tokens.worker: ""
      internal.tls.probePort: 8083
    asserts:
      - failedTemplate:
          errorPattern: "internal.tls.probePort is 8083, which is also the port sync serves"

  - it: says nothing about the probe port under token identity
    # Nothing binds it in that mode, so a value that would collide under mtls is inert here and
    # refusing it would be refusing a setting that does nothing.
    set:
      internal.tls.probePort: 8083
    asserts:
      - hasDocuments:
          count: 1

  - it: refuses a service with no certificate Secret named
    # A missing Secret is a pod that waits on the volume forever, which is not a failure anybody
    # reads as a configuration mistake.
    values:
      - ../ci/internal-mtls-existing.yaml
    set:
      internal.tokens.api: ""
      internal.tokens.worker: ""
      internal.tls.existingSecrets.notifier: ""
    asserts:
      - failedTemplate:
          errorPattern: "internal.tls.existingSecrets.notifier"

  - it: refuses one certificate Secret shared by two services
    # A service is identified by the SANs on the certificate it presents. Sharing one lets either
    # speak as the other, which collapses exactly the distinction this mode exists to draw.
    values:
      - ../ci/internal-mtls-existing.yaml
    set:
      internal.tokens.api: ""
      internal.tokens.worker: ""
      internal.tls.existingSecrets.render: tankovault-worker-tls
    asserts:
      - failedTemplate:
          errorPattern: "both name \"tankovault-worker-tls\""

  - it: refuses a SAN override that names no service
    values:
      - ../ci/internal-mtls-existing.yaml
    set:
      internal.tokens.api: ""
      internal.tokens.worker: ""
      internal.tls.sans.control-plane: control-plane.tankovault.internal
    asserts:
      - failedTemplate:
          errorPattern: "internal.tls.sans.control-plane names no service"

  - it: refuses a CA object with no name
    values:
      - ../ci/internal-mtls-existing.yaml
    set:
      internal.tokens.api: ""
      internal.tokens.worker: ""
      internal.tls.ca.source: configMap
      internal.tls.ca.name: ""
    asserts:
      - failedTemplate:
          errorPattern: "internal.tls.ca.name"

  - it: refuses a trust bundle it is asked to create with nothing in it
    values:
      - ../ci/internal-mtls.yaml
    set:
      internal.tokens.api: ""
      internal.tokens.worker: ""
      internal.tls.ca.bundle.sources: []
    capabilities:
      apiVersions:
        - cert-manager.io/v1
        - trust.cert-manager.io/v1alpha1
    asserts:
      - failedTemplate:
          errorPattern: "ca.bundle.sources is empty"

  - it: refuses a trust bundle whose ConfigMap nothing would mount
    # trust-manager writes a ConfigMap. Creating one while the pods read their CA from somewhere
    # else leaves an object nobody consumes and a bundle nobody rotates.
    values:
      - ../ci/internal-mtls.yaml
    set:
      internal.tokens.api: ""
      internal.tokens.worker: ""
      internal.tls.ca.source: certificateSecret
    capabilities:
      apiVersions:
        - cert-manager.io/v1
        - trust.cert-manager.io/v1alpha1
    asserts:
      - failedTemplate:
          errorPattern: "bundle.create is set while internal.tls.ca.source"

  - it: refuses two database sources at once
    set:
      postgresql.enabled: true
      externalDatabase.url: postgres://a:b@c:5432/d
    asserts:
      - failedTemplate:
          errorPattern: "exactly one database source"

  - it: refuses no database at all
    set:
      externalDatabase.url: ""
    asserts:
      - failedTemplate:
          errorPattern: "no database configured"

  - it: refuses a partial AniList configuration when sync is enabled
    # The application credentials are issued by AniList; only the encryption key is generatable.
    set:
      anilist.clientSecret: ""
    asserts:
      - failedTemplate:
          errorPattern: "requires the AniList application credentials; missing: anilist.clientSecret"

  - it: does not demand the AniList encryption key it can generate itself
    set:
      anilist.tokenEncryptionKey: ""
    asserts:
      - hasDocuments:
          count: 1

  - it: reports every problem in one failure rather than one per run
    set:
      auth.jwtSecret: "too-short"
      anilist.clientId: ""
    asserts:
      - failedTemplate:
          errorPattern: "(?s)auth.jwtSecret must be at least 32 characters.*anilist.clientId"

  - it: generates a password for a seeded administrator rather than demanding one
    set:
      bootstrap.seedAdmin.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: refuses a challenge solver with no backend
    set:
      externalTrawl.url: ""
    asserts:
      - failedTemplate:
          errorPattern: "requires a solver backend"

  - it: refuses a worker with no NATS to consume from
    set:
      externalNats.url: ""
    asserts:
      - failedTemplate:
          errorPattern: "requires NATS JetStream"

  - it: refuses to publish a privileged service
    # control-plane, sync, render and challenge-solver expose privileged contracts; upstream
    # publishes none of them even on a single host.
    set:
      services.controlPlane.service.type: LoadBalancer
    asserts:
      - failedTemplate:
          errorPattern: "(?s)services.controlPlane.service.type is \"LoadBalancer\".*bypasses the frontend proxy"

  - it: allows publishing a privileged service when explicitly acknowledged
    set:
      services.controlPlane.service.type: LoadBalancer
      allowUnsafeExposure: true
    asserts:
      - hasDocuments:
          count: 1

  - it: refuses Cloudflare CSP concessions with no frontend to serve them
    # The frontend is the only tier that assembles a Content-Security-Policy. Silently accepting
    # the flags would leave an operator believing their edge-injected scripts are admitted.
    set:
      services.frontend.enabled: false
      cloudflare.scriptNonce: true
    asserts:
      - failedTemplate:
          errorPattern: "cloudflare.scriptNonce is set while services.frontend.enabled=false"

  - it: names both Cloudflare flags when both are stranded
    set:
      services.frontend.enabled: false
      cloudflare.scriptNonce: true
      cloudflare.turnstile: true
    asserts:
      - failedTemplate:
          errorPattern: "cloudflare.scriptNonce and cloudflare.turnstile are set"

  - it: stops checking credentials it cannot see
    # With an existingSecret the chart cannot read the values, so it does not guess at them.
    # The topology checks that do not depend on credential contents still apply.
    values:
      - ../ci/existing-secret.yaml
    set:
      externalDatabase.url: ""
      externalRedis.url: ""
    asserts:
      - hasDocuments:
          count: 1

  # A capability guard that skipped the routes instead would render clean in CI — `helm template`
  # reports the built-in API surface but no CRDs — and leave a real install succeeding with the
  # application unreachable.
  - it: refuses Gateway API exposure when the CRDs are absent
    set:
      gateway.enabled: true
      gateway.host: tankovault.example.com
      gateway.tls.enabled: true
      gateway.parentRefs:
        - name: shared-gateway
    asserts:
      - failedTemplate:
          errorPattern: "the cluster registers no `gateway.networking.k8s.io/v1` API"
