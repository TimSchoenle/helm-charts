# vim: set ft=yaml:

# What this chart's rendered configuration must satisfy, and which images decide that.
#
# This chart pins a first-party image and opts out, which `just check-contract-coverage` permits
# only with a written reason — an unexplained absence is indistinguishable from an oversight, and
# the whole point of the coverage gate is that the pipeline cannot be escaped by forgetting.
reason: >-
  None of the nine first-party images publishes a configuration contract yet. This chart is
  also the one the union was designed for — one rendered document under a single TANKOVAULT_
  prefix, read by eight separate binaries whose contracts each cover only the keys they
  consume — so it is the chart worth declaring first once the images ship contracts, and the
  one that will exercise whether the union rules are right. Until then there is nothing to
  union.

documents: []
