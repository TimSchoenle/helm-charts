suite: network policies
templates:
  - networkpolicy.yaml
tests:
  - it: renders nothing when network policies are disabled
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: creates one ingress and one egress policy when enabled
    set:
      networkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: RELEASE-NAME-s3-bucket-perma-link-ingress
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-s3-bucket-perma-link-egress
        documentIndex: 1

  - it: scopes both policies to this release's pods
    set:
      networkPolicy.enabled: true
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
        documentIndex: 0
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
        documentIndex: 1

  # The regression guard for the egress hole this chart shipped before this major version: an egress rule
  # with `ports` but no `to` is read by the NetworkPolicy API as "any destination", so the
  # policy permits traffic to every in-cluster service and to the cloud metadata endpoint.
  - it: scopes every egress rule with a destination selector
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.http.enabled: true
      networkPolicy.egress.https.enabled: true
      networkPolicy.egress.customRules:
        - to:
            - ipBlock:
                cidr: 203.0.113.0/24
          ports:
            - port: 9000
              protocol: TCP
    documentIndex: 1
    asserts:
      - notExists:
          path: spec.egress[?(!@.to)]

  - it: restricts DNS egress to the cluster DNS service
    set:
      networkPolicy.enabled: true
    documentIndex: 1
    asserts:
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: kube-system
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels["k8s-app"]
          value: kube-dns
      - contains:
          path: spec.egress[0].ports
          content:
            port: 53
            protocol: UDP
      - contains:
          path: spec.egress[0].ports
          content:
            port: 53
            protocol: TCP

  - it: excludes private and link-local space from internet egress
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.https.enabled: true
    documentIndex: 1
    asserts:
      - equal:
          path: spec.egress[1].to[0].ipBlock.cidr
          value: 0.0.0.0/0
      # 169.254.169.254 is the cloud instance metadata endpoint.
      - contains:
          path: spec.egress[1].to[0].ipBlock.except
          content: 169.254.0.0/16
      - contains:
          path: spec.egress[1].to[0].ipBlock.except
          content: 10.0.0.0/8
      - contains:
          path: spec.egress[1].to[0].ipBlock.except
          content: 172.16.0.0/12
      - contains:
          path: spec.egress[1].to[0].ipBlock.except
          content: 192.168.0.0/16

  - it: honours a custom internet destination
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.https.enabled: true
      networkPolicy.egress.cidr: 203.0.113.0/24
      networkPolicy.egress.except:
        - 203.0.113.128/25
    documentIndex: 1
    asserts:
      - equal:
          path: spec.egress[1].to[0].ipBlock.cidr
          value: 203.0.113.0/24
      - equal:
          path: spec.egress[1].to[0].ipBlock.except
          value:
            - 203.0.113.128/25

  - it: is default-deny when rules are switched off
    set:
      networkPolicy.enabled: true
      networkPolicy.ingress.enabled: false
      networkPolicy.egress.enabled: false
    asserts:
      - equal:
          path: spec.policyTypes
          value: [Ingress]
        documentIndex: 0
      - isNullOrEmpty:
          path: spec.ingress
        documentIndex: 0
      - equal:
          path: spec.policyTypes
          value: [Egress]
        documentIndex: 1
      - isNullOrEmpty:
          path: spec.egress
        documentIndex: 1

  - it: allows scraping from the monitoring namespace
    set:
      networkPolicy.enabled: true
      networkPolicy.ingress.monitoring.namespace: custom-monitoring
    documentIndex: 0
    asserts:
      # Matched on the label Kubernetes sets on every namespace itself, not on an
      # operator-maintained `name` label that may not exist.
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: custom-monitoring

  - it: allows traffic from the ingress controller
    set:
      networkPolicy.enabled: true
      networkPolicy.ingress.monitoring.enabled: false
      networkPolicy.ingress.controller.namespace: ingress-nginx
      networkPolicy.ingress.controller.selector:
        app.kubernetes.io/name: ingress-nginx
    documentIndex: 0
    asserts:
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: ingress-nginx
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: ingress-nginx

  - it: appends extra rules regardless of the enabled flags
    set:
      networkPolicy.enabled: true
      networkPolicy.ingress.enabled: false
      networkPolicy.egress.enabled: false
      networkPolicy.extraIngress:
        - from:
            - podSelector:
                matchLabels:
                  app: sidecar
      networkPolicy.extraEgress:
        - to:
            - ipBlock:
                cidr: 198.51.100.0/24
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 1
        documentIndex: 0
      - lengthEqual:
          path: spec.egress
          count: 1
        documentIndex: 1


  # The peer that must be admitted is the Gateway the chart's own route attaches to, so it is
  # derived from `gateway.parentRefs` rather than restated here. A policy naming the wrong
  # Gateway looks correct and blocks all inbound traffic.
  - it: derives the gateway peer from the route's parent reference
    documentIndex: 0
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
    set:
      networkPolicy.enabled: true
      gateway.enabled: true
      gateway.hostnames:
        - app.example.com
      gateway.parentRefs:
        - name: shared-gateway
          namespace: gateway-system
    asserts:
      - contains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: gateway-system
                podSelector:
                  matchLabels:
                    gateway.networking.k8s.io/gateway-name: shared-gateway

  - it: falls back to the release namespace for a same-namespace Gateway
    documentIndex: 0
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
    set:
      networkPolicy.enabled: true
      gateway.enabled: true
      gateway.hostnames:
        - app.example.com
      gateway.parentRefs:
        - name: shared-gateway
    asserts:
      - contains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: NAMESPACE
                podSelector:
                  matchLabels:
                    gateway.networking.k8s.io/gateway-name: shared-gateway

  - it: honours an explicit gateway peer
    documentIndex: 0
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
    set:
      networkPolicy.enabled: true
      networkPolicy.ingress.gateway.namespace: envoy-gateway-system
      networkPolicy.ingress.gateway.selector:
        app.kubernetes.io/name: envoy
      gateway.enabled: true
      gateway.hostnames:
        - app.example.com
      gateway.parentRefs:
        - name: shared-gateway
    asserts:
      - contains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: envoy-gateway-system
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: envoy

  - it: omits the gateway peer when the chart is not exposed through a Gateway
    documentIndex: 0
    set:
      networkPolicy.enabled: true
    asserts:
      - notContains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: NAMESPACE
                podSelector: {}


  - it: emits CiliumNetworkPolicies under the cilium engine
    set:
      networkPolicy.enabled: true
      networkPolicy.engine: cilium
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        isKind:
          of: CiliumNetworkPolicy
      - documentIndex: 0
        equal:
          path: apiVersion
          value: cilium.io/v2
      - documentIndex: 0
        equal:
          path: spec.enableDefaultDeny
          value:
            ingress: true
            egress: false

  # A migration setting: the two dialects select the same pod and their allowances union.
  - it: emits both dialects under the both engine
    set:
      networkPolicy.enabled: true
      networkPolicy.engine: both
    asserts:
      - hasDocuments:
          count: 4
      - documentIndex: 0
        isKind:
          of: NetworkPolicy
      - documentIndex: 2
        isKind:
          of: CiliumNetworkPolicy

  # The rule the CIDR-based `egress.https` was always a poor approximation of.
  - it: names egress destinations rather than addressing them
    documentIndex: 1
    set:
      networkPolicy.enabled: true
      networkPolicy.engine: cilium
      networkPolicy.egress.https.enabled: false
      networkPolicy.cilium.egress.toFQDNs:
        - matchName: api.example.com
    asserts:
      - equal:
          path: spec.egress[1].toFQDNs
          value:
            - matchName: api.example.com
      - equal:
          path: spec.egress[1].toPorts[0].ports[0]
          value:
            port: "443"
            protocol: TCP

  # Without the L7 DNS rule Cilium never sees the lookup, so the FQDN rule matches nothing.
  - it: refuses FQDN destinations with the DNS rule turned off
    set:
      networkPolicy.enabled: true
      networkPolicy.engine: cilium
      networkPolicy.egress.dns.enabled: false
      networkPolicy.cilium.egress.toFQDNs:
        - matchName: api.example.com
    asserts:
      - failedTemplate:
          errorPattern: "the FQDN rule matches nothing"
