suite: test the TOML renderer
templates:
  - configmap.yaml
values:
  - ../ci/default.yaml
tests:
  - it: emits every scalar of a table before that table's sub-tables
    # The single rule that makes the difference between a correct file and a silently wrong
    # one: in TOML a key belongs to the most recent [table] header, so a scalar emitted after
    # a sibling sub-table would be reparented into it. Here `security.hsts` must appear before
    # `[security.cors]`, or the service would read it as `security.cors.hsts` and ignore it.
    set:
      config:
        security:
          hsts: true
          cors:
            allowed_origins: ["https://app.example.com"]
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-tankovault-api-config
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: "(?s)\\[security\\]\\nhsts = true.*\\[security\\.cors\\]"

  - it: renders each scalar type the way TOML spells it
    set:
      config:
        database:
          max_connections: 16
        matching:
          high: 0.85
        security:
          hsts: false
        metadata:
          priority:
            description: ["anilist", "adapter"]
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-tankovault-api-config
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: "max_connections = 16\\n"
      - matchRegex:
          path: data["config.toml"]
          pattern: "high = 0\\.85\\n"
      - matchRegex:
          path: data["config.toml"]
          pattern: "hsts = false\\n"
      - matchRegex:
          path: data["config.toml"]
          pattern: 'description = \["anilist","adapter"\]'

  - it: quotes and escapes strings rather than emitting them bare
    set:
      config:
        telemetry:
          log_filter: 'info,tankovault="debug"'
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-tankovault-api-config
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'log_filter = "info,tankovault=\\"debug\\""'

  - it: nests tables with dotted headers
    set:
      config:
        rate_limit:
          auth:
            per_minute: 10
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-tankovault-api-config
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: "\\[rate_limit\\.auth\\]\\nper_minute = 10"

  # `[[providers]]`, with each element's sub-tables following its own header. A header names an
  # absolute path, so `[providers.auth]` belongs to the element it follows rather than to the
  # first one.
  - it: emits an array of tables as [[name]]
    set:
      config:
        providers:
          - name: example
            auth:
              kind: token
          - name: second
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-tankovault-api-config
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[\[providers\]\]\nname = "example"\n\n\[providers\.auth\]\nkind = "token"\n\n\[\[providers\]\]\nname = "second"'

  # The two shapes TOML genuinely cannot spell, which is what `configExtraToml` is still for.
  - it: refuses an array that mixes tables and scalars
    set:
      config:
        providers:
          - name: example
          - plain
    asserts:
      - failedTemplate:
          errorPattern: "mixes tables and scalars in one array"

  - it: refuses an array of arrays
    set:
      config:
        matrix:
          - [1, 2]
          - [3]
    asserts:
      - failedTemplate:
          errorPattern: "holds an array of arrays"

  - it: appends configExtraToml verbatim
    set:
      configExtraToml: |
        [custom]
        verbatim = true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-tankovault-api-config
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: "\\[custom\\]\\nverbatim = true"
