suite: deployment
templates:
  - deployment.yaml
  - configmap.yaml
# The Deployment annotates a checksum of the ConfigMap, so both templates must render; the
# selector keeps every assertion below on the Deployment.
tests:
  - it: creates a Deployment named after the release
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-mp-stats-legacy-viewer

  # The Service targets this port by number, and the probes address it by name.
  - it: exposes the server port as http
    documentSelector:
      path: kind
      value: Deployment
    set:
      server.port: 9090
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - containerPort: 9090
              name: http
              protocol: TCP
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: http

  # The whole point of the migration: the loader refuses a key supplied by both the environment
  # and a file. `MP_STATS_CONFIG` is the only variable left, and it is the one that cannot be
  # file-sourced because it decides what the file layer is.
  - it: passes configuration as a file, not as environment
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: MP_STATS_CONFIG
              value: /etc/mp-stats/config
      - notExists:
          path: spec.template.spec.containers[0].envFrom

  - it: mounts the rendered configuration read-only
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            configMap:
              name: RELEASE-NAME-mp-stats-legacy-viewer
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /etc/mp-stats/config
            readOnly: true

  # The Sentry DSN is the only credential this server reads, so a release that does not report
  # to Sentry has no secrets volume at all — and a configured secrets directory that cannot be
  # read is a boot failure naming the path, not an empty layer.
  - it: names no secrets directory while Sentry is off
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MP_STATS_SECRETS_DIR
            value: /etc/mp-stats/secrets
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: secrets
            mountPath: /etc/mp-stats/secrets
            readOnly: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: secrets
          any: true

  - it: mounts the DSN once Sentry is on
    documentSelector:
      path: kind
      value: Deployment
    set:
      telemetry.sentry.enabled: true
      telemetry.sentry.dsn: https://key@sentry.example.invalid/1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MP_STATS_SECRETS_DIR
            value: /etc/mp-stats/secrets
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: secrets
            mountPath: /etc/mp-stats/secrets
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: secrets
            projected:
              defaultMode: 256
              sources:
                - secret:
                    name: RELEASE-NAME-mp-stats-legacy-viewer
                    optional: true
                    items:
                      - key: telemetry__sentry__dsn
                        path: telemetry__sentry__dsn

  # The chart cannot read an `existingSecret`, so it projects every key it knows how to consume.
  # That list is still gated on the switch, or a release reporting nowhere would mount a file
  # for a client it never installs.
  - it: projects an existing Secret when one is given
    documentSelector:
      path: kind
      value: Deployment
    set:
      telemetry.sentry.enabled: true
      existingSecret: my-sentry-secret
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: secrets
            projected:
              defaultMode: 256
              sources:
                - secret:
                    name: my-sentry-secret
                    optional: true
                    items:
                      - key: telemetry__sentry__dsn
                        path: telemetry__sentry__dsn

  # The server does not reload, so a configuration change has to roll the pod to take effect.
  - it: rolls the pod when the mounted configuration changes
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/configmap"]

  - it: probes the three distinct health endpoints
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /health/startup
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health/live
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health/ready

  # This chart mounts no configuration, so there is nothing to checksum.
  - it: scales to the requested replica count
    documentSelector:
      path: kind
      value: Deployment
    set:
      replicaCount: 2
    asserts:
      - equal:
          path: spec.replicas
          value: 2
