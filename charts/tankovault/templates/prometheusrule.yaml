{{- /*
The recording and alerting rules, vendored verbatim from the upstream repository at
`deploy/observability/prometheus/rules/`.

`PrometheusRule` is already the Prometheus Operator's own CRD, so unlike the dashboards there is
no sidecar path to graduate from — but there is also no per-object cross-namespace grant either.
Which namespaces a Prometheus loads rules from is decided by `ruleNamespaceSelector` and
`ruleSelector` on the Prometheus custom resource, and `metrics.prometheusRule.labels` is what
lets this object match the latter. The rest, including why the rule files are parsed rather than
templated, lives in `common.prometheus.rules.*`.
*/ -}}
{{- if and .Values.metrics.enabled .Values.metrics.prometheusRule.enabled }}
{{- include "common.prometheus.rules.prometheusRule" (dict "ctx" . "values" .Values.metrics.prometheusRule) }}
{{- end }}
