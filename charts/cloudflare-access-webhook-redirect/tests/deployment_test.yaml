suite: deployment
templates:
  - deployment.yaml
  - configmap.yaml
  - secret.yaml
set:
  application.handler.targetBase: https://example.invalid
tests:
  - it: creates a Deployment named after the release
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-cloudflare-access-webhook-redirect

  - it: exposes the server port as http
    documentSelector:
      path: kind
      value: Deployment
    set:
      application.server.port: 9090
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - containerPort: 9090
              name: http
              protocol: TCP

  - it: reads Cloudflare Access credentials from the generated Secret
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLOUDFLARE.CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-cloudflare-access-webhook-redirect
                key: client_id
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLOUDFLARE.CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-cloudflare-access-webhook-redirect
                key: client_secret

  - it: reads them from an existing Secret when one is given
    documentSelector:
      path: kind
      value: Deployment
    set:
      application.cloudflareAccess.secretName: my-access-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLOUDFLARE.CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: my-access-secret
                key: client_id

  # The chart used to declare a `config` volume from the ConfigMap that no container ever
  # mounted; only the /tmp scratch volume should exist.
  - it: mounts no dead volumes
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 1
      - equal:
          path: spec.template.spec.volumes[0].name
          value: tmp

  - it: loads configuration from the ConfigMap and rolls on change
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: RELEASE-NAME-cloudflare-access-webhook-redirect
      - exists:
          path: spec.template.metadata.annotations["checksum/configmap"]

  - it: hands replica count to the autoscaler when one is enabled
    documentSelector:
      path: kind
      value: Deployment
    set:
      autoscaling.enabled: true
    asserts:
      - notExists:
          path: spec.replicas

  - it: sets replicas directly when autoscaling is off
    documentSelector:
      path: kind
      value: Deployment
    set:
      replicaCount: 4
    asserts:
      - equal:
          path: spec.replicas
          value: 4
