name: Auto-Rebase PRs on Push to Main

on:
  push:
    branches:
      - main

# A newer push to main supersedes the sweep for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-auto-rebase
  cancel-in-progress: true

permissions: {}

jobs:
  auto-rebase:
    name: Auto-Rebase
    # The app's secrets belong in the ci environment.
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every call is made with the app token minted below, so this job needs nothing from the
    # ambient `GITHUB_TOKEN`.
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      # An app token rather than `github.token`: GitHub starts no workflows for a commit pushed with
      # `github.token`, so the updated PRs would sit without CI. Scoped to what the action does;
      # without a `permission-*` input the token would inherit the whole installation.
      - name: Generate Token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write # To merge the base branch into the head branch
          permission-pull-requests: write # To list the PRs and request the update

      - name: Update Labelled PRs
        uses: TimSchoenle/actions/actions/maintenance/auto-rebase@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-maintenance-auto-rebase-v3.0.3
        with:
          token: ${{ steps.token.outputs.token }}
          label: 'auto-rebase'
