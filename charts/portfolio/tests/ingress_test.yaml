suite: ingress
templates:
  - ingress.yaml
tests:
  - it: creates no Ingress by default
    asserts:
      - hasDocuments:
          count: 0

  - it: creates an Ingress routing to the Service
    set:
      ingress.enabled: true
      ingress.hosts:
        - host: portfolio.example.com
          paths:
            - path: /
              pathType: Prefix
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: spec.rules[0].host
          value: portfolio.example.com
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-portfolio

  # Resolved from the cluster version rather than hardcoded, so the chart still renders a
  # valid manifest on clusters that predate networking.k8s.io/v1.
  - it: picks the Ingress API version from the cluster
    set:
      ingress.enabled: true
      ingress.hosts:
        - host: portfolio.example.com
          paths:
            - path: /
              pathType: Prefix
    capabilities:
      majorVersion: 1
      minorVersion: 29
    asserts:
      - equal:
          path: apiVersion
          value: networking.k8s.io/v1

  - it: configures TLS
    set:
      ingress.enabled: true
      ingress.hosts:
        - host: portfolio.example.com
          paths:
            - path: /
              pathType: Prefix
      ingress.tls:
        - secretName: portfolio-tls
          hosts:
            - portfolio.example.com
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: portfolio-tls
      - contains:
          path: spec.tls[0].hosts
          content: portfolio.example.com

  - it: supports controller annotations
    set:
      ingress.enabled: true
      ingress.annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      ingress.hosts:
        - host: portfolio.example.com
          paths:
            - path: /
              pathType: Prefix
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: letsencrypt-prod
