# Operator-published legal documents, one served from an inline body and one linked, plus the
# unscoped rule variant that `ci/metrics.yaml` does not cover.
#
# A render fixture, not an install fixture — it runs on external datastores whose endpoints do not
# resolve. Hence the name: `ct install` takes every `ci/*-values.yaml`, while the render and
# policy jobs glob `ci/*.yaml`.
auth:
  jwtSecret: ci-jwt-secret-0123456789abcdef0123
internal:
  # The `token` path. The chart defaults to `mtls`, which needs cert-manager and a CA;
  # `ci/internal-mtls.yaml` is the fixture that renders that one. Both tokens are set explicitly
  # for the same reason `auth.jwtSecret` is — `helm template` has no cluster to read a generated
  # value back out of, so an empty one would render differently on every invocation.
  identity: token
  tokens:
    api: ci-internal-token-api-0123456789abcdef
    worker: ci-internal-token-worker-0123456789ab
anilist:
  clientId: "12345"
  clientSecret: ci-anilist-client-secret
  tokenEncryptionKey: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  redirectUri: https://tankovault.example.com/account/anilist-callback
externalDatabase:
  url: postgres://tankovault:ci@postgresql.example.com:5432/tankovault
externalNats:
  url: nats://nats.example.com:4222
externalTrawl:
  url: http://trawl.example.com:8191

metrics:
  enabled: true
  prometheusRule:
    enabled: true
    # The other half of the scoping switch. `ci/metrics.yaml` exercises the default, where every
    # selector is rewritten; here the rule files must install exactly as vendored, placeholder
    # matcher and all.
    scope: none

legal:
  defaultLocale: en
  documents:
    # Written by the chart into a ConfigMap and projected into the api pod's secrets directory.
    terms:
      order: 1
      updated: "2026-08-04"
      title:
        en: Terms of Service
        de: Nutzungsbedingungen
      body:
        en: |
          # Terms of Service

          Placeholder text for a render fixture. Not suitable for a real deployment.
        de: |
          # Nutzungsbedingungen

          Platzhaltertext für ein Render-Fixture. Nicht für den Produktivbetrieb geeignet.
    # Hosted elsewhere: a link, with nothing to project.
    imprint:
      title:
        de: Impressum
      url: https://example.org/impressum
