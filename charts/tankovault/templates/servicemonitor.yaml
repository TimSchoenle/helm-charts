{{- /*
One ServiceMonitor per service, not one for the release.

`docs/OBSERVABILITY.md` is explicit that the setup uses eight per-service jobs rather than one
job with several targets, because metrics carry no service label and the Prometheus `job` label
is therefore the sole identifier of which service emitted a series — "collapsing them would
silently destroy every per-service rule".

`jobLabel` is what makes that true here and must not be dropped. Without it the Prometheus
Operator sets `job` to the *Service name* (`RELEASE-tankovault-api`), while every vendored rule
matches on the bare slug — `up{job=~"api|frontend"}`, `sum by (job) (...)`. The rules would load
without error and then never fire. Pointing `jobLabel` at `app.kubernetes.io/component`, which
this chart already sets to the slug, makes `job` come out as `api`, `worker`, `control-plane`
and so on, exactly as the rules and the dashboard expect.
*/ -}}
{{- /*
The CRD is not probed here. A capability guard in a template can only *skip*, and skipping is the
one behaviour that must not happen: a release that quietly drops its ServiceMonitors installs
cleanly and is never scraped. The check therefore lives in `tankovault.validateValues`, via
`common.prometheus.operatorErrors`, where it can fail the render with an actionable message
instead. CI renders declare the CRD APIs with `--api-versions`.
*/ -}}
{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
{{- $specs := include "tankovault.serviceSpecs" . | fromYaml }}
{{- range $service, $spec := $specs }}
{{- if (index $.Values.services $service).enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "tankovault.fullname" (dict "ctx" $ "service" $service) }}
  namespace: {{ include "common.namespace" $ }}
  labels:
    {{- include "common.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $spec.slug }}
    {{- with $.Values.metrics.serviceMonitor.labels }}
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  {{- with (include "common.annotations" $) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  jobLabel: app.kubernetes.io/component
  namespaceSelector:
    matchNames:
      - {{ include "common.namespace" $ }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tankovault.name" (dict "ctx" $ "service" $service) }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ $.Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ $.Values.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}
{{- end }}
{{- end }}
