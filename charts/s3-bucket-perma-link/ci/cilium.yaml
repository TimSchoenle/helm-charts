# CiliumNetworkPolicy exposure.
#
# Named without the `-values` suffix on purpose: `ct` globs `ci/*-values.yaml` for `ct install`,
# while the render and kubeconform scripts glob `ci/*.yaml`. The kind cluster CI installs into
# runs no Cilium and has no `cilium.io/v2` CRDs, so an install would fail; this keeps render,
# schema-validation and policy-scan coverage without asking chart-testing to install it.

s3:
  accessKey: "fe47359d4fe04df0a8689fba2358c8d2.access"
  secretKey: "7ae0f15050f34f29b394495331ca28a2"
  host: "s3.amazon.com"
  region: "eu-central-1"

bucket:
  entries:
    "4tv#Sjfpj&":
      bucket: bucket
      object: file.txt

gateway:
  enabled: true
  parentRefs:
    - name: shared-gateway
      namespace: gateway-system
  hostnames:
    - links.example.com

networkPolicy:
  enabled: true
  engine: both
  ingress:
    enabled: true
  egress:
    enabled: true
    https:
      enabled: false
  cilium:
    description: "s3-bucket-perma-link: only the shared gateway reaches it, and it only reaches named hosts"
    ingress:
      fromEntities:
        - cluster
    egress:
      toFQDNs:
        - matchName: api.example.com
        - matchPattern: "*.cdn.example.com"
      fqdnPorts:
        - port: 443
          protocol: TCP
      dnsMatchPatterns:
        - matchPattern: "*.example.com"
      toEntities:
        - kube-apiserver
