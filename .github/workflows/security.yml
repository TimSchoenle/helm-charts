name: Security

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['**']
  schedule:
    # Weekly, so advisories published since the last change are reported. Off the hour, because
    # GitHub's scheduling backlog is deepest on the hour.
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # jactionlint keeps every actionlint check and has a rule for every zizmor audit. The shared action
  # runs the pedantic profile online (.github/jactionlint.yaml holds the repository's rule choices),
  # so it also asks GitHub about the actions in use (impostor commits, vulnerable versions, moved
  # tags, archived repositories). It annotates the findings, uploads the SARIF to code scanning under
  # the category jactionlint and, with strict-exit, fails on findings of every level.
  action-lint:
    name: Action Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to fetch code
      security-events: write # to upload SARIF results
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            ghcr.io:443
            auth.docker.io:443
            registry-1.docker.io:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run jactionlint
        uses: TimSchoenle/actions/actions/security/jactionlint@1d886b5eba61b249cb506ac35e8b6ab460a0ed2a # tag=actions-security-jactionlint-v1.1.2
        with:
          online: 'true'
          strict-exit: 'true'
