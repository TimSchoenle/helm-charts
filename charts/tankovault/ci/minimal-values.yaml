# The smallest installable stack: the request path plus its database, sized to fit a kind node.
# Together with bundled-datastores-values.yaml this is what `ct install` runs — the two fixtures
# that depend on nothing outside the release, and therefore the two that keep the
# `-values.yaml` suffix that `ct install` globs for.
auth:
  jwtSecret: ci-jwt-secret-0123456789abcdef0123
internal:
  # The `token` path. The chart defaults to `mtls`, which needs cert-manager and a CA;
  # `ci/internal-mtls.yaml` is the fixture that renders that one. Both tokens are set explicitly
  # for the same reason `auth.jwtSecret` is — `helm template` has no cluster to read a generated
  # value back out of, so an empty one would render differently on every invocation.
  identity: token
  tokens:
    api: ci-internal-token-api-0123456789abcdef
    worker: ci-internal-token-worker-0123456789ab
profile: development
postgresql:
  enabled: true
  auth:
    password: ci-postgresql-password
  persistence:
    enabled: false
  resourcesPreset: small
defaults:
  resourcesPreset: nano
  podAntiAffinity: ""
services:
  frontend:
    replicaCount: 1
  api:
    replicaCount: 1
  controlPlane:
    enabled: false
  worker:
    enabled: false
  notifier:
    enabled: false
  sync:
    enabled: false
  challengeSolver:
    enabled: false
  render:
    enabled: false
