suite: configmap
templates:
  - configmap.yaml
tests:
  - it: carries the bot configuration
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-netcup-offer-bot

  - it: reflects a changed check interval
    set:
      env.checkInterval: 600
    asserts:
      - equal:
          path: data.CHECK_INTERVAL
          value: "600"
