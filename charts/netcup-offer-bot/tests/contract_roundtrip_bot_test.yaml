# Generated by `just contract-tests`. Do not edit by hand.
#
# Every case below writes one setting into the chart's own value for it — or into `config` where
# no value is bound to that key — and asserts that it arrives in `config.toml`, under the table
# its contract path names. That is the round trip no other gate can see: `just check-config`
# proves the rendered document satisfies the contract, and a document missing a setting entirely
# satisfies it perfectly.
#
# Chart:       netcup-offer-bot
# Declaration: charts/netcup-offer-bot/config-contract.yaml (document `bot`)
# Contract:    charts/netcup-offer-bot/contracts/bot.json
# Coverage:    12 of 18 contract keys carry a probe, 12 through the chart's own value
#
# Regenerate with `just contract-tests`. `just check-contract-tests` fails a pull request whose
# committed copy has drifted from the contract it was generated against.

suite: 'contract round trip (bot)'

# `just render` installs every chart under a release named after it, and the declaration's
# selector is written against that render. Naming the release the same way here is what makes
# `app.kubernetes.io/instance` carry the value the declaration selects on.
release:
  name: netcup-offer-bot

# Every case below carries this chart's render prerequisites, the identity case included: chart
# values its own `validateValues` insists on before it will render anything at all. They are
# first-class chart values rather than configuration, and none of them may be written under
# `config` — a prerequisite there would sit in the tree every case probes, free to supply the
# value the case exists to prove the chart delivered. Unlike a baseline, a prerequisite is never
# dropped for the case it would collide with, because a case without it does not render at all;
# the refusal is what takes that dropping's place.
#
# `netcup-offer-bot.validateValues` refuses a render that projects no `discord__webhook_url`
# file — a bot with nowhere to post announces into nothing — and it runs from `configmap.yaml`,
# so without a webhook there is no document for any case to assert against. The guard reads the
# projected key list rather than the value, so `existingSecret` would satisfy it as well; the
# first-class value is used instead because it keeps the enrolment to one line and leaves the
# chart's Secret rendering on the path every other case exercises. This is the one prerequisite
# in the repository that occupies a `secret: true` contract key, which the generator refuses to
# invent a probe for on the grounds that a credential-shaped value in a test file is a
# credential. It is written here rather than synthesised, and it is not a credential: `.invalid`
# is reserved by RFC 2606 and can never resolve, and the webhook id and token are both zero,
# which Discord issues to nobody. `discord.webhook_url` carries no case in this suite for that
# same `secret` rule, so nothing is being covered up. The chart merges `.Values.config` over
# everything it derives from its values, so a probe still wins wherever the two would meet.
# `existingSecret` is the second entry, and it answers a different guard. Every
# `telemetry.sentry.*` key carries a `when telemetry.sentry.enabled` clause, so a case probing
# one switches Sentry on and the chart then refuses the render unless a DSN is available. Naming
# a Secret satisfies that without a credential-shaped string in a committed file, and changes
# nothing the cases assert against: the DSN travels as a file in the secrets directory and never
# reaches `config.toml`. The Secret does not have to exist for a template render.
tests:
  # Every case below selects its document by the key it carries, which is what `check-config.py`
  # reads it from — a label would match the Deployment and the Service too. This case is what
  # ties that selection back to the declaration: the object holding `config.toml` has to be the
  # ConfigMap the declaration names, carrying the labels the declaration selects on.
  - it: renders config.toml on the ConfigMap the declaration selects
    documentSelector:
      path: data["config.toml"]
    set:
      discord.webhookUrl: 'https://render-prerequisite.invalid/api/webhooks/0/0'
      existingSecret: netcup-contract-probe
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: netcup-offer-bot

  - it: delivers feed.check_interval_secs into config.toml from feed.checkIntervalSecs
    documentSelector:
      path: data["config.toml"]
    set:
      discord.webhookUrl: 'https://render-prerequisite.invalid/api/webhooks/0/0'
      existingSecret: netcup-contract-probe
      feed.checkIntervalSecs: 4242
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '(?m)^\[feed\]$\n(?:[^\[\n][^\n]*\n|\n)*^check_interval_secs = 4242$'

  - it: delivers metrics.port into config.toml from metrics.port
    documentSelector:
      path: data["config.toml"]
    set:
      discord.webhookUrl: 'https://render-prerequisite.invalid/api/webhooks/0/0'
      existingSecret: netcup-contract-probe
      metrics.enabled: true
      metrics.port: 4242
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '(?m)^\[metrics\]$\n(?:[^\[\n][^\n]*\n|\n)*^port = 4242$'

  - it: delivers telemetry.sentry.attach_stacktraces into config.toml from telemetry.sentry.attachStacktraces
    documentSelector:
      path: data["config.toml"]
    set:
      discord.webhookUrl: 'https://render-prerequisite.invalid/api/webhooks/0/0'
      existingSecret: netcup-contract-probe
      telemetry.sentry.enabled: true
      telemetry.sentry.attachStacktraces: false
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '(?m)^\[telemetry\.sentry\]$\n(?:[^\[\n][^\n]*\n|\n)*^attach_stacktraces = false$'

  - it: delivers telemetry.sentry.breadcrumb_level into config.toml from telemetry.sentry.breadcrumbLevel
    documentSelector:
      path: data["config.toml"]
    set:
      discord.webhookUrl: 'https://render-prerequisite.invalid/api/webhooks/0/0'
      existingSecret: netcup-contract-probe
      telemetry.sentry.enabled: true
      telemetry.sentry.breadcrumbLevel: off
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '(?m)^\[telemetry\.sentry\]$\n(?:[^\[\n][^\n]*\n|\n)*^breadcrumb_level = "off"$'

  - it: delivers telemetry.sentry.capture_level into config.toml from telemetry.sentry.captureLevel
    documentSelector:
      path: data["config.toml"]
    set:
      discord.webhookUrl: 'https://render-prerequisite.invalid/api/webhooks/0/0'
      existingSecret: netcup-contract-probe
      telemetry.sentry.enabled: true
      telemetry.sentry.captureLevel: off
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '(?m)^\[telemetry\.sentry\]$\n(?:[^\[\n][^\n]*\n|\n)*^capture_level = "off"$'

  - it: delivers telemetry.sentry.debug into config.toml from telemetry.sentry.debug
    documentSelector:
      path: data["config.toml"]
    set:
      discord.webhookUrl: 'https://render-prerequisite.invalid/api/webhooks/0/0'
      existingSecret: netcup-contract-probe
      telemetry.sentry.enabled: true
      telemetry.sentry.debug: true
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '(?m)^\[telemetry\.sentry\]$\n(?:[^\[\n][^\n]*\n|\n)*^debug = true$'

  - it: delivers telemetry.sentry.enabled into config.toml from telemetry.sentry.enabled
    documentSelector:
      path: data["config.toml"]
    set:
      discord.webhookUrl: 'https://render-prerequisite.invalid/api/webhooks/0/0'
      existingSecret: netcup-contract-probe
      telemetry.sentry.enabled: true
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '(?m)^\[telemetry\.sentry\]$\n(?:[^\[\n][^\n]*\n|\n)*^enabled = true$'

  - it: delivers telemetry.sentry.environment into config.toml from telemetry.sentry.environment
    documentSelector:
      path: data["config.toml"]
    set:
      discord.webhookUrl: 'https://render-prerequisite.invalid/api/webhooks/0/0'
      existingSecret: netcup-contract-probe
      telemetry.sentry.enabled: true
      telemetry.sentry.environment: contract-probe-telemetry-sentry-environment
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '(?m)^\[telemetry\.sentry\]$\n(?:[^\[\n][^\n]*\n|\n)*^environment = "contract-probe-telemetry-sentry-environment"$'

  - it: delivers telemetry.sentry.max_breadcrumbs into config.toml from telemetry.sentry.maxBreadcrumbs
    documentSelector:
      path: data["config.toml"]
    set:
      discord.webhookUrl: 'https://render-prerequisite.invalid/api/webhooks/0/0'
      existingSecret: netcup-contract-probe
      telemetry.sentry.enabled: true
      telemetry.sentry.maxBreadcrumbs: 4242
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '(?m)^\[telemetry\.sentry\]$\n(?:[^\[\n][^\n]*\n|\n)*^max_breadcrumbs = 4242$'

  - it: delivers telemetry.sentry.release into config.toml from telemetry.sentry.release
    documentSelector:
      path: data["config.toml"]
    set:
      discord.webhookUrl: 'https://render-prerequisite.invalid/api/webhooks/0/0'
      existingSecret: netcup-contract-probe
      telemetry.sentry.enabled: true
      telemetry.sentry.release: contract-probe-telemetry-sentry-release
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '(?m)^\[telemetry\.sentry\]$\n(?:[^\[\n][^\n]*\n|\n)*^release = "contract-probe-telemetry-sentry-release"$'

  - it: delivers telemetry.sentry.server_name into config.toml from telemetry.sentry.serverName
    documentSelector:
      path: data["config.toml"]
    set:
      discord.webhookUrl: 'https://render-prerequisite.invalid/api/webhooks/0/0'
      existingSecret: netcup-contract-probe
      telemetry.sentry.enabled: true
      telemetry.sentry.serverName: contract-probe-telemetry-sentry-server-name
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '(?m)^\[telemetry\.sentry\]$\n(?:[^\[\n][^\n]*\n|\n)*^server_name = "contract-probe-telemetry-sentry-server-name"$'

  - it: delivers telemetry.sentry.shutdown_timeout_secs into config.toml from telemetry.sentry.shutdownTimeoutSecs
    documentSelector:
      path: data["config.toml"]
    set:
      discord.webhookUrl: 'https://render-prerequisite.invalid/api/webhooks/0/0'
      existingSecret: netcup-contract-probe
      telemetry.sentry.enabled: true
      telemetry.sentry.shutdownTimeoutSecs: 4242
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '(?m)^\[telemetry\.sentry\]$\n(?:[^\[\n][^\n]*\n|\n)*^shutdown_timeout_secs = 4242$'

  # Contract keys carrying no case, and why. An unexplained absence is indistinguishable from an
  # oversight, so every one of them is named here rather than simply left out.
  #
  # discord.webhook_url: `secret: true`: the probe would be committed to this repository, and a
  #                      credential-shaped value in a test file is a credential
  # metrics.ip: `unknown`: the producer publishes no constraint for this key, so no probe can be
  #             known-valid
  # telemetry.log_level: `unknown`: the producer publishes no constraint for this key, so no
  #                      probe can be known-valid
  # telemetry.sentry.dsn: `secret: true`: the probe would be committed to this repository, and a
  #                       credential-shaped value in a test file is a credential
  # telemetry.sentry.sample_rate: `unknown`: the producer publishes no constraint for this key,
  #                               so no probe can be known-valid
  # telemetry.sentry.traces_sample_rate: `unknown`: the producer publishes no constraint for
  #                                      this key, so no probe can be known-valid
