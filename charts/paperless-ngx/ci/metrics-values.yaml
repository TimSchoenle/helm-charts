# The observability objects. Installable because the install job applies the Prometheus Operator
# CRDs before it runs, so the `PrometheusRule` this creates is accepted by a real API server —
# which is the half of the render that `helm template` cannot check.
#
# `metrics.dashboard.grafanaOperator` is deliberately left off: its CRDs are not installed on the
# CI cluster, and the chart refuses to render rather than dropping the objects silently. The
# render-only `ci/grafana-operator.yaml` fixture covers that path instead.
paperless:
  secretKey: ci-secret-key-not-a-real-one

metrics:
  prometheusRule:
    enabled: true
    scope: namespace
    labels:
      release: kube-prometheus-stack
    # Every preset at once, so the API server validates an object the presets have rewritten
    # rather than the defaults. Both volume alerts read the same recorded series and differ only
    # in their literal, so moving one and not the other is the case worth installing.
    disabledAlerts:
      - PaperlessNgxBackupSuspended
    additionalRuleLabels:
      team: archive
      tier: ci
    severityOverrides:
      PaperlessNgxRestarting: info
    forOverrides:
      PaperlessNgxDown: 10m
    thresholds:
      PaperlessNgxVolumeFillingUp:
        ratio: 0.7
      PaperlessNgxRestarting:
        restarts: 8
    additionalRuleGroups:
      - name: paperless-ngx-ci-site
        rules:
          - alert: PaperlessNgxCiSiteRule
            expr: up{job="paperless-ngx"} == 0
            for: 5m
            labels:
              severity: info
            annotations:
              summary: "{{ $labels.job }} is down, per site policy"
              description: Stands in for a rule an operator wrote themselves.
  dashboard:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"

resources:
  limits:
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

persistence:
  media:
    size: 1Gi
  data:
    size: 1Gi
  consume:
    size: 1Gi
