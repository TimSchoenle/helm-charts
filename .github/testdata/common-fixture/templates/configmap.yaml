{{- if (include "common.createConfigMap" .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.configMapName" . }}
  namespace: {{ include "common.namespace" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.containerPort | quote }}
  config.toml: |
    {{- include "common.configToml" (dict "ctx" . "maps" (list .Values.config) "intKeys" .Values.tomlIntKeys) | nindent 4 }}
{{- end }}
