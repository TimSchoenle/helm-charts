# Operator-published legal documents. A document is served from an inline `body` or linked through
# `url`; the chart delivers each body as a file in the api's secrets directory, and a validator
# rejects the combinations the service would refuse to boot on.
suite: test legal documents
templates:
  - configmap-legal.yaml
  - configmap.yaml
  - deployment.yaml
  - serviceaccount.yaml
values:
  - ../ci/default.yaml
tests:
  - it: publishes nothing, and mounts nothing, by default
    # An empty index is the designed state: the frontend then shows no Legal column at all,
    # rather than a column of links that 404.
    asserts:
      - hasDocuments:
          count: 0
        template: configmap-legal.yaml

  - it: writes inline bodies as <slug>.<locale>.md
    set:
      legal.documents.terms.body.en: "# Terms\n"
      legal.documents.terms.body.de: "# Nutzungsbedingungen\n"
    template: configmap-legal.yaml
    asserts:
      - equal:
          path: data["terms.en.md"]
          value: "# Terms\n"
      - equal:
          path: data["terms.de.md"]
          value: "# Nutzungsbedingungen\n"

  - it: writes every other document field into the api config
    set:
      legal.defaultLocale: en
      legal.documents.terms.body.en: "# Terms\n"
      legal.documents.terms.title.en: Terms of Service
      legal.documents.terms.updated: "2026-08-04"
      legal.documents.terms.order: 3
    template: configmap.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-tankovault-api-config
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '(?m)^\[legal\]$\n(?:[^\[\n][^\n]*\n|\n)*^default_locale = "en"$'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'order = 3'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'updated = "2026-08-04"'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'en = "Terms of Service"'

  - it: writes the default locale on its own
    # `default_locale` is independent of the documents; an operator may set it before publishing
    # anything, and it must not wait for a document to appear beside it.
    set:
      legal.defaultLocale: de
    template: configmap.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-tankovault-api-config
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '(?m)^\[legal\]$\n(?:[^\[\n][^\n]*\n|\n)*^default_locale = "de"$'

  - it: emits a linked document as a url with nothing to project
    set:
      legal.documents.imprint.url: https://example.org/impressum
    asserts:
      - hasDocuments:
          count: 0
        template: configmap-legal.yaml
      - matchRegex:
          path: data["config.toml"]
          pattern: 'url = "https://example\.org/impressum"'
        template: configmap.yaml
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-tankovault-api-config

  - it: projects each body into the api secrets directory under its configuration path
    # The loader reads a file in the secrets directory as the key its name spells, so
    # `legal__documents__terms__body__en` supplies exactly `legal.documents.terms.body.en`.
    set:
      legal.documents.terms.body.en: "# Terms\n"
      legal.documents.terms.body.de-AT: "# Nutzungsbedingungen\n"
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-tankovault-api
    asserts:
      - contains:
          path: spec.template.spec.volumes[?(@.name == "secrets")].projected.sources
          content:
            configMap:
              name: RELEASE-NAME-tankovault-legal
              items:
                - key: terms.de-AT.md
                  path: legal__documents__terms__body__de-AT
                - key: terms.en.md
                  path: legal__documents__terms__body__en

  - it: projects the bodies into the api and nowhere else
    # `api` is the only service that reads them: it serves the index and each document, and the
    # frontend's footer is built from that index rather than from the files.
    set:
      legal.documents.terms.body.en: "# Terms\n"
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-tankovault-worker
    asserts:
      - notContains:
          path: spec.template.spec.volumes[?(@.name == "secrets")].projected.sources
          content:
            configMap:
              name: RELEASE-NAME-tankovault-legal
          any: true

  - it: keeps the document text out of the checksummed config
    # `checksum/config` is a digest of this file, so a body that appeared here would turn every
    # policy correction into a rolling restart of the API tier.
    set:
      legal.documents.terms.body.en: "SENTINEL-BODY-TEXT"
    template: configmap.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-tankovault-api-config
    asserts:
      - notMatchRegex:
          path: data["config.toml"]
          pattern: 'SENTINEL-BODY-TEXT'
      - notMatchRegex:
          path: data["config.toml"]
          pattern: 'body'

  - it: refuses the removed content key by path
    # TankoVault 11 replaced the chart's `content` with the service's own `body`. The schema, not
    # a template, is what names the old key, so an upgrade that kept it fails the render outright.
    set:
      legal.documents.terms.content.en: "# Terms\n"
    template: serviceaccount.yaml
    asserts:
      - failedTemplate:
          errorPattern: "additional properties 'content' not allowed"

  - it: refuses a document that is both served and linked
    set:
      legal.documents.terms.url: https://example.org/terms
      legal.documents.terms.body.en: "# Terms\n"
    template: serviceaccount.yaml
    asserts:
      - failedTemplate:
          errorPattern: "legal.documents.terms sets both body and url"

  - it: refuses a document with no body at all
    set:
      legal.documents.terms.title.en: Terms of Service
    template: serviceaccount.yaml
    asserts:
      - failedTemplate:
          errorPattern: "legal.documents.terms publishes no body"

  - it: refuses a slug that would not name a file
    set:
      legal.documents.Terms.url: https://example.org/terms
    template: serviceaccount.yaml
    asserts:
      - failedTemplate:
          errorPattern: "a slug is lowercase letters"

  - it: refuses a body slug containing the nesting separator
    set:
      legal.documents.terms__v2.body.en: "# Terms\n"
    template: serviceaccount.yaml
    asserts:
      - failedTemplate:
          errorPattern: "cannot contain `__`"

  - it: refuses a locale that is not a language tag
    set:
      legal.documents.terms.body.en__gb: "# Terms\n"
    template: serviceaccount.yaml
    asserts:
      - failedTemplate:
          errorPattern: "a locale is a language tag"

  - it: refuses a url that is not http(s)
    set:
      legal.documents.terms.url: ftp://example.org/terms
    template: serviceaccount.yaml
    asserts:
      - failedTemplate:
          errorPattern: "Only absolute http\\(s\\) URLs are accepted"

  - it: refuses documents nothing would serve
    set:
      legal.documents.terms.url: https://example.org/terms
      services.api.enabled: false
    template: serviceaccount.yaml
    asserts:
      - failedTemplate:
          errorPattern: "The API is the only service that reads them"
