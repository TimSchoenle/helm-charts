{{- /*
Credentials the application and the bundled PostgreSQL consume by reference.

Rendered only when this chart actually holds secret material: an operator-supplied
`existingSecret` replaces it entirely, and a SQLite instance with no admin account, no broker
password and no mail relay has nothing to store.

Every key is consumed through `secretKeyRef`, never through the ConfigMap and never as a literal
in the pod spec — with one deliberate exception, the broker password, which is interpolated into
the URL by the kubelet from an environment variable that is itself a `secretKeyRef`.
*/ -}}
{{- if (include "paperless-ngx.createSecret" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.fullname" . }}
  namespace: {{ include "common.namespace" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  {{- with (include "common.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- include "paperless-ngx.secretData" . | nindent 2 }}
{{- end }}
