{{- if include "tankovault.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.fullname" . }}
  namespace: {{ include "common.namespace" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    {{- with (include "common.annotations" .) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- /*
      A hook resource for the same reason as the bootstrap ConfigMap: the `pre-install`
      migration Job projects `database__url` out of it, and Helm creates the release's own
      resources only after every pre-install hook has finished. The projection is
      `optional: true`, so without this the Job would start with no credential at all and fail
      on a missing database URL rather than on a missing volume.

      The delete policy omits `hook-succeeded` — every service pod projects this Secret for as
      long as it runs. `before-hook-creation` still deletes and immediately recreates it at the
      start of a `pre-upgrade`; running pods keep the values the kubelet last projected, and
      the object is back long before the next kubelet sync, so a live release never observes
      the gap.
    */}}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{- /*
    Key names are configuration paths with `__` for nesting and no dots, because that is how a
    file in TANKOVAULT_SECRETS_DIR has to be named. Rendered as `stringData` so the values stay
    readable in a diff review; Kubernetes stores them base64-encoded either way.
  */}}
  {{- include "tankovault.secretData" . | nindent 2 }}
{{- end }}
