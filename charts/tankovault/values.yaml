# @schema
# type: boolean
# @schema
# -- Permit `control-plane`, `sync`, `render` and `challenge-solver` to use a Service type
# other than `ClusterIP`. Off by default and validated, because those four expose privileged
# contracts: upstream publishes none of them even on a single host, and reaching them directly
# bypasses both the frontend proxy and the rate limiter.
allowUnsafeExposure: false

# @schema
# additionalProperties: true
# @schema
# -- Schema migration and first-install seeding, all from the `bootstrap` image. Nothing
# published carries a destructive command; resetting the schema is not available in any image.
bootstrap:
  # @schema
  # additionalProperties: true
  # @schema
  image:
    # @schema
    # type: string
    # @schema
    # -- Image repository.
    repository: timschoenle/tankovault-bootstrap

    # @schema
    # type: string
    # @schema
    # -- Image tag, pinned by digest.
    tag: v1.5.0@sha256:b24e70a88701ffeda40d2b50e073e212ce734d12b4e65fc1399b2d385532a6bf

  # @schema
  # enum: ["", nano, micro, small, medium, large]
  # @schema
  # -- Resource t-shirt size for the bootstrap containers.
  resourcesPreset: small

  # @schema
  # additionalProperties: true
  # @schema
  migrate:
    # @schema
    # enum: [auto, job, initContainer, disabled]
    # @schema
    # -- How `bootstrap migrate` runs. `job` is a `pre-install,pre-upgrade` Helm hook, correct
    # when the database already exists. `initContainer` runs it in every service pod, which is
    # what the bundled PostgreSQL needs — a pre-install hook would run before the StatefulSet
    # exists and could only ever fail. Concurrent runs are safe: sqlx takes a Postgres advisory
    # lock. `auto` picks `initContainer` when `postgresql.enabled`, otherwise `job`.
    mode: auto

    # @schema
    # enum: [helmHook, argoSyncWave]
    # @schema
    # -- How the migration Job is ordered against the workloads. Ignored unless `mode` resolves
    # to `job`, and irrelevant under plain `helm install`, which has no phases to order across.
    # `helmHook` is the `pre-install,pre-upgrade` hook, which Argo CD compiles to the PreSync
    # phase — and PreSync runs before **every** Sync-phase resource, with sync waves ordering
    # only within a phase. So when `database__url` arrives from an ExternalSecret, a first
    # install deadlocks and never recovers: the Job's projected secrets volume names a Secret
    # that does not exist yet, the pod sits in ContainerCreating on FailedMount, the Job never
    # completes, PreSync never finishes, Sync never starts, and the ExternalSecret that would
    # have created that Secret is therefore never applied. Nothing inside PreSync can break the
    # cycle. `argoSyncWave` drops the hook annotations entirely and orders the Job by sync wave
    # inside the Sync phase instead, where the ExternalSecret reconciles alongside it.
    ordering: helmHook

    # @schema
    # type: integer
    # @schema
    # -- Sync wave the migration Job takes under `ordering: argoSyncWave`; the workloads take
    # this plus one, which is what reproduces the `pre-upgrade` guarantee — Argo CD holds a wave
    # until the previous one is healthy, and a Job is healthy only once it is Complete. Anything
    # the migration itself depends on — the ExternalSecret carrying `database__url`, a database
    # some operator provisions — must be given a wave strictly below this one.
    argoSyncWaveBase: 0

    # @schema
    # type: integer
    # minimum: 0
    # @schema
    # -- Retries before the migration Job is considered failed.
    backoffLimit: 3

  # @schema
  # additionalProperties: true
  # @schema
  seedAdmin:
    # @schema
    # type: boolean
    # @schema
    # -- Create the first administrator on install. Create-only: re-running changes nothing.
    # This is the only account privilege is ever minted for, since registration confers none.
    enabled: false

    # @schema
    # type: string
    # @schema
