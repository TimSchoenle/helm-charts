suite: deployment
templates:
  - deployment.yaml
  - configmap.yaml
# The deployment annotates a checksum of the ConfigMap, so both templates must render; the
# per-test selector keeps assertions on the Deployment.
tests:
  - it: creates a Deployment named after the release
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-portfolio

  - it: exposes the application port as http
    documentSelector:
      path: kind
      value: Deployment
    set:
      server.port: 9090
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - containerPort: 9090
              name: http
              protocol: TCP

  # The `PORTFOLIO_` configuration arrives as a file; what is left in the environment is the
  # loader's pointer, the ISR cache directory, and the three variables the Dioxus toolchain
  # reads for itself.
  # The exhaustive list is the assertion: every entry is a plain value, so no credential is
  # injected at runtime and nothing is read from a Secret.
  - it: passes the PORTFOLIO configuration as a file and the Dioxus knobs as environment
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: PORT
              value: "8080"
            - name: IP
              value: 0.0.0.0
            - name: RUST_LOG
              value: info
            - name: PORTFOLIO_CONFIG
              value: /etc/portfolio/config
            - name: PORTFOLIO_ISR__CACHE_DIR
              value: /tmp/isr
      - notExists:
          path: spec.template.spec.containers[0].envFrom

  # The published image bakes `PORTFOLIO_ISR__CACHE_DIR=/tmp/isr`, and the environment layer
  # outranks the TOML one. Without the chart restating it, a moved cache directory would be
  # written into `config.toml` and then silently ignored.
  - it: restates the ISR cache directory so the image cannot shadow the file
    documentSelector:
      path: kind
      value: Deployment
    set:
      isr.cacheDir: /cache/isr
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PORTFOLIO_ISR__CACHE_DIR
            value: /cache/isr

  - it: follows the cache directory set through the raw config tree
    documentSelector:
      path: kind
      value: Deployment
    set:
      config:
        isr:
          cache_dir: /cache/from-config
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PORTFOLIO_ISR__CACHE_DIR
            value: /cache/from-config

  - it: mounts the rendered configuration read-only
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            configMap:
              name: RELEASE-NAME-portfolio
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /etc/portfolio/config
            readOnly: true

  # The server reads no secret, so pointing it at a directory no volume provides would be a
  # boot failure naming the path.
  - it: names no secrets directory, because the server reads no secret
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PORTFOLIO_SECRETS_DIR
            value: /etc/portfolio/secrets
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: secrets
            mountPath: /etc/portfolio/secrets
            readOnly: true

  - it: probes the health endpoint on all three probes
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /api/health
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /api/health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /api/health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: http

  # Kubernetes rejects any successThreshold other than 1 on startup and liveness probes.
  - it: omits successThreshold where Kubernetes forbids it
    documentSelector:
      path: kind
      value: Deployment
    set:
      startupProbe.successThreshold: 3
      livenessProbe.successThreshold: 3
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe.successThreshold
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe.successThreshold
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.successThreshold
          value: 1

  - it: drops a probe entirely when disabled
    documentSelector:
      path: kind
      value: Deployment
    set:
      startupProbe.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - exists:
          path: spec.template.spec.containers[0].livenessProbe

  # Without this the pod keeps running the old configuration after a values change.
  - it: rolls the pod when the ConfigMap changes
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/configmap"]

  - it: applies the configured resource requests and limits
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 250m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 32Mi

  - it: omits resources entirely when the block is emptied
    documentSelector:
      path: kind
      value: Deployment
    set:
      resources: null
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources

  - it: scales to the requested replica count
    documentSelector:
      path: kind
      value: Deployment
    set:
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  # Not a hardening preference: a precondition of the configuration contract this chart declares
  # in `config-contract.yaml`. With service links on, a release named for this chart gets seven
  # kubelet-injected variables inside the `PORTFOLIO_` namespace the loader owns, and the
  # environment layer outranks the mounted file — so one of them can supply a key `config.toml`
  # already set. The kubelet injects them at admission and `helm template` does not, so no gate
  # in this repository can see the regression; this assertion is what catches it.
  - it: disables service links, so no injected variable can shadow a configuration key
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
