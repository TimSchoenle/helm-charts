# vim: set ft=yaml:

# What this chart's rendered configuration must satisfy, and which images decide that.
#
# Per-chart and self-describing, so adding a chart never edits a central file — the same
# principle `just chart-index` already follows. `just check-config` reads this, unions the
# contracts of every image listed, and validates the rendered ConfigMap, the container
# environment and the mounted secret file names against the result.

# Whether `just check-config-bindings` holds this chart's values against the keys below.
#
# Declared rather than inferred from the chart carrying markers: a chart that loses them — a
# botched edit, a spelling the parser does not recognise — would otherwise drop out of that gate's
# report without a word. With the switch here, markers without it and it without markers are both
# errors.
bindings: true

# Contract keys no chart value binds, each group with the reason it does not.
#
# Chart-level: a key nothing surfaces is unsurfaced in every document that declares it, and this
# chart declares one. `documents:` narrows an entry where that is untrue.
#
# Secret keys are not exempt by default, and each one is written out. The blanket rule
# "credentials need no marker" was refused because it cannot tell a key delivered as a file from
# a key a chart merely forgot: both look identical from the contract's side, and the second is
# exactly the regression this gate exists to catch. Naming them one by one costs a line and
# keeps the gate honest — a chart that stopped projecting one would go red rather than quiet.
unbound:
  - keys:
      - discord.webhook_url
      - telemetry.sentry.dsn
    reason: >-
      Delivered as files in the secrets directory — from the Secret this chart renders, or
      from `existingSecret` under the file names `discord__webhook_url` and
      `telemetry__sentry__dsn` — and never written into `config.toml`, because a bearer
      credential in a ConfigMap is readable by anything that can read the namespace. The DSN
      embeds an ingest key and is one. `discord.webhookUrl` and `telemetry.sentry.dsn` are the
      values that carry them, so both bindings exist; they simply do not run through the
      configuration document the markers describe. `just check-config-secrets` is what
      reconciles that channel, and it does it from the rendered manifests rather than from a
      comment.

documents:
  - name: bot

    # Where the rendered document is, in the output of `helm template`.
    #
    # Matched by label rather than by rendered name, and by `app.kubernetes.io/instance`: that
    # label is `.Release.Name`, the one identifier neither `nameOverride` nor `fullnameOverride`
    # can move — `app.kubernetes.io/name` follows the first and every object's name follows the
    # second. `just render` names the release after the chart, so the value below is what every
    # rendered pair carries. A selector matching zero or several objects is reported rather than
    # resolved, so a stale one fails loudly instead of becoming a skipped check.
    source:
      kind: ConfigMap
      selector: { app.kubernetes.io/instance: netcup-offer-bot }
      key: config.toml
      format: toml

    # Every binary that reads this document. One image here, so the union is the identity.
    images:
      - values: image
        contract: contracts/bot.json

    # The pods that mount it, for the environment and secret-file gates.
    consumers:
      - workload: { kind: Deployment, selector: { app.kubernetes.io/instance: netcup-offer-bot } }
        containers: [netcup-offer-bot]

    # Pairs this document is not fully checked for, each with a reason.
    exempt: []
