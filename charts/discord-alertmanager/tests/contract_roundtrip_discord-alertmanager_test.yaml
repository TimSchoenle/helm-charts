  # Contract keys carrying no case, and why. An unexplained absence is indistinguishable from an
  # oversight, so every one of them is named here rather than simply left out.
  #
  # alertmanager.basic_password: `secret: true`: the probe would be committed to this
  #                              repository, and a credential-shaped value in a test file is a
  #                              credential
  # alertmanager.bearer_token: `secret: true`: the probe would be committed to this repository,
  #                            and a credential-shaped value in a test file is a credential
  # alertmanager.endpoints: `structured`: the keys beneath it are the operator's own names, so
  #                         the contract describes the container and not its contents and no
  #                         probe addresses a leaf
  # discord.capabilities.admin: `structured`: the keys beneath it are the operator's own names,
  #                             so the contract describes the container and not its contents and
  #                             no probe addresses a leaf
  # discord.capabilities.operate: `structured`: the keys beneath it are the operator's own
  #                               names, so the contract describes the container and not its
  #                               contents and no probe addresses a leaf
  # discord.capabilities.silence: `structured`: the keys beneath it are the operator's own
  #                               names, so the contract describes the container and not its
  #                               contents and no probe addresses a leaf
  # discord.capabilities.view: `structured`: the keys beneath it are the operator's own names,
  #                            so the contract describes the container and not its contents and
  #                            no probe addresses a leaf
  # discord.token: `secret: true`: the probe would be committed to this repository, and a
  #                credential-shaped value in a test file is a credential
  # ingest.bind: `unknown`: the producer publishes no constraint for this key, so no probe can
  #              be known-valid
  # ingest.webhook_token: `secret: true`: the probe would be committed to this repository, and a
  #                       credential-shaped value in a test file is a credential
  # links.allowed_hosts: `structured`: the keys beneath it are the operator's own names, so the
  #                      contract describes the container and not its contents and no probe
  #                      addresses a leaf
  # links.buttons: `structured`: the keys beneath it are the operator's own names, so the
  #                contract describes the container and not its contents and no probe addresses
  #                a leaf
  # links.grafana_base: `unknown`: the producer publishes no constraint for this key, so no
  #                     probe can be known-valid
  # links.prometheus_base: `unknown`: the producer publishes no constraint for this key, so no
  #                        probe can be known-valid
  # render.key_labels: `structured`: the keys beneath it are the operator's own names, so the
