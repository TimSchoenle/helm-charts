# vim: set ft=yaml:

# What this chart's rendered configuration must satisfy, and which images decide that.
#
# Still opted out, but for a narrower reason than before, and `just check-contract-coverage`
# permits the opt-out only with one written down.
reason: >-
  Only one of this chart's nine first-party images publishes a configuration contract so far.
  `tankovault-frontend` v8.1.1 carries the `dev.terrace.config.*` labels and the embedded
  document; the other eight services are still on v7.3.0, which publishes neither. Declaring the
  frontend alone would leave the eight documents that carry the real configuration — the API's
  database and auth keys, the worker's queues — checked by nothing while the chart looked
  covered, and `unconfigured` is the wrong word for them: they read plenty of
  contract-describable configuration, they just cannot describe it yet. Declare all nine at once
  when the services catch up. This is also the chart worth declaring first after that, because it
  renders nine documents rather than one and is where the per-document selector
  (`app.kubernetes.io/component`, which it already sets) earns its keep.
documents: []
