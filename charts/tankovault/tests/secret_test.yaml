suite: test credential delivery
templates:
  - secret.yaml
  - deployment.yaml
values:
  - ../ci/default.yaml
tests:
  - it: names secret keys as configuration paths a secrets directory accepts
    # `docs/CONFIGURATION.md` §7: a file in TANKOVAULT_SECRETS_DIR is named for the config key
    # with `__` for nesting, and a `.` in the name is refused rather than treated as a
    # separator. A key named `auth.jwt_secret` would be rejected at boot, not silently ignored.
    template: secret.yaml
    asserts:
      - isNotNullOrEmpty:
          path: stringData["auth__jwt_secret"]
      - isNotNullOrEmpty:
          path: stringData["internal__token"]
      - isNotNullOrEmpty:
          path: stringData["database__url"]

  - it: projects only the keys the worker actually reads
    # The worker parses untrusted provider HTML. It has no reason to hold the token-signing
    # key, and this is what keeps it off that pod's filesystem.
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-tankovault-worker
    asserts:
      - contains:
          path: spec.template.spec.volumes[?(@.name=="secrets")].projected.sources[0].secret.items
          content:
            key: internal__token
            path: internal__token
      - notContains:
          path: spec.template.spec.volumes[?(@.name=="secrets")].projected.sources[0].secret.items
          content:
            key: auth__jwt_secret
            path: auth__jwt_secret
      # Nor the key that unseals every enrolled TOTP secret. Only `api` runs the MFA flows.
      - notContains:
          path: spec.template.spec.volumes[?(@.name=="secrets")].projected.sources[0].secret.items
          content:
            key: auth__mfa_encryption_key
            path: auth__mfa_encryption_key

  - it: gives the api the auth keys it does read
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-tankovault-api
    asserts:
      - contains:
          path: spec.template.spec.volumes[?(@.name=="secrets")].projected.sources[0].secret.items
          content:
            key: auth__jwt_secret
            path: auth__jwt_secret
      - contains:
          path: spec.template.spec.volumes[?(@.name=="secrets")].projected.sources[0].secret.items
          content:
            key: auth__mfa_encryption_key
            path: auth__mfa_encryption_key

  - it: mounts credentials read-only and without subPath
    # A subPath mount is resolved once at container start and never receives kubelet updates,
    # which would silently turn credential rotation back into "restart the pod".
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-tankovault-api
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: secrets
            mountPath: /etc/tankovault/secrets
            readOnly: true
      - equal:
          path: spec.template.spec.volumes[?(@.name=="secrets")].projected.defaultMode
          value: 256

  - it: generates the credentials that mean nothing outside the release
    # Without these the production profile refuses to boot, and none of them is a value an
    # operator could choose better than `rand` can, so an unset one is generated rather than
    # rejected. `helm template` has no cluster, so this only proves they are present and
    # long enough — the `lookup` that keeps them stable across upgrades needs a real install.
    template: secret.yaml
    set:
      profile: production
      auth.jwtSecret: ""
      internal.token: ""
      anilist.tokenEncryptionKey: ""
      auth.mfaEncryptionKey: ""
      bootstrap.seedAdmin.enabled: true
      bootstrap.seedAdmin.password: ""
    asserts:
      - matchRegex:
          path: stringData["auth__jwt_secret"]
          pattern: "^[A-Za-z0-9]{32,}$"
      - matchRegex:
          path: stringData["internal__token"]
          pattern: "^[A-Za-z0-9]{32,}$"
      - matchRegex:
          path: stringData["anilist__token_encryption_key"]
          pattern: "^[A-Za-z0-9+/]{40,}={0,2}$"
      # Base64 of 32 bytes, the shape the service requires. A wrong one is a boot failure,
      # not a degraded TOTP, so the shape is the assertion worth having.
      - matchRegex:
          path: stringData["auth__mfa_encryption_key"]
          pattern: "^[A-Za-z0-9+/]{40,}={0,2}$"
      - isNotNullOrEmpty:
          path: stringData["seed_admin_password"]

  - it: leaves the internal token unset outside the production profile
    # Outside production the services accept internal calls with or without one, so generating
    # it would put a credential on six pods that nothing checks.
    template: secret.yaml
    set:
      profile: development
      internal.token: ""
    asserts:
      - notExists:
          path: stringData["internal__token"]

  - it: peppers password hashes by default
    # helm-unittest has no cluster, so `lookup` finds no Secret and this renders the first-install
    # path — which is the only path that generates a pepper. The other branch, an existing Secret
    # with no `auth__password_pepper` key, must NOT acquire one (every password stored unpeppered
    # would stop verifying) and can only be exercised against a real cluster.
    template: secret.yaml
    set:
      auth.passwordPepper: ""
    asserts:
      - matchRegex:
          path: stringData["auth__password_pepper"]
          pattern: "^[A-Za-z0-9]{32,}$"

  - it: renders no Secret at all when an existingSecret is supplied
    template: secret.yaml
    values:
      - ../ci/existing-secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: projects an external database Secret as its own source
    template: deployment.yaml
    values:
      - ../ci/existing-secret.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-tankovault-api
    asserts:
      - contains:
          path: spec.template.spec.volumes[?(@.name=="secrets")].projected.sources
          content:
            secret:
              name: tankovault-database
              items:
                - key: url
                  path: database__url

  - it: never projects the same path twice into one volume
    # Two sources writing `database__url` would make the projected volume fail to mount.
    template: deployment.yaml
    values:
      - ../ci/existing-secret.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-tankovault-api
    asserts:
      - notContains:
          path: spec.template.spec.volumes[?(@.name=="secrets")].projected.sources[0].secret.items
          content:
            key: database__url
            path: database__url

  - it: leaves the MFA key unset when the api is not deployed
    # Only `api` reads it, so a release running the pipeline without the edge carries no key for
    # it — the same shape as the AniList key, which is generated only when `sync` is enabled.
    template: secret.yaml
    set:
      auth.mfaEncryptionKey: ""
      services.api.enabled: false
    asserts:
      - notExists:
          path: stringData["auth__mfa_encryption_key"]

  - it: honours an explicit MFA key rather than generating one
    # Rotating this key locks every enrolled account out of its second factor, so an operator
    # who supplies one is stating a value the chart must not quietly replace.
    template: secret.yaml
    set:
      auth.mfaEncryptionKey: "c3VwcGxpZWQtYnktdGhlLW9wZXJhdG9yLTMyLWJ5dGVz"
    asserts:
      - equal:
          path: stringData["auth__mfa_encryption_key"]
          value: "c3VwcGxpZWQtYnktdGhlLW9wZXJhdG9yLTMyLWJ5dGVz"
