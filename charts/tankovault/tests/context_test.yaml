suite: test the per-service render context
templates:
  - deployment.yaml
values:
  - ../ci/default-values.yaml
tests:
  - it: gives every service its own selector labels
    # The failure this guards against is severe and silent: `common.selectorLabels` derives
    # `app.kubernetes.io/name` from `common.name`, so without a per-service `nameOverride` all
    # eight Deployments would select the same pods and continually adopt each other's.
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-tankovault-api
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: tankovault-api
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: api

  - it: names the shared ServiceAccount, not a per-service one
    # `common.podSpec.common` resolves the account through `common.fullname`, which inside a
    # scoped context is the service name. Unpinned, every pod would reference an account that
    # was never created and fail to schedule.
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-tankovault-worker
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-tankovault
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  # A per-service override must reach exactly one service. Split across two tests because a
  # `documentSelector` only filters at test level — placing it on an individual assert silently
  # leaves that assert pointed at document 0.
  - it: applies a per-service override to the service that declares it
    set:
      defaults.revisionHistoryLimit: 7
      services.worker.revisionHistoryLimit: 2
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-tankovault-worker
    asserts:
      - equal:
          path: spec.revisionHistoryLimit
          value: 2

  - it: leaves the other services on the shared default
    set:
      defaults.revisionHistoryLimit: 7
      services.worker.revisionHistoryLimit: 2
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-tankovault-api
    asserts:
      - equal:
          path: spec.revisionHistoryLimit
          value: 7

  - it: binds each service to its own port and image
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-tankovault-control-plane
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8081
      - equal:
          path: spec.template.spec.containers[0].name
          value: control-plane
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^timschoenle/tankovault-control-plane:v[0-9.]+@sha256:[0-9a-f]{64}$"

  - it: does not render a disabled service
    set:
      services.render.enabled: false
    asserts:
      - not: true
        containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: RELEASE-NAME-tankovault-render

  - it: pins every image by digest
    # A mutable tag on any of nine images would make a rollout non-reproducible.
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "@sha256:[0-9a-f]{64}$"
