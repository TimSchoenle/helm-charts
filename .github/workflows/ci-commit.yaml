name: CI Commit

# Commits what `CI` generated on a pull request. A pull_request run executes the pull
# request's own copy of its workflow, so a job there holding the maintenance App's key hands it to
# anyone who can push a branch. This workflow_run job runs the default branch's copy, which a pull
# request cannot change, and only reads the patch the pull_request run uploaded: commit-patch refuses
# anything outside allowed_paths or made from another head, and nothing from the branch executes.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

# One queue per pull request branch, keyed on the head repository too. Runs wait rather than
# cancel: an older run completing late (a re-run, say) must not drop the run for the current
# head, and its own patch is skipped as branch_moved by commit-patch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}:${{ github.event.workflow_run.head_branch }}
  queue: max

permissions: {}

jobs:
  # Holds no secret and no environment. The pull_request run uploads the patch empty when nothing
  # changed and not at all when the job making it was skipped; in both cases there is nothing to
  # commit, so the commit job below is skipped without minting a token.
  find-patch:
    name: Find The Patch
    # A finished pull_request run, not a cancelled one: another job failing does not make the patch
    # wrong. From a branch of this repository, never the default branch.
    if: >-
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # to list and download the pull_request run's artifacts
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
      charts_changed: ${{ steps.touched.outputs.charts_changed }}
      readme_changed: ${{ steps.touched.outputs.readme_changed }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # Validates the patch exactly as commit-patch will, against the head the pull_request run
      # checked out, and reports whether it holds anything to commit. Nothing in it is executed.
      - name: Find The Patch
        id: patch
        uses: TimSchoenle/actions/actions/common/find-patch@7b20a67f0b18a6e64c30e5f47c92636729f6ad41 # tag=actions-common-find-patch-v1.1.0
        with:
          run_id: ${{ github.event.workflow_run.id }}
          artifact_name: chart-docs
          expected_head_sha: ${{ github.event.workflow_run.head_sha }}

      # Only the paths the validated patch names are read; nothing in it is executed.
      # Which half moved selects one of three fixed sentences for the pull request comment.
      - name: Note Which Files The Patch Touches
        id: touched
        if: steps.patch.outputs.has_changes == 'true'
        env:
          PATCH: ${{ steps.patch.outputs.directory }}/changes.patch
        run: |
          set -euo pipefail
          touched() {
            if grep -Eq "$1" "${PATCH}"; then echo true; else echo false; fi
          }
          {
            echo "charts_changed=$(touched '^diff --git a/(charts/|\.github/testdata/common-fixture/Chart\.yaml )')"
            echo "readme_changed=$(touched '^diff --git a/README\.md ')"
          } >> "$GITHUB_OUTPUT"

  # The half of the documentation pair that holds the App token. It runs nothing from the
  # checkout, which is there only for git's objects: the patch is applied on top of the pull
  # request's head commit by `common/commit-patch`, from git's object store, and refused whole if
  # it touches any path outside `allowed_paths`.
  #
  # A failed CI run still commits: the documentation job fails when a generator failed, and what the
  # others produced is still committed — the reason for the `continue-on-error` chain there.
  docs-commit:
    name: Commit Documentation
    needs: [find-patch]
    if: needs.find-patch.outputs.has_changes == 'true'
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # to download the patch from the pull_request run
      contents: read # to fetch the commit the patch applies to
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # Only git's objects are needed. Nothing in this checkout is executed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write # to commit the patch to the pull request's branch
          permission-pull-requests: write # to comment on the pull request

      # The artifact name is a literal, not the documentation job's output: that job ran the pull
      # request's code. The allowlist is every file a generator there writes, and nothing else:
      #
      #   charts/*/Chart.yaml           both version bumps, the `kubeVersion` floor
      #   charts/*/values.yaml          the schema repins, the contract `@schema` blocks, helm-schema's
      #                                 schema reference
      #   charts/*/values.schema.json   `just schema`, and the repins
      #   charts/*/README.md            helm-docs
      #   charts/*/README.md.gotmpl     the contract sync's credential reference
      #   charts/*/contracts/**/*.json  the contract sync's refreshed contracts, at any depth a
      #                                 chart's `images[].contract` names
      #   .github/testdata/common-fixture/Chart.yaml  the library pin `bump-common-version` moves
      #   README.md                     the chart index
      #
      # A generator that starts writing another file fails this step until the line is added here.
      # If a push landed after the documentation job checked out, the patch is skipped with
      # `outcome: branch_moved`; the new head starts a new run, which regenerates.
      - name: Commit documentation changes
        id: commit
        uses: TimSchoenle/actions/actions/common/commit-patch@7b20a67f0b18a6e64c30e5f47c92636729f6ad41 # tag=actions-common-commit-patch-v1.3.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          run_id: ${{ github.event.workflow_run.id }}
          branch: ${{ github.event.workflow_run.head_branch }}
          expected_head_sha: ${{ github.event.workflow_run.head_sha }}
          artifact_name: chart-docs
          allowed_paths: >-
            charts/*/Chart.yaml
            charts/*/values.yaml
            charts/*/values.schema.json
            charts/*/README.md
            charts/*/README.md.gotmpl
            charts/*/contracts/**/*.json
            .github/testdata/common-fixture/Chart.yaml
            README.md
          commit_message: "docs: update Helm chart documentation and schemas"

      # One sentence naming what the commit above carried. The lines are mutually exclusive — one
      # per combination — because the comment is a single sentence joined with "and", which
      # independent lines cannot assemble; at most one survives. Which half moved comes from the
      # patch's `diff --git` headers, read by `find-patch`, and is only ever "true" or "false", so
      # it selects a literal and never reaches the comment body itself.
      - name: Comment on PR
        if: >-
          steps.commit.outputs.changes_committed == 'true' &&
          github.event.workflow_run.pull_requests[0].number
        uses: TimSchoenle/actions/actions/common/upsert-pr-comment@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-upsert-pr-comment-v2.0.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          # Only this App's own comment is updated; a pasted marker cannot redirect the edit.
          author: '${{ steps.generate_token.outputs.app-slug }}[bot]'
          pr_url: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.workflow_run.pull_requests[0].number }}
          identifier: render-generated-files
          body_lines: |
            ${{ needs.find-patch.outputs.charts_changed == 'true' && needs.find-patch.outputs.readme_changed != 'true' && '📚 Automatically updated chart documentation and schemas.' || '' }}
            ${{ needs.find-patch.outputs.charts_changed != 'true' && needs.find-patch.outputs.readme_changed == 'true' && '📚 Automatically updated the README chart index.' || '' }}
            ${{ needs.find-patch.outputs.charts_changed == 'true' && needs.find-patch.outputs.readme_changed == 'true' && '📚 Automatically updated chart documentation and schemas and the README chart index.' || '' }}
