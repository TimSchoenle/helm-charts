name: 'Build Helm Dependencies'
description: 'Builds dependencies for all charts and for the common library test fixture'
inputs:
  fixture-path:
    description: >-
      Test-only consumer of the `common` library chart. It lives outside `charts/` so that
      chart-testing and chart-releaser never see it, which also means the loop below does
      not reach it.
    required: false
    default: '.github/testdata/common-fixture'
runs:
  using: "composite"
  steps:
    - name: Build Helm dependencies
      shell: bash
      env:
        FIXTURE_PATH: ${{ inputs.fixture-path }}
      run: |
        set -euo pipefail
        for chart_dir in charts/*/; do
          if [ -f "$chart_dir/Chart.yaml" ]; then
            echo "Building dependencies for $chart_dir"
            helm dependency update "$chart_dir"
          fi
        done
        if [ -f "$FIXTURE_PATH/Chart.yaml" ]; then
          echo "Building dependencies for $FIXTURE_PATH"
          helm dependency update "$FIXTURE_PATH"
        fi

    - name: Extract dependencies for schema generation
      shell: bash
      run: |
        set -euo pipefail
        for chart_dir in charts/*/; do
          [ -d "$chart_dir/charts" ] || continue
          for tgz in "$chart_dir"charts/*.tgz; do
            [ -f "$tgz" ] || continue
            tar -xzf "$tgz" -C "$chart_dir/charts"
          done
        done
