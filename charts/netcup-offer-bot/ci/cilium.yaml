# CiliumNetworkPolicy exposure.
#
# Named without the `-values` suffix on purpose: `ct` globs `ci/*-values.yaml` for `ct install`,
# while the render and kubeconform scripts glob `ci/*.yaml`. The kind cluster CI installs into
# runs no Cilium and has no `cilium.io/v2` CRDs, so an install would fail; this keeps render,
# schema-validation and policy-scan coverage without asking chart-testing to install it.
#
# This is the chart the FQDN rules matter most for: the bot polls a known set of provider pages,
# and under the portable engine the narrowest thing that can be said about that is "HTTPS to the
# whole internet".

discord:
  webhookUrl: "https://test.google.com/webhook"

networkPolicy:
  enabled: true
  engine: cilium
  ingress:
    enabled: true
  egress:
    enabled: true
    https:
      enabled: false
  cilium:
    description: "netcup-offer-bot: outbound to the provider pages it polls, nothing else"
    egress:
      toFQDNs:
        - matchName: www.netcup-sonderangebote.de
        - matchPattern: "*.netcup.de"
      fqdnPorts:
        - port: 443
          protocol: TCP
      dnsMatchPatterns:
        - matchPattern: "*.netcup.de"
        - matchPattern: "*.netcup-sonderangebote.de"
