{{- include "tankovault.validateValues" . }}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tankovault.serviceAccountName" . }}
  namespace: {{ include "common.namespace" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  {{- $annotations := merge (deepCopy .Values.serviceAccount.annotations) (deepCopy .Values.commonAnnotations) }}
  annotations:
    {{- with $annotations }}
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
    {{- /*
      A hook resource, so it exists before the `pre-install` migration Job that runs as it.
      Helm creates a release's own resources only after every pre-install hook has finished,
      and a Job naming a ServiceAccount that does not exist yet is never even scheduled: the
      Job controller reports `error looking up service account`, retries until the hook times
      out and takes the whole install with it.

      The weight puts it ahead of the Job at `-5`. The delete policy deliberately omits
      `hook-succeeded`: every workload in the release runs as this account and outlives the
      hook.
    */}}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
automountServiceAccountToken: false
{{- end }}
