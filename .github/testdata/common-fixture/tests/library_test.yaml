suite: common library partials
templates:
  - deployment.yaml
  - configmap.yaml
  - job.yaml
tests:
  - it: derives names and namespace
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-common-fixture
      - equal:
          path: metadata.namespace
          value: NAMESPACE

  - it: honours nameOverride and fullnameOverride
    documentSelector:
      path: kind
      value: Deployment
    set:
      fullnameOverride: custom-name
    asserts:
      - equal:
          path: metadata.name
          value: custom-name

  - it: honours namespaceOverride
    documentSelector:
      path: kind
      value: Deployment
    set:
      namespaceOverride: elsewhere
    asserts:
      - equal:
          path: metadata.namespace
          value: elsewhere

  - it: builds the standard label set
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.labels
          value:
            helm.sh/chart: common-fixture-0.0.0
            app.kubernetes.io/name: common-fixture
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/version: "1.2.3"
            app.kubernetes.io/managed-by: Helm

  - it: adds component and part-of labels when set
    documentSelector:
      path: kind
      value: Deployment
    set:
      component: api
      partOf: platform
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: api
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: platform

  # helm.sh/chart embeds the chart version, so carrying it on pods would force a rollout on
  # every chart-only bump. The selector must stay a stable subset of the pod labels.
  - it: keeps the chart version off the pod template
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notExists:
          path: spec.template.metadata.labels["helm.sh/chart"]
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: common-fixture
            app.kubernetes.io/instance: RELEASE-NAME

  - it: renders values that contain templates
    documentSelector:
      path: kind
      value: Deployment
    set:
      commonLabels:
        release-ref: "{{ .Release.Name }}"
    asserts:
      - equal:
          path: metadata.labels["release-ref"]
          value: RELEASE-NAME

  - it: defaults the image tag to appVersion
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: example/app:1.2.3

  - it: passes a tag that already embeds a digest through unchanged
    documentSelector:
      path: kind
      value: Deployment
    set:
      image.tag: v1.2.3@sha256:1111111111111111111111111111111111111111111111111111111111111111
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: example/app:v1.2.3@sha256:1111111111111111111111111111111111111111111111111111111111111111

  - it: accepts both imagePullSecret spellings
    documentSelector:
      path: kind
      value: Deployment
    set:
      imagePullSecrets:
        - regcred-short
        - name: regcred-long
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: regcred-short
            - name: regcred-long

  - it: rejects an unknown resources preset
    template: deployment.yaml
    set:
      resourcesPreset: enormous
    asserts:
      - failedTemplate:
          errorMessage: 'resourcesPreset "enormous" is not one of: large, medium, micro, nano, small'

  - it: rejects an unknown podAntiAffinity shorthand
    template: deployment.yaml
    set:
      podAntiAffinity: medium
    asserts:
      - failedTemplate:
          errorMessage: 'podAntiAffinity must be one of: soft, hard (got "medium")'

  - it: rejects a probe with no handler
    template: deployment.yaml
    set:
      livenessProbe.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "livenessProbe is enabled but defines no handler (one of: httpGet, tcpSocket, exec, grpc)"

  - it: renders a tcpSocket probe
    documentSelector:
      path: kind
      value: Deployment
    set:
      readinessProbe.enabled: true
      readinessProbe.tcpSocket.port: http
      readinessProbe.periodSeconds: 7
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 7
      # Unset fields are omitted so the Kubernetes defaults apply.
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds

  - it: soft anti-affinity prefers spreading across nodes
    documentSelector:
      path: kind
      value: Deployment
    set:
      podAntiAffinity: soft
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 100
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey
          value: kubernetes.io/hostname

  - it: appends extra volumes and mounts alongside the /tmp scratch volume
    documentSelector:
      path: kind
      value: Deployment
    set:
      extraVolumes:
        - name: cache
          emptyDir: {}
      extraVolumeMounts:
        - name: cache
          mountPath: /var/cache
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 2
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: cache
            mountPath: /var/cache

  # A caller that mounts its own /tmp must not end up with a duplicate volume mount.
  - it: yields the /tmp scratch mount to a caller-supplied one
    documentSelector:
      path: kind
      value: Deployment
    set:
      extraVolumes:
        - name: scratch
          emptyDir: {}
      extraVolumeMounts:
        - name: scratch
          mountPath: /tmp
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 1
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: scratch

  - it: strips vendor suffixes before comparing the cluster version
    documentSelector:
      path: kind
      value: Deployment
    set:
      kubeVersionOverride: 1.29.4
    asserts:
      - exists:
          path: metadata.name

  - it: lets podAnnotations override a generated checksum
    documentSelector:
      path: kind
      value: Deployment
    set:
      podAnnotations:
        checksum/configmap: pinned
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/configmap"]
          value: pinned

  - it: appends a digest of the content to a hashed name
    # A golden digest rather than a pattern: the whole point of the helper is that the same
    # content always resolves to the same name, so a value that drifts between Helm builds
    # would defeat it silently.
    template: job.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-common-fixture-migrate-c37240a5

  - it: resolves changed content to a different name
    # This is what makes an immutable resource re-appliable: a new spec is a new object rather
    # than a rejected update or a no-op that never re-runs.
    template: job.yaml
    set:
      hashedContent: changed-content
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-common-fixture-migrate-aa7da6b4

  - it: truncates the name rather than the digest
    # `common.fullname.suffixed` cuts the fullname to make room for the suffix, so the digest —
    # the only part that carries meaning — always survives intact.
    template: job.yaml
    set:
      fullnameOverride: a-very-long-release-name-that-will-not-fit-inside-sixty-three-characters
    asserts:
      - equal:
          path: metadata.name
          value: a-very-long-release-name-that-will-not-fit-ins-migrate-c37240a5
      - matchRegex:
          path: metadata.name
          pattern: ^.{1,63}$
