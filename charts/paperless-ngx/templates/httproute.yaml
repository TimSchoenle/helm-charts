{{- /*
The Gateway API counterpart of `templates/ingress.yaml`.

Delegated to the library in full: this chart publishes one Service on one set of hostnames,
which is exactly the shape `common.gateway.routes` builds — the HTTPRoute, the optional Gateway
for an install with no cluster-wide one, and the optional HTTP→HTTPS redirect route.

Validation lives in `paperless-ngx.validateValues`, so a bad gateway configuration is reported
alongside every other problem in one message rather than one `helm template` run per mistake.
The library's own `validate` still runs inside `routes`; by then there is nothing left for it to
find.
*/ -}}
