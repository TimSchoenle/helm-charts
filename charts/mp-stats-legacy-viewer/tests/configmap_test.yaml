suite: configmap
templates:
  - configmap.yaml
tests:
  - it: renders the configuration as a single TOML file
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-mp-stats-legacy-viewer
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[server\]\nbind_addr = "0\.0\.0\.0:8080"'

  # Pointing `MP_STATS_CONFIG` at this mount replaces the `/config.toml` the image ships rather
  # than layering over it, so the paths that file carried have to be restated here. Without
  # them the server falls back to workspace-relative defaults and refuses to start on a missing
  # `index.html`.
  - it: restates the paths the image's own config.toml carried
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'dist_dir = "/dist"'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'data_dir = "/dist/data"'

  - it: builds the bind address from host and port
    set:
      server.host: 127.0.0.1
      server.port: 9090
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'bind_addr = "127\.0\.0\.1:9090"'

  - it: merges the raw config tree over the derived values
    set:
      config:
        server:
          data_dir: /srv/data
        converter:
          cache:
            enabled: false
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'data_dir = "/srv/data"'
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[converter\.cache\]\nenabled = false'

  # The policy itself is derived from the shell at startup and is not configurable; what the
  # chart writes is only which Cloudflare products it has to make room for. All off by default,
  # because each one widens the policy.
  - it: renders the Content-Security-Policy defaults
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[server\.csp\]\nenabled = true'
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[server\.csp\.cloudflare\]\nscript_nonce = false\nturnstile = false\nweb_analytics = false'

  - it: admits the Cloudflare products that are switched on
    set:
      server.csp.cloudflare.scriptNonce: true
      server.csp.cloudflare.turnstile: true
      server.csp.cloudflare.webAnalytics: true
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'script_nonce = true\nturnstile = true\nweb_analytics = true'

  - it: allows the header to be turned off for a proxy that sets its own
    set:
      server.csp.enabled: false
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[server\.csp\]\nenabled = false'

  - it: appends configExtraToml verbatim
    set:
      configExtraToml: |
        [converter]
        input_dir = "/data"
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[converter\]\ninput_dir = "/data"'
