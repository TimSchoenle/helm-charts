{{- if include "tankovault.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.fullname" . }}
  namespace: {{ include "common.namespace" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  {{- with (include "common.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- /*
    Key names are configuration paths with `__` for nesting and no dots, because that is how a
    file in TANKOVAULT_SECRETS_DIR has to be named. Rendered as `stringData` so the values stay
    readable in a diff review; Kubernetes stores them base64-encoded either way.
  */}}
  {{- include "tankovault.secretData" . | nindent 2 }}
{{- end }}
