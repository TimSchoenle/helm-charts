# vim: set ft=yaml:
# yaml-language-server: $schema=https://raw.githubusercontent.com/TimSchoenle/terrace-config/main/spec/helm/v1/declaration.schema.json

# What this chart's rendered configuration must satisfy, which images decide that, and the gates
# the chart is enrolled in. A key left out takes its default (spec/helm/v1/DEFAULTS.md in
# terrace-config): the ConfigMap labelled with the release, its `config.toml`, the one image at
# `image` with its contract under the document's name, and the workloads that mount it.
# This prints the file with every default written out:
#
#   terrace-contract config show --chart portfolio

# What this chart adds to the credential reference in its README, which `just config-readme`
# generates from the contract. The rows are the contract's — every key it marks `secret: true`,
# and whether the image requires it — and these two columns are the chart's: the value an
# operator may set instead of pre-creating the Secret, and the condition under which a release
# needs the credential at all. Neither is derivable, and both are refused once they go stale: an
# entry for a key the contract stops declaring secret, or a `value` this chart's values.yaml no
# longer exposes, fails the gate.
credentials:
  - key: sentry.dsn
    value: sentry.dsn
    note: "`sentry.enabled`"

# Whether `just check-config-bindings` holds this chart's values against the keys below.
#
# Declared rather than inferred from the chart carrying markers: a chart that loses them — a
# botched edit, a spelling the parser does not recognise — would otherwise drop out of that gate's
# report without a word. With the switch here, markers without it and it without markers are both
# errors.
bindings: true

# Enrols this chart in the generated round-trip suites (`just contract-tests`). They prove what
# `just check-config` cannot: that a setting written into `config` arrives in the rendered document
# at the path the image reads it from. Each document's `tests` block states what every generated
# case has to carry before this chart will render.
tests: true

# Contract keys no chart value binds, each group with the reason it does not.
#
# One, and only because of where it travels. `server.host`, `server.port` and `logLevel` carry
# markers too, and are not entries here — they bind `IP`, `PORT` and `RUST_LOG`, which are
# `external.env` variables owned by the Dioxus toolchain and by `tracing`. The coverage rule is
# over `schema.keys` alone, so that namespace neither needs an entry here nor could be satisfied
# by one.
#
# Secret keys are not exempt by default and the one below is written out. The blanket rule
# "credentials need no marker" cannot tell a key delivered as a file from a key a chart merely
# forgot, and the second is exactly the regression this gate exists to catch.
unbound:
  - keys:
      - sentry.dsn
    reason: >-
      Delivered as a file in PORTFOLIO_SECRETS_DIR — from the Secret this chart renders, or from
      `existingSecret` under the file name `sentry__dsn` — and never written into `config.toml`,
      because the DSN embeds a bearer key for the project's ingest endpoint and a credential in
      a ConfigMap is readable by anything that can read the namespace. `sentry.dsn` is the value
      that carries it, so the binding does exist; it simply does not run through the
      configuration document the markers describe. `just check-config-secrets` is what
      reconciles that channel, and it does it from the rendered manifests rather than from a
      comment.

documents:
  - name: server

    # No exemptions. `configExtraToml` is the one value that could need one: it is appended
    # verbatim and never parsed, so keys it introduces are invisible to the renderer that would
    # have to declare them. No `ci/` values file sets it; a fixture that does needs
    # `exempt: [{values: <file>, gates: [closed], reason: ...}]`.
    tests:
      # The values every generated case carries, minus whichever of them the case is itself
      # probing. Expressed as flat dotted paths under `config`, so a collision between a baseline
      # entry and the key a case probes is a string comparison a reader can check by eye.
      baseline:
        config.csp.cloudflare.script_nonce: false

      # The chart values every generated case carries, with no exception, because without them the
      # chart refuses to render at all.
      prerequisites:
        values:
          existingSecret: portfolio-contract-probe
          legal.documents.imprint.title.en: Imprint
          legal.documents.imprint.body.en: "# Imprint\n"
          legal.documents.privacy.title.en: Privacy Policy
          legal.documents.privacy.body.en: "# Privacy Policy\n"

        reason: >-
          Twelve of this document's keys are `sentry.*`, and every one of them carries a
          `when sentry.enabled` clause — so a case probing one switches Sentry on, and
          `portfolio.validateValues` then refuses the render unless a DSN is available: an enabled
          client with nowhere to report is a CrashLoopBackOff rather than a degraded feature.
          Naming an `existingSecret` satisfies that guard without putting a credential-shaped
          string in a committed test file, which is the same reason no probe is ever synthesised
          for a `secret: true` key. It changes nothing the cases assert against — the DSN travels
          as a file in the secrets directory and is never written into `config.toml` — and the
          Secret it names does not have to exist for a template render.

          `legal.documents` is required by `values.schema.json` to carry an `imprint` and a
          `privacy` entry — the image refuses to start without both, and the schema now states
          that rather than leaving it to a runtime crash. Every case renders the chart, so every
          case needs both, with real enough content (`title` and `body`) that a document is not
          merely present but plausibly published; neither key is under `config`, so nothing here
          can collide with a probe.

      reason: >-
        `portfolio.validateValues` fails the render when `csp.hash_inline_scripts` is false while
        `csp.cloudflare.script_nonce` is true — dropping the hashes restores `'unsafe-inline'`,
        which a browser ignores as soon as the policy carries a nonce, so every document would
        render blank. Both keys are optional booleans defaulting to true, so the probe for the
        first is `false` and would walk straight into the pair. Turning the nonce off across the
        suite is the combination the chart's own tests already call legitimate: a deployment with
        no Cloudflare bot product in front of it. The entry is dropped from the case probing
        `csp.cloudflare.script_nonce` itself, which is what keeps that case proving the chart
        delivered the value rather than the baseline having supplied it.
