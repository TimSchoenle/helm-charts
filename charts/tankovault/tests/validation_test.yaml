suite: test values validation
templates:
  - serviceaccount.yaml
values:
  - ../ci/default.yaml
tests:
  - it: generates a signing secret rather than refusing to render without one
    set:
      auth.jwtSecret: ""
    asserts:
      - hasDocuments:
          count: 1

  - it: refuses a signing secret shorter than the service accepts
    set:
      auth.jwtSecret: "too-short"
    asserts:
      - failedTemplate:
          errorPattern: "at least 32 characters"

  - it: generates the per-caller tokens rather than refusing to render without them
    set:
      internal.tokens.api: ""
      internal.tokens.worker: ""
    asserts:
      - hasDocuments:
          count: 1

  - it: refuses an explicit caller token shorter than the service accepts
    # Length is checked in every profile upstream, not only in production, so a short value is
    # a boot failure on every service that reads it.
    set:
      internal.tokens.worker: "too-short"
    asserts:
      - failedTemplate:
          errorPattern: "internal.tokens.worker must be at least 32 characters"

  - it: refuses the removed shared token by name, with the migration path
    # The break this major exists for. Upstream refuses `internal.token` at boot with no
    # dual-accept window, so a release carrying it through would not degrade — every service
    # would fail to start at once. Failing the render turns that into one message.
    set:
      internal.token: "a-perfectly-long-shared-token-value"
    asserts:
      - failedTemplate:
          errorPattern: "internal.token no longer exists"

  - it: refuses mtls without an issuer to sign the certificates
    set:
      internal.identity: mtls
      internal.tls.issuerRef.name: ""
    capabilities:
      apiVersions:
        - cert-manager.io/v1
    asserts:
      - failedTemplate:
          errorPattern: "internal.tls.issuerRef.name"

  - it: refuses mtls on a cluster with no cert-manager
    set:
      internal.identity: mtls
      internal.tls.issuerRef.name: internal-ca
    asserts:
      - failedTemplate:
          errorPattern: "registers no `cert-manager.io/v1` API"

  - it: refuses a token left behind under mtls
    # A peer entry carrying the credential of the inactive mode is refused at boot. The chart
    # never emits one, which means a value set here would silently mean nothing — so it says so.
    set:
      internal.identity: mtls
      internal.tls.issuerRef.name: internal-ca
      internal.tokens.api: ci-internal-token-api-0123456789abcdef
      internal.tokens.worker: ""
    capabilities:
      apiVersions:
        - cert-manager.io/v1
    asserts:
      - failedTemplate:
          errorPattern: "internal.tokens.api is set while internal.identity=mtls"

  - it: refuses the bundled plaintext NATS under mtls
    # Under mtls a service presents its client certificate to the broker as well and requires
    # TLS on that connection. The bundled NATS serves plaintext, so every service that uses it
    # would fail to connect — a runtime failure the render can see coming.
    set:
      internal.identity: mtls
      internal.tls.issuerRef.name: internal-ca
      externalDatabase.url: ""
      externalNats.url: ""
      postgresql.enabled: true
      nats.enabled: true
    capabilities:
      apiVersions:
        - cert-manager.io/v1
    asserts:
      - failedTemplate:
          errorPattern: "internal.identity=mtls and nats.enabled=true cannot be combined"

  - it: refuses a trust bundle it is asked to create with nothing in it
    set:
      internal.identity: mtls
      internal.tls.issuerRef.name: internal-ca
      internal.tls.trustBundle.create: true
    capabilities:
      apiVersions:
        - cert-manager.io/v1
        - trust.cert-manager.io/v1alpha1
    asserts:
      - failedTemplate:
          errorPattern: "trustBundle.sources is empty"

  - it: refuses two database sources at once
    set:
      postgresql.enabled: true
      externalDatabase.url: postgres://a:b@c:5432/d
    asserts:
      - failedTemplate:
          errorPattern: "exactly one database source"

  - it: refuses no database at all
    set:
      externalDatabase.url: ""
    asserts:
      - failedTemplate:
          errorPattern: "no database configured"

  - it: refuses a partial AniList configuration when sync is enabled
    # The application credentials are issued by AniList; only the encryption key is generatable.
    set:
      anilist.clientSecret: ""
    asserts:
      - failedTemplate:
          errorPattern: "requires the AniList application credentials; missing: anilist.clientSecret"

  - it: does not demand the AniList encryption key it can generate itself
    set:
      anilist.tokenEncryptionKey: ""
    asserts:
      - hasDocuments:
          count: 1

  - it: reports every problem in one failure rather than one per run
    set:
      auth.jwtSecret: "too-short"
      anilist.clientId: ""
    asserts:
      - failedTemplate:
          errorPattern: "(?s)auth.jwtSecret must be at least 32 characters.*anilist.clientId"

  - it: generates a password for a seeded administrator rather than demanding one
    set:
      bootstrap.seedAdmin.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: refuses a challenge solver with no backend
    set:
      externalTrawl.url: ""
    asserts:
      - failedTemplate:
          errorPattern: "requires a solver backend"

  - it: refuses a worker with no NATS to consume from
    set:
      externalNats.url: ""
    asserts:
      - failedTemplate:
          errorPattern: "requires NATS JetStream"

  - it: refuses to publish a privileged service
    # control-plane, sync, render and challenge-solver expose privileged contracts; upstream
    # publishes none of them even on a single host.
    set:
      services.controlPlane.service.type: LoadBalancer
    asserts:
      - failedTemplate:
          errorPattern: "(?s)services.controlPlane.service.type is \"LoadBalancer\".*bypasses the frontend proxy"

  - it: allows publishing a privileged service when explicitly acknowledged
    set:
      services.controlPlane.service.type: LoadBalancer
      allowUnsafeExposure: true
    asserts:
      - hasDocuments:
          count: 1

  - it: refuses Cloudflare CSP concessions with no frontend to serve them
    # The frontend is the only tier that assembles a Content-Security-Policy. Silently accepting
    # the flags would leave an operator believing their edge-injected scripts are admitted.
    set:
      services.frontend.enabled: false
      cloudflare.scriptNonce: true
    asserts:
      - failedTemplate:
          errorPattern: "cloudflare.scriptNonce is set while services.frontend.enabled=false"

  - it: names both Cloudflare flags when both are stranded
    set:
      services.frontend.enabled: false
      cloudflare.scriptNonce: true
      cloudflare.turnstile: true
    asserts:
      - failedTemplate:
          errorPattern: "cloudflare.scriptNonce and cloudflare.turnstile are set"

  - it: stops checking credentials it cannot see
    # With an existingSecret the chart cannot read the values, so it does not guess at them.
    # The topology checks that do not depend on credential contents still apply.
    values:
      - ../ci/existing-secret.yaml
    set:
      externalDatabase.url: ""
      externalRedis.url: ""
    asserts:
      - hasDocuments:
          count: 1

  # A capability guard that skipped the routes instead would render clean in CI — `helm template`
  # reports the built-in API surface but no CRDs — and leave a real install succeeding with the
  # application unreachable.
  - it: refuses Gateway API exposure when the CRDs are absent
    set:
      gateway.enabled: true
      gateway.host: tankovault.example.com
      gateway.tls.enabled: true
      gateway.parentRefs:
        - name: shared-gateway
    asserts:
      - failedTemplate:
          errorPattern: "the cluster registers no `gateway.networking.k8s.io/v1` API"
