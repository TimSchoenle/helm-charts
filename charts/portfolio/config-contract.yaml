# vim: set ft=yaml:

# What this chart's rendered configuration must satisfy, and which images decide that.
#
# Per-chart and self-describing, so adding a chart never edits a central file — the same
# principle `just chart-index` already follows. `just check-config` reads this, unions the
# contracts of every image listed, and validates the rendered ConfigMap, the container
# environment and the mounted secret file names against the result. A chart with no such file is
# skipped; `documents: []` plus a `reason` is the only permitted opt-out, and
# `just check-contract-coverage` is what stops it from being escaped by forgetting.
documents:
  - name: server

    # Where the rendered document is, in the output of `helm template`.
    #
    # Matched by label rather than by name, and by `app.kubernetes.io/instance` specifically.
    # That label is `.Release.Name`, which is the one identifier neither `nameOverride` nor
    # `fullnameOverride` can move: `app.kubernetes.io/name` follows the first and every object's
    # name follows the second, so a selector written against either would silently match nothing
    # under a values file that sets it. `just render` names the release after the chart, so the
    # value below is what every rendered pair carries. A selector matching zero or several
    # objects is reported rather than resolved, so a selector that does go stale fails loudly
    # instead of turning into a skipped check.
    source:
      kind: ConfigMap
      selector: { app.kubernetes.io/instance: portfolio }
      key: config.toml
      format: toml

    # Every binary that reads this document. Their contracts are unioned; one image here, so the
    # union is the identity — as it is for every document in this repository, `tankovault`
    # included, since that chart declares one document per service rather than one shared by all
    # nine.
    images:
      - values: image
        contract: contracts/server.json

    # The pods that mount it, for the environment and secret-file gates.
    consumers:
      - workload: { kind: Deployment, selector: { app.kubernetes.io/instance: portfolio } }
        containers: [portfolio]

    # Pairs this document is not fully checked for, each with a reason.
    #
    # None. `configExtraToml` is the one value that could need one — it is appended verbatim and
    # never parsed, so keys it introduces are invisible to the renderer that would have to
    # declare them — but no `ci/` values file sets it. A fixture that does would need
    # `gates: [closed]` here.
    exempt: []
